 * Board-white panels framed in ink, mounted on a galvanised-grey wall;
 * petrol header bands carry the logo and titles; facts sit in ruled rows
 * with a bilingual key column. Safety orange is the quote action only.
 * Direction is handled with logical properties throughout. */

  --band: #0c3f3d;
  --band-deep: #072b29;
  --on-band: #ffffff;
  --on-band-2: #b7d1cd;
  --tint: #e6eeed;
  --tint-2: #f3f6f6;

  --reflect: #fbb41e;
  --error: #b42318;

  --font: 'Archivo', 'Noto Kufi Arabic', system-ui, sans-serif;
  --font-prose: 'Archivo', 'Noto Naskh Arabic', 'Noto Kufi Arabic', serif;
  --gut: clamp(1rem, 3.2vw, 3rem);
  --pad: clamp(1rem, 2.4vw, 2rem);
  --keyw: 13rem;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: light;
  scrollbar-color: #8a9b99 var(--wall);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--wall);
  color: var(--ink);
  font-family: var(--font);
  font-size: 1rem;
  line-height: 1.65;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}
:lang(en) body, html[lang=en] body { line-height: 1.55; }
img { max-width: 100%; display: block; }
h1, h2, h3, p, ul, ol, dl, dd, figure, blockquote { margin: 0; }
ul, ol { padding: 0; list-style: none; }
a { color: inherit; text-underline-offset: 0.22em; text-decoration-thickness: 1px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
::selection { background: var(--reflect); color: var(--ink); }
input, textarea { caret-color: var(--band); }
[hidden] { display: none !important; }

:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.mast :focus-visible, .band :focus-visible, .subband :focus-visible,
.foot :focus-visible, .drawer :focus-visible { outline-color: var(--reflect); }
#main:focus { outline: none; }

.vh {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip {
  position: absolute; inset-inline-start: 1rem; top: -4rem; z-index: 50;
  background: var(--ink); color: #fff; padding: 0.6rem 1rem; font-weight: 700;
}
.skip:focus { top: 0.75rem; }

.ic { display: inline-flex; width: 1.125em; height: 1.125em; flex: none; }
.ic svg { width: 100%; height: 100%; }
[dir=rtl] .flip svg { transform: scaleX(-1); }

.num, .fig {
  font-family: 'Archivo', sans-serif;
  font-variant-numeric: tabular-nums lining-nums;
}

.wrap { width: min(80rem, 100% - 2 * var(--gut)); margin-inline: auto; }
.muted { color: var(--ink-3); }

/* ---------- official strip ---------- */
.strip {
  background: var(--board);
  border-block-end: 1px solid var(--rule);
  color: var(--ink-2);
  font-size: 0.8125rem;
  line-height: 1.5;
}
.strip-in {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
  gap: 0.25rem 2rem; padding-block: 0.45rem;
}
.strip ul { display: flex; flex-wrap: wrap; gap: 0.25rem 1.5rem; }
.strip li { display: inline-flex; align-items: center; gap: 0.4rem; }
.strip .ic { color: var(--band); }
.strip .sk { color: var(--ink-3); }
.strip a { text-decoration: none; font-weight: 600; color: var(--ink); }
.strip a:hover { text-decoration: underline; }

/* ---------- masthead: the board's top band ---------- */
.mast {
  position: sticky; top: 0; z-index: 30;
  background: var(--band); color: var(--on-band);
}
.mast-in { display: flex; align-items: stretch; gap: 1.25rem; min-height: 4.25rem; }
.brand { display: flex; align-items: center; flex: none; }
.brand img { height: 2.375rem; width: auto; }
.nav { flex: 1; display: flex; justify-content: center; }
.nav ul { display: flex; }
.nav a {
  display: flex; align-items: center; height: 100%;
  padding-inline: 0.7rem; color: var(--on-band-2);
  font-size: 0.9375rem; font-weight: 500; text-decoration: none; white-space: nowrap;
  box-shadow: inset 0 -3px 0 transparent;
  transition: color 0.15s, box-shadow 0.15s;
}
:lang(en) .nav a { font-size: 0.875rem; padding-inline: 0.6rem; }
.nav a:hover { color: var(--on-band); }
.nav a[aria-current=page] { color: var(--on-band); font-weight: 700; box-shadow: inset 0 -3px 0 var(--on-band); }
.tools { display: flex; align-items: center; gap: 0.625rem; flex: none; }
.lang {
  display: inline-flex; align-items: center; justify-content: center; min-width: 2.75rem; height: 2.5rem;
  padding-inline: 0.7rem; border: 1px solid rgba(255, 255, 255, 0.45);
  color: var(--on-band); font-weight: 700; text-decoration: none; font-size: 0.9375rem;
}
.lang:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--on-band); }
.act {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  min-height: 2.75rem; padding: 0.55rem 1.15rem;
  background: var(--action); color: var(--on-action);
  font-weight: 700; font-size: 0.9375rem; text-decoration: none; white-space: nowrap;
  border-radius: 2px; transition: background 0.15s;
}
.act:hover { background: var(--action-hover); }
.menu-btn {
  display: none; width: 2.75rem; height: 2.75rem; align-items: center; justify-content: center;
  background: transparent; border: 1px solid rgba(255, 255, 255, 0.45); color: var(--on-band);
}
.menu-btn .ic { width: 1.375rem; height: 1.375rem; }

.drawer {
  position: absolute; top: 100%; inset-inline: 0;
  max-height: calc(100vh - 4.25rem); overflow-y: auto; overscroll-behavior: contain;
  background: var(--band); border-block-start: 1px solid rgba(255, 255, 255, 0.16);
  padding: 0.5rem var(--gut) 1.25rem;
  box-shadow: 0 24px 32px -16px rgba(7, 43, 41, 0.45);
}
.drawer li a {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0.95rem 0.25rem; border-block-end: 1px solid rgba(255, 255, 255, 0.12);
  color: var(--on-band); font-size: 1.0625rem; font-weight: 600; text-decoration: none;
}
.drawer li a[aria-current=page] { background: var(--band-deep); padding-inline: 0.75rem; }
.drawer .ic { color: var(--on-band-2); }
.act-block { display: flex; width: 100%; margin-block-start: 1.25rem; min-height: 3rem; }

/* ---------- page frame ---------- */
main { display: block; padding-block: clamp(1.25rem, 2.5vw, 2rem) clamp(3rem, 6vw, 5rem); }
main > * + * { margin-block-start: clamp(1.25rem, 2.5vw, 2rem); }

/* ---------- the board ---------- */
.board {
  background: var(--board);
  border: 2px solid var(--ink);
  box-shadow: 0 1px 2px rgba(15, 23, 23, 0.08), 0 22px 40px -28px rgba(15, 23, 23, 0.45);
}
.band {
  background: var(--band); color: var(--on-band);
  padding: clamp(1.25rem, 2.6vw, 2.25rem) var(--pad);
}
.band-title {
  font-size: clamp(1.75rem, 1.05rem + 2.3vw, 3.125rem);
  font-weight: 700; line-height: 1.35; text-wrap: balance;
}
:lang(en) .band-title, .band-title:lang(en) { font-weight: 700; line-height: 1.12; letter-spacing: -0.015em; font-stretch: 108%; }
h2.band-title { font-size: clamp(1.3125rem, 1rem + 1vw, 1.75rem); }
.band-alt {
  margin-block-start: 0.4rem; color: var(--on-band-2);
  font-size: clamp(0.9375rem, 0.85rem + 0.35vw, 1.125rem); font-weight: 500; line-height: 1.45;
}
.band-alt:lang(ar) { font-size: clamp(1rem, 0.9rem + 0.4vw, 1.1875rem); }
.band-lead {
  margin-block-start: 1rem; max-width: 64ch; color: #e1eeec;
  font-family: var(--font-prose); font-size: 1.125rem; line-height: 1.85;
}
:lang(en) .band-lead { line-height: 1.6; }
.band-no {
  display: inline-block; margin-block-end: 0.75rem; padding: 0.15rem 0.55rem;
  border: 1px solid rgba(255, 255, 255, 0.5); font-weight: 600; font-size: 0.875rem; color: var(--on-band);
}
.head-act { padding: 0 var(--pad) clamp(1.25rem, 2.6vw, 2rem); background: var(--band); }

/* Ruled rows: the grid gap is the rule. */
.rows {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1px; background: var(--rule);
}
.row {
  grid-column: span 4;
  display: grid; grid-template-columns: var(--keyw) minmax(0, 1fr);
  gap: 0.35rem 1.75rem; align-items: baseline;
  background: var(--board); padding: 1.05rem var(--pad);
}
.row.half { grid-column: span 2; --keyw: 9.5rem; }
.row.quarter {
  grid-column: span 1; grid-template-columns: minmax(0, 1fr); align-content: start;
  gap: 0.6rem; padding-block: 1.1rem 1.15rem;
}
.key { min-width: 0; }
.k1 { display: block; font-weight: 700; font-size: 0.9375rem; line-height: 1.45; color: var(--ink); }
.k2 { display: block; margin-block-start: 0.1rem; font-size: 0.75rem; font-weight: 500; line-height: 1.35; color: var(--ink-3); }
.k2:lang(ar) { font-size: 0.8125rem; }
/* Other-language lines and LTR numerals keep the page's alignment. */
html[dir=rtl] :is(.k2, .band-alt, .title-alt, .big[dir]) { text-align: right; }
html[dir=ltr] :is(.k2, .band-alt, .title-alt, .big[dir]) { text-align: left; }
.big[dir] { unicode-bidi: isolate; }
.val { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem 1.5rem; align-items: baseline; font-size: 1.0625rem; font-weight: 500; min-width: 0; }
.val > .v { min-width: 0; }
.val a:not(.onward) { color: var(--band); font-weight: 600; }
.row.quarter .val { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 0.35rem 1rem; }
.row.quarter .big { white-space: nowrap; }
.row.quarter .onward { padding-block-end: 0.3rem; }
.row.numbered { --keyw: 3rem; }
.row.numbered .k1 { color: var(--ink-3); font-weight: 600; }

.onward {
  display: inline-flex; align-items: center; gap: 0.35rem; justify-self: start;
  font-size: 0.875rem; font-weight: 600; color: var(--band); text-decoration: none; white-space: nowrap;
}
.onward:hover { text-decoration: underline; }
.onward .ic { width: 1rem; height: 1rem; transition: transform 0.2s var(--ease); }
.onward:hover .fwd { transform: translateX(3px); }
[dir=rtl] .onward:hover .fwd { transform: translateX(-3px); }

.big { display: block; font-size: clamp(2rem, 1.35rem + 1.7vw, 2.875rem); font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; }
.big .noun { font-family: var(--font); font-size: 1.0625rem; font-weight: 600; letter-spacing: 0; margin-inline-start: 0.2rem; }
.big .noun.solo { font-size: 1.5rem; margin: 0; }

.prose {
  font-family: var(--font-prose); font-size: 1.0625rem; font-weight: 400;
  line-height: 1.9; color: var(--ink-2); max-width: 70ch;
}
:lang(en) .prose { line-height: 1.6; }
.prose + .prose { margin-block-start: 0.85em; }
.prose-block { padding: clamp(1.25rem, 2.6vw, 2rem) var(--pad); }
.prose-block h3 { font-size: 1.25rem; font-weight: 700; margin-block-end: 0.5rem; }

.inline-list { display: flex; flex-wrap: wrap; align-items: center; row-gap: 0.25rem; }
.inline-list li { display: inline-flex; align-items: center; }
.inline-list li + li::before {
  content: ''; width: 5px; height: 5px; background: var(--band); margin-inline: 0.8rem; flex: none;
}
.scope-list { display: grid; gap: 0.4rem; }
.scope-list li { display: flex; gap: 0.9rem; align-items: baseline; }
.scope-list .num { color: var(--ink-3); font-size: 0.875rem; font-weight: 600; }

.status { display: inline-flex; align-items: center; gap: 0.55rem; font-weight: 600; }
.status .sq { width: 0.7rem; height: 0.7rem; background: var(--band); flex: none; }
.status.is-live .sq { background: transparent; box-shadow: inset 0 0 0 2px var(--band); }

.empty { padding: 1.5rem var(--pad); color: var(--ink-3); }

/* ---------- home: the contractor's board ---------- */
.home-board .band { padding-block: clamp(1.15rem, 2vw, 1.75rem); }
.home-board .band-title { font-size: clamp(1.875rem, 1.05rem + 2.4vw, 3.125rem); }
.home-board .row.quarter { padding-block: 0.95rem 1rem; gap: 0.4rem; }

.subband {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
  gap: 1rem 2rem; padding: 1rem var(--pad);
  background: var(--ink); color: var(--on-band);
}
.subband h2 .k1 { color: var(--on-band); font-size: 1.25rem; }
.subband h2 .k2 { color: #a8b8b6; font-size: 0.8125rem; }
.picker { display: flex; flex-wrap: wrap; align-items: end; gap: 0.75rem 1.5rem; }
.picker label, #pick-proj-l { display: block; font-size: 0.8125rem; font-weight: 500; color: #c3cfcd; margin-block-end: 0.35rem; }
.picker .select select { min-width: 19rem; background: var(--board); border-color: var(--board); font-weight: 600; }
.nums { display: flex; gap: 0.375rem; flex-wrap: wrap; }
.num-btn {
  width: 2.75rem; height: 2.75rem; display: inline-flex; align-items: center; justify-content: center;
  background: transparent; color: var(--on-band); border: 1px solid rgba(255, 255, 255, 0.42);
  font-weight: 600; font-size: 0.9375rem; transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.num-btn:hover { border-color: var(--on-band); }
.num-btn[aria-pressed=true] { background: var(--board); color: var(--ink); border-color: var(--board); }

.title-row .k1 { padding-block-start: 0.35rem; }
.title-val { display: block; font-size: clamp(1.375rem, 1rem + 1.15vw, 2rem); font-weight: 700; line-height: 1.4; text-wrap: balance; }
:lang(en) .title-val, .title-val:lang(en) { line-height: 1.2; letter-spacing: -0.01em; }
.title-alt { display: block; margin-block-start: 0.3rem; font-size: 0.9375rem; font-weight: 500; color: var(--ink-3); }

@keyframes settle { from { opacity: 0; transform: translateY(4px); } }
.row.swap .val { animation: settle 0.24s var(--ease) both; animation-delay: calc(var(--i, 0) * 35ms); }
.row.swap { animation: wash 0.6s var(--ease) both; }
@keyframes wash { from { background: var(--tint); } }

/* ---------- breadcrumbs, pager ---------- */
.crumbs { font-size: 0.8125rem; color: var(--ink-3); }
.crumbs ol { display: flex; flex-wrap: wrap; align-items: center; gap: 0.2rem 0.35rem; }
.crumbs li { display: inline-flex; align-items: center; gap: 0.35rem; }
.crumbs a { color: var(--ink-2); text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.crumbs [aria-current] { color: var(--ink); font-weight: 600; }
.crumbs .sep { width: 0.875rem; height: 0.875rem; }
main > .crumbs + * { margin-block-start: 0.75rem; }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--ink); border: 2px solid var(--ink); }
.pager a { display: grid; gap: 0.25rem; padding: 1rem var(--pad); background: var(--board); text-decoration: none; }
.pager a[rel=next] { text-align: end; justify-items: end; }
.pager a:hover { background: var(--tint-2); }
.pager a:hover .pv { text-decoration: underline; }
.pk { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.8125rem; color: var(--ink-3); font-weight: 600; }
.pk .ic { width: 1rem; height: 1rem; }
.pv { font-weight: 700; }

/* ---------- tabs and filters: a ruled row of cells ---------- */
.tablist, .filters {
  display: flex; overflow-x: auto; scrollbar-width: thin;
  border-block-end: 2px solid var(--ink); background: var(--tint-2);
}
.tablist [role=tab], .filters button {
  display: inline-flex; align-items: center; gap: 0.6rem; flex: none;
  padding: 0.95rem 1.25rem; background: transparent; border: 0;
  border-inline-end: 1px solid var(--rule); color: var(--ink-2); font-weight: 700; font-size: 0.9375rem;
  transition: background 0.15s, color 0.15s;
}
.tablist [role=tab]:hover, .filters button:hover { background: var(--tint); color: var(--ink); }
.tablist [aria-selected=true], .filters [aria-pressed=true] { background: var(--band); color: var(--on-band); }
.tablist .count, .filters .count { font-size: 0.8125rem; font-weight: 600; color: var(--ink-3); }
.tablist [aria-selected=true] .count, .filters [aria-pressed=true] .count { color: var(--on-band-2); }
.tablist [role=tab]:focus-visible, .filters button:focus-visible { outline-offset: -4px; }
.tabpanel:focus-visible { outline-offset: -4px; }
.rows + .tabs { border-block-start: 1px solid var(--rule); }
.rows + .filters, .filters { border-block-start: 0; }

/* ---------- registers (tables) ---------- */
.register { width: 100%; border-collapse: collapse; font-size: 1rem; }
.register thead th {
  background: var(--tint); text-align: start; font-size: 0.8125rem; font-weight: 700;
  color: var(--ink-2); padding: 0.7rem 1rem; white-space: nowrap;
}
.register thead th:first-child, .register td:first-child, .register tbody th:first-child { padding-inline-start: var(--pad); }
.register td, .register tbody th { padding: 1rem; border-block-start: 1px solid var(--rule); text-align: start; vertical-align: baseline; font-weight: 500; }
.register .c-no { width: 4.5rem; color: var(--ink-3); font-weight: 600; }
.register .c-title { font-weight: 700; }
.register .c-title a { text-decoration: none; color: var(--ink); }
.register .c-title a:hover { text-decoration: underline; color: var(--band); }
.register tbody tr:hover { background: var(--tint-2); }
.register .c-act { text-align: end; }

/* ---------- services schedule ---------- */
.schedule > li {
  display: grid; grid-template-columns: 17rem minmax(0, 1fr) 10rem 2.75rem;
  gap: 1rem 2rem; align-items: start; padding: 1.35rem var(--pad);
  border-block-start: 1px solid var(--rule);
}
.schedule > li:first-child { border-block-start: 0; }
.sch-title { text-decoration: none; }
.sch-title .k1 { font-size: 1.125rem; line-height: 1.45; }
.sch-title:hover .k1 { color: var(--band); text-decoration: underline; }
.sch-body .prose { font-size: 1rem; }
.sch-body .inline-list { margin-block-start: 0.6rem; font-size: 0.875rem; font-weight: 600; color: var(--ink); }
.sch-count { font-size: 0.9375rem; font-weight: 600; }
.sch-count .fig { font-size: 1.375rem; }
.sch-count .muted { font-size: 0.8125rem; font-weight: 500; }
.sch-go {
  width: 2.75rem; height: 2.75rem; display: inline-flex; align-items: center; justify-content: center;
  border: 1.5px solid var(--ink); color: var(--ink);
}
.sch-go:hover { background: var(--ink); color: var(--on-band); }

/* ---------- about ---------- */
.ticks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--rule); }
.ticks li { display: flex; gap: 0.75rem; align-items: baseline; padding: 1.1rem var(--pad); background: var(--board); font-weight: 600; font-size: 1.0625rem; }
.ticks .ic { color: var(--band); transform: translateY(0.15em); }

/* ---------- journey, certifications ---------- */
.year { font-size: 1.5rem !important; color: var(--ink) !important; }
.iso { font-size: 1.0625rem; }
.v-title { display: block; font-weight: 700; font-size: 1.0625rem; margin-block-end: 0.15rem; }

.docreq {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem 2rem;
  padding: 1.25rem var(--pad); background: var(--tint-2); border-block-start: 1px solid var(--rule);
}
.docreq h2 { font-size: 1rem; font-weight: 700; }
.docreq p { font-size: 0.875rem; color: var(--ink-3); }

/* ---------- buttons ---------- */
.btn-line, .btn-ink {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.55rem;
  min-height: 2.75rem; padding: 0.6rem 1.15rem; font-weight: 700; font-size: 0.9375rem;
  text-decoration: none; border-radius: 2px; transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.btn-line { background: var(--board); color: var(--ink); border: 1.5px solid var(--ink); }
.btn-line:hover { background: var(--ink); color: var(--on-band); }
.btn-line.sm { min-height: 2.5rem; padding: 0.4rem 0.9rem; font-size: 0.875rem; }
.btn-line.on-band { background: transparent; color: var(--on-band); border-color: rgba(255, 255, 255, 0.6); }
.btn-line.on-band:hover { background: var(--on-band); color: var(--band); }
.btn-ink { background: var(--ink); color: var(--on-band); border: 0; min-height: 3rem; padding-inline: 1.5rem; }
.btn-ink:hover { background: var(--band); }
.btn-ink[disabled] { opacity: 0.7; cursor: progress; }

/* ---------- forms: a board you fill in ---------- */
.form .rows { grid-template-columns: minmax(0, 1fr); }
.frow { grid-column: 1 / -1; align-items: start; }
.frow .k1 { padding-block-start: 0.65rem; }
.frow .val { display: block; font-weight: 400; }
input:not([type=file]), select, textarea {
  scroll-margin-block: 7rem 2rem;
  width: 100%; min-height: 2.875rem; padding: 0.6rem 0.85rem;
  background: var(--board); border: 1px solid var(--field); border-radius: 0;
  font-size: 1rem; line-height: 1.5; color: var(--ink);
  transition: border-color 0.15s, box-shadow 0.15s;
}
textarea { resize: vertical; min-height: 8rem; }
input::placeholder, textarea::placeholder { color: var(--ink-3); opacity: 1; }
input:hover, select:hover, textarea:hover { border-color: var(--ink); }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--band); outline-offset: 0; border-color: var(--band); }
[aria-invalid=true] { border-color: var(--error) !important; box-shadow: inset 0 0 0 1px var(--error); }
[aria-invalid=true]:focus-visible { outline-color: var(--error); }
.select { position: relative; display: block; }
.select select { appearance: none; -webkit-appearance: none; padding-inline-end: 2.5rem; cursor: pointer; }
.select .ic { position: absolute; inset-inline-end: 0.75rem; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--ink-2); }
.err { display: flex; gap: 0.4rem; align-items: center; margin-block-start: 0.45rem; color: var(--error); font-size: 0.875rem; font-weight: 600; }
.hint { display: block; margin-block-start: 0.4rem; font-size: 0.8125rem; color: var(--ink-3); }
.sub-label { display: block; font-size: 0.8125rem; font-weight: 600; color: var(--ink-2); margin-block-end: 0.3rem; }
.file-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.9rem; margin-block-start: 0.85rem; }
.file-row .sub-label { margin: 0; flex-basis: 100%; }
.file-row:has(#a-file:focus-visible) label { outline: 3px solid var(--ink); outline-offset: 2px; }
.form-foot {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem;
  padding: 1.15rem var(--pad); border-block-start: 1px solid var(--rule); background: var(--tint-2);
}
.proto {
  font-size: 0.8125rem; color: var(--ink-3); padding: 0.45rem 0.75rem;
  background: var(--board); border: 1px solid var(--rule);
}
.status-host:empty { display: none; }
.notice {
  display: flex; gap: 0.75rem; align-items: flex-start; margin: 0 var(--pad) var(--pad); padding: 1rem 1.15rem;
  border: 1px solid var(--band); background: var(--tint);
}
.notice .ic { color: var(--band); margin-block-start: 0.2rem; }
.notice strong { display: block; }
.notice span { display: block; color: var(--ink-2); font-size: 0.875rem; margin-block-start: 0.2rem; }

.contact { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: clamp(1.25rem, 2.5vw, 2rem); align-items: start; }
.office .row { --keyw: 7rem; }
.office .line { display: block; }

/* ---------- leadership ---------- */
.leaders { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(1.25rem, 2.5vw, 2rem); align-items: start; }
.band-person { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 1.25rem; align-items: end; }
.band-person .band-title { font-size: clamp(1.25rem, 1rem + 0.8vw, 1.625rem); }
.role { margin-block-start: 0.6rem; font-weight: 700; color: var(--on-band); font-size: 0.9375rem; }
.portrait { position: relative; aspect-ratio: 4 / 5; background: var(--band-deep); border: 1px solid rgba(255, 255, 255, 0.28); overflow: hidden; }
.portrait img { position: relative; width: 100%; height: 100%; object-fit: cover; }
.no-photo {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 0.4rem; padding: 0.5rem; text-align: center; color: var(--on-band-2); font-size: 0.6875rem; line-height: 1.3;
}
.no-photo .ic { width: 2.25rem; height: 2.25rem; }
.leader .row { --keyw: 8.5rem; }
.quote-board blockquote { padding: clamp(1.5rem, 4vw, 3rem) var(--pad); }
.quote-board blockquote p {
  font-family: var(--font-prose); font-size: clamp(1.25rem, 1rem + 0.9vw, 1.75rem); line-height: 1.9;
  font-weight: 500; color: var(--ink); max-width: 46ch; text-wrap: pretty;
}
:lang(en) .quote-board blockquote p { line-height: 1.5; }
.quote-board figcaption { display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; align-items: baseline; padding: 1rem var(--pad); border-block-start: 1px solid var(--rule); }
.quote-board figcaption span { color: var(--ink-3); }

/* ---------- footer: brand + sitemap ---------- */
.foot { background: var(--band-deep); color: var(--on-band-2); padding-block: clamp(2.5rem, 5vw, 3.5rem) 1.5rem; }
.foot-in { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 2rem 4rem; }
.foot-brand img { height: 2.5rem; width: auto; }
.foot-brand p { margin-block-start: 1rem; max-width: 44ch; font-size: 0.9375rem; line-height: 1.75; }
.foot h2 { font-size: 0.875rem; font-weight: 700; color: var(--on-band); margin-block-end: 0.75rem; }
.sitemap { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.15rem 1.5rem; }
.sitemap a { display: inline-block; padding-block: 0.35rem; color: #dcebe8; text-decoration: none; font-size: 0.9375rem; }
.sitemap a:hover { color: var(--on-band); text-decoration: underline; }
.foot-base { margin-block-start: 2.25rem; padding-block-start: 1rem; border-block-start: 1px solid rgba(255, 255, 255, 0.14); font-size: 0.8125rem; }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {

  .tools { margin-inline-start: auto; }

}

  .contact, .leaders { grid-template-columns: minmax(0, 1fr); }
}

  .register .c-no { width: auto; font-size: 0.8125rem; }
  .register .c-act { text-align: start; margin-block-start: 0.6rem; }
}
@media (max-width: 560px) {

  .tools { gap: 0.4rem; }

  .lang { min-width: 2.75rem; padding-inline: 0.5rem; }
  .menu-btn { width: 2.75rem; }

@media (max-width: 380px) {

}

    Truck: { slug: 'equipment-rental', type: 'equipment-rental', cats: [] },
    Settings: { slug: 'operation-maintenance', type: 'other', cats: [] },
  };
  const PROJECT_TYPE = { water: 'water-sewerage', roads: 'roads-asphalt', urban: 'urban-development', electrical: 'other' };
  const slugify = (x) => String(x).toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const projectSlug = (id) => slugify(content.en.projects.items.find((p) => p.id === id)?.title || id);

  const state = { lang: 'ar', page: '', sub: '', board: { disc: 0, proj: 1 }, filter: 'all', prefill: null, role: '', tabs: {}, jump: null };

  // ---------- helpers ----------
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const icon = (name, cls = '') => `<span class="ic ${cls}" aria-hidden="true">${icons[name] || ''}</span>`;
  const other = () => (state.lang === 'ar' ? 'en' : 'ar');
  const t = (lang = state.lang) => content[lang];
  const ui = (lang = state.lang) => UI[lang];
  const rtl = () => state.lang === 'ar';
  const fwd = () => icon(rtl() ? 'arrow-left' : 'arrow-right', 'fwd');
  const href = (page, lang = state.lang) => `#/${lang === 'en' ? 'en/' : ''}${page}`;
  const $ = (sel, el = document) => el.querySelector(sel);
  const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
  const svc = (s) => SERVICE[s.icon] || SERVICE.Settings;
  const svcSlug = (s) => svc(s).slug;
  const svcIndex = (slug) => t().services.items.findIndex((x) => svcSlug(x) === slug);
  const projById = (id, lang = state.lang) => t(lang).projects.items.find((p) => p.id === id);
  const projBySlug = (slug) => t().projects.items.find((p) => projectSlug(p.id) === slug);
  const projDisc = (p) => t().services.items.findIndex((s) => svc(s).cats.includes(p.key));
  const discProjects = (i) => t().projects.items.filter((p) => svc(t().services.items[i]).cats.includes(p.key));
  const done = (p) => /complete|مكتمل/i.test(p.status);
  const no = (n) => String(n).padStart(2, '0');
  const altAttrs = () => `lang="${other()}" dir="${other() === 'ar' ? 'rtl' : 'ltr'}"`;

  // Arabic counted nouns: 1 and 2 have their own forms and stand without
  // a numeral (مشروع واحد، مشروعان), 3–10 take the plural, 11 and above the singular
  // accusative. English: singular for 1, plural otherwise.
  function counted(n, key) {
    const f = ui().tally[key];
    const fig = (x) => `<span class="fig">${x}</span>`;
    if (state.lang === 'en') return `${fig(n)} <span class="noun">${esc(n === 1 ? f[0] : f[1])}</span>`;
    if (n === 1) return `<span class="noun solo">${esc(f[0])}</span>`;
    if (n === 2) return `<span class="noun solo">${esc(f[1])}</span>`;
    return `${fig(n)} <span class="noun">${esc(n <= 10 ? f[2] : f[3])}</span>`;
  }

  // A bilingual board key: the current language first, the other beneath.
  const key = (pick) => `<span class="k1">${esc(pick(t(), ui()))}</span><span class="k2" ${altAttrs()}>${esc(pick(t(other()), ui(other())))}</span>`;

  // One ruled row of a board. size: full | half | quarter.
  function row(k, v, { size = 'full', id = '', link = '', cls = '' } = {}) {
    return `<div class="row ${size} ${cls}"${id ? ` data-k="${id}"` : ''}><dt class="key">${k}</dt><dd class="val"><div class="v">${v}</div>${link}</dd></div>`;
  }
  const onward = (page, label) => `<a class="onward" href="${href(page)}">${esc(label)}${fwd()}</a>`;
  const navLabel = (id) => t().nav.find((n) => n.id === id)?.label || '';

  function statusMark(p) {
    return `<span class="status ${done(p) ? 'is-done' : 'is-live'}"><span class="sq" aria-hidden="true"></span>${esc(p.status)}</span>`;
  }

  function parseHash() {
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    let lang = 'ar';
    if (parts[0] === 'en') { lang = 'en'; parts.shift(); }
    const page = PAGES.includes(parts[0] || '') ? (parts[0] || '') : '';
    let sub = parts[1] || '';
    if (page === 'services' && !Object.values(SERVICE).some((s) => s.slug === sub)) sub = '';
    if (page === 'projects' && !content.en.projects.items.some((p) => projectSlug(p.id) === sub)) sub = '';
    if (page !== 'services' && page !== 'projects') sub = '';
    return { lang, page, sub };
  }

  function go(page, opts = {}) {
    if (opts.prefill !== undefined) state.prefill = opts.prefill;
    const target = href(page);
    if (location.hash === target) render(true); else location.hash = target;
  }

  // ---------- official strip, masthead, footer ----------
  function strip() {
    const T = t(), U = ui();
    return `<div class="wrap strip-in">
      <ul class="creds">
        <li><span class="sk">${esc(U.cr)}</span> <span class="num">${esc(CO.cr)}</span></li>
        <li>${icon('shield-check')}${esc(T.why.items[1])}</li>
      </ul>
      <ul class="reach">
        <li><span class="sk">${esc(U.phone)}</span> <a href="tel:${CO.phone.replace(/\s/g, '')}" dir="ltr" class="num">${esc(CO.phone)}</a></li>
        <li><span class="sk">${esc(U.email)}</span> <a href="mailto:${CO.email}" dir="ltr">${esc(CO.email)}</a></li>
      </ul>
    </div>`;
  }

  function mast() {
    const T = t(), U = ui();
    const items = [...T.nav, { id: 'careers', label: T.navCareers }];
    const cur = (id) => (state.page === id ? ' aria-current="page"' : '');
    const here = state.sub ? `${state.page}/${state.sub}` : state.page;
    const o = other();
    return `
      <div class="wrap mast-in">
        <a class="brand" href="${href('')}"><img src="${logo}" alt="${esc(T.brandLine)}" width="152" height="40" /></a>
        <nav class="nav" aria-label="${esc(U.menu)}"><ul>${items.map((n) => `<li><a href="${href(n.id)}"${cur(n.id)}>${esc(n.label)}</a></li>`).join('')}</ul></nav>
        <div class="tools">
          <a class="lang" href="${href(here, o)}" hreflang="${o}" lang="${o}" aria-label="${esc(U.langLabel)}">${esc(T.langBtn)}</a>
          <a class="act" href="${href('contact')}" data-quote>${esc(U.quote)}</a>
          <button class="menu-btn" type="button" aria-expanded="false" aria-controls="drawer" aria-label="${esc(U.menu)}">${icon('menu')}</button>
        </div>
      </div>
      <div class="drawer" id="drawer" hidden>
        <ul>${items.map((n) => `<li><a href="${href(n.id)}"${cur(n.id)}>${esc(n.label)}${fwd()}</a></li>`).join('')}</ul>
        <a class="act act-block" href="${href('contact')}" data-quote>${esc(U.quote)}</a>
      </div>`;
  }

  function foot() {
    const T = t(), F = T.footer;
    return `<div class="wrap foot-in">
      <div class="foot-brand"><img src="${logo}" alt="${esc(T.brandLine)}" width="152" height="40" loading="lazy" /><p>${esc(F.tagline)}</p></div>
      <nav aria-label="${esc(F.quickLinks)}"><h2>${esc(F.quickLinks)}</h2>
        <ul class="sitemap">${[{ id: '', label: ui().home }, ...T.nav, { id: 'careers', label: T.navCareers }].map((n) => `<li><a href="${href(n.id)}">${esc(n.label)}</a></li>`).join('')}</ul>
      </nav>
    </div>
    <div class="wrap foot-base"><span>${esc(F.rights)}</span></div>`;
  }

  // ---------- board pieces ----------
  // The title band every page opens with: title, its other-language twin, lead.
  function band(title, altTitle, lead = '', { level = 1, id = 'pt' } = {}) {
    return `<header class="band">
      <h${level} class="band-title" id="${id}">${esc(title)}</h${level}>
      ${altTitle ? `<p class="band-alt" ${altAttrs()}>${esc(altTitle)}</p>` : ''}
      ${lead ? `<p class="band-lead">${esc(lead)}</p>` : ''}
    </header>`;
  }

  function crumbs(trail) {
    const U = ui();
    return `<nav class="crumbs wrap" aria-label="${esc(U.crumbs)}"><ol>
      <li><a href="${href('')}">${esc(U.home)}</a></li>
      ${trail.map(([label, page], i) => `<li>${icon(rtl() ? 'chevron-left' : 'chevron-right', 'sep')}${i === trail.length - 1 ? `<span aria-current="page">${esc(label)}</span>` : `<a href="${href(page)}">${esc(label)}</a>`}</li>`).join('')}
    </ol></nav>`;
  }

  // Page head board: band only, sitting at the top of the page.
  function head(title, altTitle, lead) {
    return `<section class="wrap"><div class="board head-board">${band(title, altTitle, lead)}</div></section>`;
  }

  // Accessible tabs: arrow keys follow the reading direction.
  function tabs(id, label, items) {
    const cur = items.some((i) => i.key === state.tabs[id]) ? state.tabs[id] : items[0].key;
    return `
      <div class="tabs" data-tabs="${id}">
        <div class="tablist" role="tablist" aria-label="${esc(label)}">${items.map((it) => `<button type="button" role="tab" id="tab-${id}-${it.key}" aria-controls="panel-${id}-${it.key}" aria-selected="${cur === it.key}" tabindex="${cur === it.key ? 0 : -1}" data-tab="${id}" data-key="${it.key}"><span>${esc(it.label)}</span>${it.count !== undefined ? `<span class="count num">${it.count}</span>` : ''}</button>`).join('')}</div>
        ${items.map((it) => `<div class="tabpanel" role="tabpanel" id="panel-${id}-${it.key}" aria-labelledby="tab-${id}-${it.key}" tabindex="0"${cur === it.key ? '' : ' hidden'}>${it.html}</div>`).join('')}
      </div>`;
  }
  function selectTab(btn, focus) {
    const id = btn.dataset.tab, k = btn.dataset.key;
    state.tabs[id] = k;
    const box = btn.closest('.tabs');
    $$('[role=tab]', box).forEach((b) => { const on = b === btn; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; });
    $$('[role=tabpanel]', box).forEach((p) => { p.hidden = p.id !== `panel-${id}-${k}`; });
    if (focus) btn.focus();
  }

  // Numbered register rows (projects): used on Projects, service and project pages.
  function register(items, caption) {
    const P = t().projects, U = ui();
    return `<table class="register">
      <caption class="vh">${esc(caption)}</caption>
      <thead><tr><th scope="col" class="c-no">${esc(U.no)}</th><th scope="col">${esc(U.project)}</th><th scope="col">${esc(P.labels.client)}</th><th scope="col">${esc(P.labels.location)}</th><th scope="col">${esc(P.labels.status)}</th></tr></thead>
      <tbody>${items.map((p) => `<tr>
        <td class="c-no num">${no(p.id)}</td>
        <th scope="row" class="c-title"><a href="${href(`projects/${projectSlug(p.id)}`)}">${esc(p.title)}</a></th>
        <td data-k="${esc(P.labels.client)}">${esc(p.client)}</td>
        <td data-k="${esc(P.labels.location)}">${esc(p.location)}</td>
        <td data-k="${esc(P.labels.status)}">${statusMark(p)}</td>
      </tr>`).join('')}</tbody>
    </table>`;
  }

  // ---------- the live board (home) ----------
  function liveRows() {
    const T = t(), P = T.projects, U = ui();
    const { disc, proj } = state.board;
    const s = T.services.items[disc];
    const p = proj ? projById(proj) : null;
    if (!p) {
      const alt = t(other()).services.items[disc];
      return `<dl class="rows" id="live-rows">
        ${row(key((c, u) => u.discipline), `<span class="title-val">${esc(s.title)}</span><span class="title-alt" ${altAttrs()}>${esc(alt.title)}</span>`, { id: 'title', cls: 'title-row' })}
        ${row(key((c) => c.projects.labels.scope), `<ul class="inline-list">${s.capabilities.map((c) => `<li>${esc(c)}</li>`).join('')}</ul>`, { id: 'scope' })}
        ${row(key((c, u) => u.published), `<span class="muted">${esc(U.noProjects)}</span>`, { id: 'owner', link: onward(`services/${svcSlug(s)}`, U.disciplinePage) })}
      </dl>`;
    }
    const alt = projById(p.id, other());
    const di = projDisc(p);
    const ds = T.services.items[di];
    return `<dl class="rows" id="live-rows">
      ${row(key((c, u) => u.projectName), `<span class="title-val">${esc(p.title)}</span><span class="title-alt" ${altAttrs()}>${esc(alt.title)}</span>`, { id: 'title', cls: 'title-row' })}
      ${row(key((c) => c.projects.labels.client), esc(p.client), { size: 'half', id: 'owner' })}
      ${row(key((c, u) => u.contractor), esc(T.brandLine), { size: 'half', id: 'contractor' })}
      ${row(key((c) => c.projects.labels.location), esc(p.location), { size: 'half', id: 'location' })}
      ${row(key((c) => c.projects.labels.status), statusMark(p), { size: 'half', id: 'status' })}
      ${row(key((c, u) => u.category), esc(p.category), { size: 'half', id: 'category' })}
      ${row(key((c, u) => u.discipline), ds ? `<a href="${href(`services/${svcSlug(ds)}`)}">${esc(ds.title)}</a>` : '', { size: 'half', id: 'discipline' })}
      ${row(key((c) => c.projects.labels.scope), `<ul class="inline-list">${p.scope.map((c) => `<li>${esc(c)}</li>`).join('')}</ul>`, { id: 'scope', link: onward(`projects/${projectSlug(p.id)}`, U.fullBoard) })}
    </dl>`;
  }

  function picker() {
    const T = t(), U = ui();
    const { disc, proj } = state.board;
    return `<div class="picker">
      <div class="pick-disc">
        <label for="pick-disc">${esc(U.pickDiscipline)}</label>
        <span class="select">${icon('chevron-down')}<select id="pick-disc">${T.services.items.map((s, i) => `<option value="${i}"${i === disc ? ' selected' : ''}>${esc(s.title)}</option>`).join('')}</select></span>
      </div>
      <div class="pick-proj" role="group" aria-labelledby="pick-proj-l">
        <span id="pick-proj-l">${esc(U.pickProject)}</span>
        <div class="nums">${T.projects.items.map((p) => `<button type="button" class="num-btn num" data-pick="${p.id}" aria-pressed="${p.id === proj}" aria-label="${esc(p.title)}" title="${esc(p.title)}">${no(p.id)}</button>`).join('')}</div>
      </div>
    </div>`;
  }

  function pageHome() {
    const T = t(), U = ui(), C = T.certifications, S = T.stats;
    const P = T.projects.items;
    const statKey = (i) => key((c) => c.stats[i].label);
    return `
      <section class="wrap home">
        <article class="board home-board" aria-labelledby="pt">
          ${band(T.brandLine, t(other()).brandLine, '', { level: 1 })}
          <dl class="rows">
            ${row(key((c, u) => u.activity), `<p class="prose">${esc(T.hero.lead)}</p>`, { link: onward('about', navLabel('about')) })}
            ${row(statKey(0), `<span class="big num" dir="ltr">${esc(S[0].value)}</span>`, { size: 'quarter', link: onward('journey', navLabel('journey')) })}
            ${row(statKey(1), `<span class="big num" dir="ltr">${esc(S[1].value)}</span>`, { size: 'quarter', link: onward('leadership', navLabel('leadership')) })}
            ${row(statKey(2), `<span class="big num" dir="ltr">${esc(S[2].value)}</span>`, { size: 'quarter', link: onward('equipment', navLabel('equipment')) })}
            ${row(statKey(3), `<span class="big num" dir="ltr">${esc(S[3].value)}</span>`, { size: 'quarter' })}
            ${row(key((c) => c.certifications.isoHeading), `<span class="big">${counted(C.iso.length, 'certs')}</span>`, { size: 'quarter', link: `<a class="onward" href="${href('certifications')}" data-settab="certs:iso">${esc(navLabel('certifications'))}${fwd()}</a>` })}
            ${row(key((c) => c.certifications.approvalsHeading), `<span class="big">${counted(C.approvals.length, 'entities')}</span>`, { size: 'quarter', link: `<a class="onward" href="${href('certifications')}" data-settab="certs:approvals">${esc(navLabel('certifications'))}${fwd()}</a>` })}
            ${row(key((c, u) => u.disciplines), `<span class="big">${counted(T.services.items.length, 'disciplines')}</span>`, { size: 'quarter', link: onward('services', navLabel('services')) })}
            ${row(key((c, u) => u.projects), `<span class="big">${counted(P.length, 'projects')}</span>`, { size: 'quarter', link: onward('projects', navLabel('projects')) })}
          </dl>
          <section class="live" aria-labelledby="live-h">
            <div class="subband">
              <h2 id="live-h"><span class="k1">${esc(U.projectBoard)}</span><span class="k2" ${altAttrs()}>${esc(ui(other()).projectBoard)}</span></h2>
              ${picker()}
            </div>
            <div id="live" aria-live="polite">${liveRows()}</div>
          </section>
        </article>
      </section>`;
  }

  function swapLive() {
    const host = $('#live');
    if (!host) return;
    const before = Object.fromEntries($$('.row', host).map((r) => [r.dataset.k, r.textContent]));
    host.innerHTML = liveRows();
    let i = 0;
    $$('.row', host).forEach((r) => {
      if (before[r.dataset.k] !== r.textContent) { r.style.setProperty('--i', i++); r.classList.add('swap'); }
    });
    const sel = $('#pick-disc'); if (sel) sel.value = String(state.board.disc);
    $$('[data-pick]').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.pick) === state.board.proj)));
  }

  // ---------- pages ----------
  function pageAbout() {
    const T = t(), I = T.intro, W = T.why;
    // The first four reasons are facts that already live on their own pages
    // (ISO, NWC approval, leadership years, fleet), so About keeps the rest.
    const reasons = W.items.slice(4);
    return `
      <section class="wrap"><article class="board" aria-labelledby="pt">
        ${band(I.title, t(other()).intro.title)}
        <div class="prose-block"><p class="prose">${esc(I.p1)}</p><p class="prose">${esc(I.p2)}</p><p class="prose">${esc(I.p3)}</p></div>

  function pageServices() {
    const T = t(), S = T.services, U = ui();
    return `
      ${head(S.title, t(other()).services.title, S.lead)}
      <section class="wrap"><div class="board">
        <ol class="schedule">${S.items.map((s, i) => {
          const n = discProjects(i).length;
          const alt = t(other()).services.items[i];
          return `<li>
            <a class="sch-title" href="${href(`services/${svcSlug(s)}`)}"><span class="k1">${esc(s.title)}</span><span class="k2" ${altAttrs()}>${esc(alt.title)}</span></a>
            <div class="sch-body"><p class="prose">${esc(s.desc)}</p><ul class="inline-list">${s.capabilities.map((c) => `<li>${esc(c)}</li>`).join('')}</ul></div>
            <div class="sch-count">${n ? counted(n, 'projects') : `<span class="muted" aria-hidden="true">—</span><span class="vh">${esc(U.noProjects)}</span>`}</div>
            <a class="sch-go" href="${href(`services/${svcSlug(s)}`)}" aria-label="${esc(s.title)}">${fwd()}</a>
          </li>`;
        }).join('')}</ol>
      </div></section>`;
  }

  function pageService() {
    const T = t(), S = T.services, U = ui();
    const i = svcIndex(state.sub);
    const s = S.items[i];
    const rel = discProjects(i);
    const prev = S.items[(i + S.items.length - 1) % S.items.length];
    const next = S.items[(i + 1) % S.items.length];
    const scope = `<dl class="rows">${s.capabilities.map((c, j) => row(`<span class="k1 num">${no(j + 1)}</span>`, esc(c), { cls: 'numbered' })).join('')}</dl>`;
    const projects = rel.length ? register(rel, U.projectsTab) : `<p class="empty">${esc(U.noProjects)}</p>`;
    return `
      ${crumbs([[navLabel('services'), 'services'], [s.title]])}
      ${head(s.title, t(other()).services.items[i].title, s.desc)}
      <section class="wrap"><div class="board">
        ${tabs('svc', s.title, [
          { key: 'scope', label: U.scopeTab, count: s.capabilities.length, html: scope },
          { key: 'projects', label: U.projectsTab, count: rel.length, html: projects },
        ])}
      </div></section>
      ${pager(['services', prev, svcSlug(prev), prev.title], ['services', next, svcSlug(next), next.title], U.allDisciplines)}`;
  }

  function pager(prev, next, label) {
    const U = ui();
    return `<nav class="wrap pager" aria-label="${esc(label)}">
      <a href="${href(`${prev[0]}/${prev[2]}`)}" rel="prev"><span class="pk">${icon(rtl() ? 'arrow-right' : 'arrow-left')}${esc(U.prev)}</span><span class="pv">${esc(prev[3])}</span></a>
      <a href="${href(`${next[0]}/${next[2]}`)}" rel="next"><span class="pk">${esc(U.next)}${fwd()}</span><span class="pv">${esc(next[3])}</span></a>
    </nav>`;
  }

  function pageProjects() {
    const T = t(), P = T.projects, U = ui();
    const items = P.items;
    const shown = state.filter === 'all' ? items : items.filter((p) => p.key === state.filter);
    const owners = new Set(items.map((p) => p.client)).size;
    const places = new Set(items.map((p) => p.location)).size;
    const doneN = items.filter(done).length;
    return `
      ${head(P.title, t(other()).projects.title, P.lead)}
      <section class="wrap"><div class="board">
        <dl class="rows">
          ${row(key((c, u) => u.projects), `<span class="big">${counted(items.length, 'projects')}</span>`, { size: 'quarter' })}
          ${row(key((c, u) => u.completed), `<span class="big num" dir="ltr">${doneN}</span>`, { size: 'quarter' })}
          ${row(key((c, u) => u.owners), `<span class="big">${counted(owners, 'entities')}</span>`, { size: 'quarter' })}
          ${row(key((c, u) => u.places), `<span class="big">${counted(places, 'places')}</span>`, { size: 'quarter' })}
        </dl>

  const PAGE_FN = { '': pageHome, about: pageAbout, services: pageServices, projects: pageProjects, equipment: pageEquipment, certifications: pageCerts, journey: pageJourney, leadership: pageLeadership, contact: pageContact, careers: pageCareers };

  function pageTitle() {
    const T = t();
    if (state.page === 'services' && state.sub) return `${T.services.items[svcIndex(state.sub)].title} | ${T.brandLine}`;
    if (state.page === 'projects' && state.sub) return `${projBySlug(state.sub).title} | ${T.brandLine}`;
    if (!state.page) return T.brandLine;
    if (state.page === 'careers') return `${T.careers.title} | ${T.brandLine}`;
    return `${navLabel(state.page)} | ${T.brandLine}`;
  }

  // ---------- render ----------
  let lastKey = '';
  function render(force = false) {
    const { lang, page, sub } = parseHash();
    const changed = page !== state.page || lang !== state.lang || sub !== state.sub;
    state.lang = lang; state.page = page; state.sub = sub;
    const k = `${lang}/${page}/${sub}`;
    if (!force && k === lastKey) return;
    if (page !== 'contact') state.prefill = null;
    lastKey = k;

    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.title = pageTitle();
    $('.skip').textContent = ui().skip;
    $('#strip').innerHTML = strip();
    $('#mast').innerHTML = mast();
    $('#main').innerHTML = (page === 'services' && sub) ? pageService() : (page === 'projects' && sub) ? pageProject() : PAGE_FN[page]();
    $('#foot').innerHTML = foot();
    if (changed || force) window.scrollTo({ top: 0, behavior: 'auto' });
    if (state.jump) { const el = document.getElementById(state.jump); state.jump = null; if (el) el.scrollIntoView(); }
  }

  // ---------- forms ----------
  const validEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
  function setErr(id, bad, msg) {
    const input = document.getElementById(id);
    const err = document.getElementById(`${id}-err`);
    if (err && msg) err.lastChild.textContent = msg;
    input?.setAttribute('aria-invalid', String(bad));
    if (err) err.hidden = !bad;
    return bad;
  }
  function submitLike(form, statusId, okText, busyText) {
    const btn = $('button[type=submit]', form);
    const label = $('span:last-child', btn);
    const was = label.textContent;
    btn.setAttribute('aria-busy', 'true'); btn.disabled = true; label.textContent = busyText;
    setTimeout(() => {
      btn.removeAttribute('aria-busy'); btn.disabled = false; label.textContent = was;
      document.getElementById(statusId).innerHTML = `<div class="notice" role="status">${icon('check')}<div><strong>${esc(okText)}</strong><span>${esc(ui().protoSent)}</span></div></div>`;
      form.reset();
    }, 700);
  }

  // ---------- drawer ----------
  function setDrawer(open) {
    const d = $('#drawer'), b = $('.menu-btn');
    if (!d || !b) return;
    d.hidden = !open;
    document.body.classList.toggle('drawer-open', open);
    b.setAttribute('aria-expanded', String(open));
    b.innerHTML = icon(open ? 'x' : 'menu');
    b.setAttribute('aria-label', open ? ui().close : ui().menu);
  }

  // ---------- events ----------
  document.addEventListener('click', (e) => {
    const el = e.target.closest('button, a');
    if (!el) return;
    const T = t();

    if (el.matches('.menu-btn')) { setDrawer($('#drawer').hidden); return; }
    if (el.closest('.drawer')) setDrawer(false);

    if (el.matches('[role=tab]')) { selectTab(el); return; }
    if (el.dataset.pick) {
      const id = Number(el.dataset.pick);
      const p = projById(id);
      state.board = { disc: Math.max(0, projDisc(p)), proj: id };
      swapLive();
      return;
    }
    if (el.dataset.settab) { const [id, k] = el.dataset.settab.split(':'); state.tabs[id] = k; return; }
    if (el.dataset.filter) {
      state.filter = el.dataset.filter;
      const host = $('#main');
      host.innerHTML = pageProjects();
      $(`[data-filter="${state.filter}"]`)?.focus();
      return;
    }
    if (el.dataset.request) {
      e.preventDefault();
      go('contact', { prefill: { type: el.dataset.type || '', message: `${el.dataset.request}: ` } });
      return;
    }
    if (el.dataset.role) {
      state.role = el.dataset.role;
      const sel = $('#a-role'); if (sel) sel.value = state.role;
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      $('#apply').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' });
      setTimeout(() => $('#a-name')?.focus({ preventScroll: true }), reduce ? 0 : 450);
      return;
    }
    if (el.dataset.jump) { e.preventDefault(); document.getElementById(el.dataset.jump)?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); return; }
    if (el.hasAttribute('data-quote')) {
      // The single quote action carries the page it was pressed on.
      state.prefill = null;
      if (state.page === 'services' && state.sub) {
        const s = T.services.items[svcIndex(state.sub)];
        state.prefill = { type: svc(s).type, message: `${T.services.inquireCta} ${s.title}: ` };
      } else if (state.page === 'projects' && state.sub) {
        const p = projBySlug(state.sub);
        state.prefill = { type: PROJECT_TYPE[p.key] || 'other', message: `${T.projects.detailsCta}: ${p.title} — ` };
      }
      if (state.page === 'contact') { e.preventDefault(); render(true); $('#q-name')?.focus(); }
    }
  });

  document.addEventListener('keydown', (e) => {
    const tab = e.target.closest?.('[role=tab]');
    if (tab && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
      const list = $$('[role=tab]', tab.parentElement);
      const i = list.indexOf(tab);
      const f = rtl() ? 'ArrowLeft' : 'ArrowRight';
      const j = e.key === 'Home' ? 0 : e.key === 'End' ? list.length - 1 : (i + (e.key === f ? 1 : -1) + list.length) % list.length;
      e.preventDefault(); selectTab(list[j], true); return;
    }
    if (e.key === 'Escape' && $('#drawer') && !$('#drawer').hidden) { setDrawer(false); $('.menu-btn').focus(); }
  });

  document.addEventListener('change', (e) => {
    if (e.target.id === 'pick-disc') {
      const d = Number(e.target.value);
      const first = discProjects(d)[0];
      state.board = { disc: d, proj: first ? first.id : null };
      swapLive();
      return;
    }
    if (e.target.id === 'a-file') {
      const f = e.target.files[0];
      $('#a-file-name').textContent = f ? f.name : t().careers.cvNone;
      if (f) setErr('a-cv', false);
    }
  });

  document.addEventListener('submit', (e) => {
    e.preventDefault();
    const form = e.target;
    const v = (n) => (form.elements[n]?.value || '').trim();
    if (form.id === 'q-form') {
      const C = t().contact;
      const bad = [
        setErr('q-name', !v('name')),
        setErr('q-email', !validEmail(v('email')), v('email') ? C.errors.email : ui().emailRequired),
        setErr('q-company', !v('company')),
        setErr('q-message', v('message').length < 10),
      ];
      const first = ['q-name', 'q-email', 'q-company', 'q-message'][bad.indexOf(true)];
      if (first) { document.getElementById(first).focus(); return; }
      submitLike(form, 'q-status', C.success, C.submitting);
    }
    if (form.id === 'a-form') {
      const K = t().careers;
      const hasFile = !!$('#a-file').files.length;
      const bad = [
        setErr('a-name', !v('name')),
        setErr('a-email', !validEmail(v('email')), v('email') ? K.errors.email : ui().emailRequired),
        setErr('a-phone', !v('phone')),
        setErr('a-exp', v('exp') === ''),
        setErr('a-role', !v('role')),
        setErr('a-cv', !v('cv') && !hasFile),
      ];
      const first = ['a-name', 'a-email', 'a-phone', 'a-exp', 'a-role', 'a-cv'][bad.indexOf(true)];
      if (first) { document.getElementById(first).focus(); return; }
      submitLike(form, 'a-status', K.success, K.submitting);
      $('#a-file-name').textContent = K.cvNone;
    }
  });

  // An invalid field stays invalid while focused; it clears only once the
  // value is actually valid.
  document.addEventListener('input', (e) => {
    const el = e.target, id = el.id;
    if (el.getAttribute('aria-invalid') !== 'true') return;
    const val = el.value.trim();
    const ok = id.endsWith('email') ? validEmail(val) : id.endsWith('-message') ? val.length >= 10 : id === 'a-cv' ? !!val : !!val;
    if (ok) setErr(id, false);
  });

  // Portraits come from the live site's CDN; when it cannot be reached the
  // figure shows its labelled fallback instead of a broken image.
  document.addEventListener('error', (e) => {
    const img = e.target;
    if (img.tagName === 'IMG' && img.hasAttribute('data-portrait')) { img.closest('.portrait').classList.add('missing'); img.remove(); }
  }, true);

  addEventListener('hashchange', () => { setDrawer(false); render(); });
  addEventListener('resize', () => { if (innerWidth > 1180) setDrawer(false); });
  render(true);
})();

  </script>
</body>
</html>
