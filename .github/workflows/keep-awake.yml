# Keeps the backend on Render's free plan from going to sleep.
#
# A free web service sleeps after 15 idle minutes and takes up to a minute to
# wake, which the first person to send a form would sit through. Calling a
# light endpoint every few minutes keeps it awake. The endpoint never touches
# the database, so Neon still suspends when no one uses the site.
#
# One always-on free service uses about 744 of the 750 free instance hours a
# month, so this must stay the workspace's only free web service.
# GitHub may run schedules late and pauses them after 60 days without
# repository activity; re-enable it from the Actions tab if that happens.
name: Keep the backend awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Ping
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://sacc-backend-894t.onrender.com/api/v1/ping/
