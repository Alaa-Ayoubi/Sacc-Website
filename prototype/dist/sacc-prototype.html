/* SACC prototype — the street cross-section world.
 *
 * Grounds are strata: asphalt (the road, the header and the opening),
 * concrete (the reading ground), wadi sand and Madinah basalt (proof and
 * fleet). The road-marking yellow is spent only on primary actions. The
 * four network colours are the logo's own arcs, used as function, never as
 * decoration: teal water, orange power, green sewer/storm/landscape,
 * yellow roads.
 */

  --marking: #f6b81c;

  --road-ink: #8a6200;
  --concrete: #a7a298;

  --display: 'Alexandria', 'Readex Pro', system-ui, sans-serif;
  --text: 'Readex Pro', system-ui, sans-serif;

  --gutter: clamp(20px, 4vw, 48px);
  --wrap: min(1240px, 100% - 2 * var(--gutter));
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --head-h: 72px;

  color-scheme: light;
  scrollbar-color: var(--aggregate) var(--ground);
}

*, *::before, *::after { box-sizing: border-box; }

html { scroll-padding-top: calc(var(--head-h) + 16px); -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--text);
  font-size: 1.0625rem;
  font-weight: 350;
  line-height: 1.65;
  caret-color: var(--water-ink);
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}
html[lang='ar'] body { line-height: 1.8; font-size: 1.09rem; }

::selection { background: var(--marking); color: var(--ink); }

img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 0.28em; }

:focus-visible {
  outline: 3px solid var(--marking);
  outline-offset: 3px;
  border-radius: 2px;
}

h1, h2, h3, h4 {
  font-family: var(--display);
  margin: 0;
  text-wrap: balance;
  letter-spacing: -0.012em;
}
html[lang='ar'] h1, html[lang='ar'] h2, html[lang='ar'] h3, html[lang='ar'] h4 { letter-spacing: 0; }

p { margin: 0; text-wrap: pretty; }

.wrap { width: var(--wrap); margin-inline: auto; }

.num { font-variant-numeric: tabular-nums lining-nums; }

.skip {
  position: absolute;
  inset-inline-start: 12px;
  top: -60px;
  z-index: 100;
  background: var(--marking);
  color: var(--ink);
  padding: 10px 16px;
  font-weight: 600;
  text-decoration: none;
}
.skip:focus { top: 12px; }

.visually-hidden {
  position: absolute !important;
  width: 1px !important; height: 1px !important;
  min-height: 0 !important; padding: 0 !important; border: 0 !important;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.icon { width: 1.15em; height: 1.15em; flex: none; display: inline-block; vertical-align: -0.2em; }
.icon svg { width: 100%; height: 100%; display: block; stroke-width: 1.75; }
html[dir='rtl'] .flip svg { transform: scaleX(-1); }

/* ---------- Buttons ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.6em;
  min-height: 48px;
  padding: 0 1.35em;
  border: 0;
  border-radius: 2px;
  font-family: var(--display);
  font-weight: 600;
  font-size: 1rem;
  line-height: 1.2;
  text-decoration: none;
  transition: background-color 160ms var(--ease-out), color 160ms var(--ease-out), box-shadow 160ms var(--ease-out);
}
.btn-mark { background: var(--marking); color: var(--ink); box-shadow: 0 1px 0 rgba(0,0,0,0.22); }
.btn-mark:hover { background: var(--marking-hover); }
.btn-mark:active { box-shadow: 0 1px 0 rgba(0,0,0,0.25); }
.btn-line-dark { background: transparent; color: var(--on-dark); box-shadow: inset 0 0 0 1px var(--asphalt-line); }
.btn-line-dark:hover { box-shadow: inset 0 0 0 1px var(--on-dark-2); }
.btn-ink { background: var(--asphalt); color: var(--on-dark); }
.btn-ink:hover { background: var(--asphalt-3); }
.btn-line { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule-strong); }
.btn-line:hover { box-shadow: inset 0 0 0 1px var(--ink); }
.btn[disabled], .btn[aria-busy='true'] { opacity: 0.6; cursor: progress; }

.textlink {
  display: inline-flex; align-items: center; gap: 0.45em;
  font-family: var(--display); font-weight: 600; font-size: 0.98rem;
  text-decoration: underline; text-decoration-color: var(--marking);
  text-decoration-thickness: 2px; text-underline-offset: 0.4em;
}
.textlink:hover { text-decoration-color: currentColor; }

/* ---------- Masthead ---------- */

.masthead {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--asphalt);
  color: var(--on-dark);
  border-bottom: 1px solid var(--asphalt-line);
}
.masthead-in {
  width: var(--wrap);
  margin-inline: auto;
  height: var(--head-h);
  display: flex;
  align-items: center;
  gap: 28px;
}
.brand { display: flex; align-items: center; flex: none; }
.brand img { height: 34px; width: auto; }
.nav { display: flex; gap: 2px; margin-inline-start: auto; }
.nav a {
  position: relative;
  padding: 10px 11px;
  color: var(--on-dark-2);
  text-decoration: none;
  font-size: 0.93rem;
  font-weight: 400;
  white-space: nowrap;
  transition: color 140ms var(--ease-out);
}
.nav a:hover { color: var(--on-dark); }
.nav a[aria-current='page'] { color: var(--on-dark); }
.nav a[aria-current='page']::after {
  content: '';
  position: absolute;
  inset-inline: 11px;
  bottom: 2px;
  height: 2px;
  background: var(--marking);
}
.mast-tools { display: flex; align-items: center; gap: 10px; flex: none; }
.lang {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 40px; padding: 0 12px;
  background: transparent; border: 0; border-radius: 2px;
  color: var(--on-dark); box-shadow: inset 0 0 0 1px var(--asphalt-line);
  font-size: 0.9rem;
}
.lang:hover { box-shadow: inset 0 0 0 1px var(--on-dark-2); }
.mast-tools .btn { min-height: 40px; font-size: 0.93rem; }
.menu-btn {
  display: none;
  width: 44px; height: 44px;
  align-items: center; justify-content: center;
  background: transparent; border: 0; color: var(--on-dark);
  box-shadow: inset 0 0 0 1px var(--asphalt-line); border-radius: 2px;
}
.drawer {
  display: none;
  position: fixed;
  inset: var(--head-h) 0 0 0;
  background: var(--asphalt);
  padding: 24px var(--gutter) 40px;
  overflow-y: auto;
  z-index: 39;
}
.drawer.open { display: block; }
.drawer a.navlink {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 0;
  color: var(--on-dark);
  font-family: var(--display);
  font-size: 1.3rem;
  text-decoration: none;
  border-bottom: 1px solid var(--asphalt-line);
}
.drawer a.navlink[aria-current='page'] { color: var(--marking); }
.drawer .btn { margin-top: 28px; width: 100%; justify-content: center; }

@media (max-width: 1180px) {
  .nav, .mast-tools .btn { display: none; }
  .menu-btn { display: inline-flex; }
  .mast-tools { margin-inline-start: auto; }
}

/* ---------- Road edge (the lane marking where a band ends) ---------- */

.roadedge {
  position: relative;
  height: 28px;
  background: var(--asphalt);
}
.roadedge::before {
  content: '';
  position: absolute;
  inset-inline: 0;
  top: 9px;
  height: 4px;
  background: repeating-linear-gradient(90deg, var(--marking) 0 46px, transparent 46px 82px);
  opacity: 0.92;
}
.roadedge::after {
  content: '';
  position: absolute;
  inset-inline: 0;
  bottom: 4px;
  height: 2px;
  background: var(--lane);
  opacity: 0.55;
}

/* ---------- Opening (home) ---------- */

.opening {
  background: var(--asphalt);
  color: var(--on-dark);
  padding-block: clamp(36px, 5vw, 68px) clamp(30px, 3.6vw, 48px);
}
.opening-grid {
  width: var(--wrap);
  margin-inline: auto;
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
  gap: clamp(28px, 5vw, 72px);
  align-items: end;
}
.opening h1 {
  font-size: clamp(2.4rem, 5vw, 4.4rem);
  line-height: 1.06;
  font-weight: 650;
  letter-spacing: -0.03em;
}
html[lang='ar'] .opening h1 { line-height: 1.32; letter-spacing: 0; font-weight: 650; font-size: clamp(2.5rem, 5vw, 4.4rem); }
.opening-side { display: grid; gap: 26px; padding-bottom: 6px; }
.opening-side p { color: var(--on-dark-2); font-size: 1.12rem; max-width: 46ch; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

@media (max-width: 900px) {
  .opening-grid { grid-template-columns: 1fr; align-items: start; }
}

/* ---------- The street section (signature) ---------- */

.xsec { background: var(--asphalt-2); color: var(--on-dark); }
.xsec-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(280px, 340px);
  align-items: stretch;
}
.xsec-figure { position: relative; margin: 0; min-width: 0; }
.xsec-figure svg { display: block; width: 100%; height: auto; }
.xsec-caption {
  position: absolute;
  inset-inline-end: 16px;
  top: 10px;
  font-size: 0.78rem;
  color: var(--on-dark-2);
  background: rgba(23, 24, 26, 0.72);
  padding: 3px 8px;
  border-radius: 2px;
}

.net { cursor: pointer; transition: opacity 220ms var(--ease-out); }
.net .hit { fill: transparent; }
.net .glow { opacity: 0; transition: opacity 220ms var(--ease-out); }
.net:hover .glow, .net.on .glow { opacity: 1; }
.xsec-figure.picked .net:not(.on) { opacity: 0.38; }
.xsec-figure.picked .net:not(.on):hover { opacity: 0.75; }
.tag rect { transition: fill 200ms var(--ease-out); }
.tag.on rect { fill: var(--marking); }
.xsec-figure.picked .tag:not(.on) { opacity: 0.55; }

.record {
  background: var(--paper);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  border-inline-start: 1px solid var(--asphalt-line);
}
.record h2 {
  font-size: 1.05rem;
  font-weight: 600;
  padding: 16px 20px 12px;
  border-bottom: 2px solid var(--ink);
}
.record dl { margin: 0; flex: 1; display: grid; grid-auto-rows: 1fr; }
.record-row {
  display: grid;
  grid-template-columns: 7.4em 1fr;
  gap: 12px;
  align-items: center;
  padding: 7px 20px;
  border-bottom: 1px solid var(--rule);
}
.record dt {
  font-family: var(--display);
  font-weight: 700;
  font-size: 1.12rem;
  line-height: 1.2;
  font-variant-numeric: tabular-nums lining-nums;
}
.record dd { margin: 0; font-size: 0.88rem; color: var(--ink-2); line-height: 1.35; }
.record .record-cta { padding: 14px 20px 18px; }

@media (max-width: 1020px) {
  .xsec-grid { grid-template-columns: 1fr; }
  .record { border-inline-start: 0; border-top: 1px solid var(--asphalt-line); }
  .record dl { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: auto; }
  .record-row { grid-template-columns: 1fr; gap: 2px; padding: 12px 20px; }
  .record-row:nth-child(odd) { border-inline-end: 1px solid var(--rule); }
}
@media (max-width: 700px) {
  .xsec-scroll { overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: thin; }
  .xsec-figure svg { width: 980px; max-width: none; height: auto; }
  .xsec-caption .swipe { display: inline; }
  .xsec-caption { font-size: 0.7rem; inset-inline-end: 8px; top: 6px; }
}

/* Legend + discipline reader under the section */

.reader {
  background: var(--ground);
  padding-block: clamp(36px, 5vw, 64px);
}
.reader-grid {
  width: var(--wrap);
  margin-inline: auto;
  display: grid;
  grid-template-columns: minmax(240px, 330px) minmax(0, 1fr);
  gap: clamp(24px, 4vw, 64px);
}
.legend h2 { font-size: 1.3rem; font-weight: 600; margin-bottom: 14px; }
.legend ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.legend button {
  width: 100%;
  display: grid;
  grid-template-columns: 26px 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 11px 4px;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--rule);
  text-align: start;
  font-size: 0.97rem;
  color: var(--ink-2);
  transition: background-color 140ms var(--ease-out), color 140ms var(--ease-out);
}
.legend button:hover { background: var(--paper); color: var(--ink); }
.legend button[aria-pressed='true'] { color: var(--ink); font-weight: 500; background: var(--paper); }
.legend button[aria-pressed='true'] .seg { height: 6px; }
.seg { display: block; width: 26px; height: 4px; border-radius: 1px; background: var(--c, var(--ink)); transition: height 160ms var(--ease-out); }
.legend .where { font-size: 0.75rem; color: var(--ink-3); }

.discipline { min-width: 0; }
.discipline-head { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; }
.discipline-head .icon { width: 44px; height: 44px; padding: 10px; border-radius: 2px; background: var(--asphalt); color: var(--c, var(--marking)); }
.discipline h3 { font-size: clamp(1.6rem, 2.6vw, 2.3rem); font-weight: 650; line-height: 1.2; }
.discipline > p { max-width: 62ch; color: var(--ink-2); font-size: 1.1rem; }
.caps {
  list-style: none;
  margin: 26px 0 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  border-top: 2px solid var(--ink);
}
.caps li {
  display: flex; gap: 10px; align-items: baseline;
  padding: 13px 0;
  border-bottom: 1px solid var(--rule);
  padding-inline-end: 16px;
}
.caps li .icon { color: var(--c-ink, var(--ink)); vertical-align: -0.15em; }
.related { margin-top: 26px; }
.related h4 { font-size: 0.95rem; font-weight: 600; margin-bottom: 8px; color: var(--ink-2); }
.related ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.related li { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.related li span { color: var(--ink-3); font-size: 0.9rem; }
.discipline .actions { margin-top: 28px; }

.fade-swap { animation: swap 360ms var(--ease-out); }
@keyframes swap { from { opacity: 0.25; transform: translateY(6px); } to { opacity: 1; transform: none; } }

@media (max-width: 860px) {
  .reader-grid { grid-template-columns: 1fr; }
  .caps { grid-template-columns: 1fr; }
}

/* ---------- Bands ---------- */

.band { padding-block: clamp(56px, 8vw, 112px); }
.band-paper { background: var(--paper); }
.band-sand { background: var(--sand); color: var(--on-sand); }
.band-basalt { background: var(--basalt); color: var(--on-dark); }
.band-asphalt { background: var(--asphalt-2); color: var(--on-dark); }

.head { max-width: 760px; margin-bottom: clamp(28px, 4vw, 48px); }
.head h2 { font-size: clamp(1.9rem, 3.6vw, 2.9rem); line-height: 1.18; font-weight: 600; }
html[lang='ar'] .head h2 { line-height: 1.35; }
.head p { margin-top: 14px; font-size: 1.12rem; color: var(--ink-2); max-width: 62ch; }
.band-sand .head p { color: var(--on-sand-2); }
.band-basalt .head p, .band-asphalt .head p { color: var(--on-dark-2); }

/* Company */
.company { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 80px); }
.company .lead { font-size: clamp(1.2rem, 1.7vw, 1.42rem); line-height: 1.6; color: var(--ink); font-weight: 350; }
.company .cols { display: grid; gap: 18px; color: var(--ink-2); }
.why { margin-top: clamp(40px, 6vw, 72px); border-top: 2px solid var(--ink); }
.why h3 { font-size: 1.3rem; font-weight: 600; padding-block: 18px 6px; }
.why > p { color: var(--ink-2); margin-bottom: 10px; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 28px; }
.checks li { display: flex; gap: 10px; align-items: baseline; padding: 14px 0; border-bottom: 1px solid var(--rule); font-weight: 450; }
.checks .icon { color: var(--ink); background: var(--marking); border-radius: 50%; padding: 3px; width: 1.25em; height: 1.25em; vertical-align: -0.25em; }
@media (max-width: 1020px) { .checks { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 860px) { .company { grid-template-columns: 1fr; } }
@media (max-width: 560px) { .checks { grid-template-columns: 1fr; } }

/* Proof (certifications) */
.proof { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: clamp(28px, 5vw, 80px); }
.proof h3 { font-size: 1.05rem; font-weight: 600; padding-bottom: 10px; border-bottom: 2px solid var(--on-sand); }
.iso { list-style: none; margin: 0; padding: 0; }
.iso li { padding: 18px 0; border-bottom: 1px solid rgba(38, 29, 18, 0.28); }
.iso strong { display: block; font-family: var(--display); font-size: clamp(1.5rem, 2.4vw, 2rem); font-weight: 700; line-height: 1.2; }
.iso span { color: var(--on-sand-2); }
.approvals { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 32px; }
.approvals li { break-inside: avoid; padding: 13px 0; border-bottom: 1px solid rgba(38, 29, 18, 0.28); font-weight: 450; display: flex; gap: 10px; align-items: baseline; }
.approvals .icon { color: var(--on-sand); }
.proof-foot { margin-top: 36px; display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; }
.proof-foot p { color: var(--on-sand-2); max-width: 60ch; }
@media (max-width: 860px) { .proof { grid-template-columns: 1fr; } }
@media (max-width: 520px) { .approvals { columns: 1; } }

/* Projects: logs */
.filters {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  margin-bottom: 8px;
}
.filters button {
  min-height: 40px;
  padding: 0 16px;
  border: 0;
  border-radius: 2px;
  background: transparent;
  box-shadow: inset 0 0 0 1px var(--rule-strong);
  color: var(--ink-2);
  font-size: 0.93rem;
  display: inline-flex; align-items: center; gap: 8px;
}
.filters button:hover { color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.filters button[aria-pressed='true'] { background: var(--asphalt); color: var(--on-dark); box-shadow: none; }
.filters .seg { width: 14px; }
.tally { color: var(--ink-3); font-size: 0.9rem; margin: 14px 0 0; }
.tally strong { color: var(--ink); font-weight: 600; }
.logs { list-style: none; margin: 18px 0 0; padding: 0; border-top: 2px solid var(--ink); }
.log { border-bottom: 1px solid var(--rule); }
.log-row {
  display: grid;
  grid-template-columns: 34px minmax(0, 1.6fr) minmax(0, 1.2fr) minmax(0, 0.8fr) auto;
  gap: 18px;
  align-items: center;
  padding: 18px 0;
}
.log-row .seg { width: 30px; height: 6px; }
.log h3 { font-size: 1.15rem; font-weight: 600; line-height: 1.35; }
.log .meta { color: var(--ink-2); font-size: 0.92rem; line-height: 1.45; }
.log .meta span { display: block; }
.status { font-size: 0.85rem; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; }
.status::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.status.done { color: var(--sewer-ink); }
.status.live { color: var(--power-ink); }
.log .toggle {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 40px; padding: 0 12px;
  background: transparent; border: 0; border-radius: 2px;
  box-shadow: inset 0 0 0 1px var(--rule-strong);
  font-size: 0.88rem; color: var(--ink);
}
.log .toggle:hover { box-shadow: inset 0 0 0 1px var(--ink); }
.log .toggle .icon { transition: transform 200ms var(--ease-out); }
.log .toggle[aria-expanded='true'] .icon { transform: rotate(180deg); }
.log-detail {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) minmax(0, 1fr);
  gap: 18px;
  padding: 0 0 26px;
}
.log-detail[hidden] { display: none; }
.log-detail p { grid-column: 2; color: var(--ink-2); max-width: 60ch; }
.log-detail .scope { grid-column: 3; }
.log-detail h4 { font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; }
.log-detail ul { margin: 0 0 16px; padding-inline-start: 1.1em; color: var(--ink-2); }
.empty { padding: 32px 0; color: var(--ink-2); }
@media (max-width: 900px) {
  .log-row { grid-template-columns: 30px minmax(0, 1fr) auto; row-gap: 6px; }
  .log-row .meta { grid-column: 2 / 3; grid-row: 2; }
  .log-row .status { grid-column: 2 / 3; grid-row: 3; }
  .log-row .toggle { grid-column: 3; grid-row: 1 / 4; align-self: start; }
  .log-detail { grid-template-columns: 30px minmax(0, 1fr); }
  .log-detail p, .log-detail .scope { grid-column: 2; }
}

/* Fleet */
.fleet { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 80px); }
.fleet .body { display: grid; gap: 16px; color: var(--on-dark-2); }
.fleet h3 { font-size: 1.05rem; font-weight: 600; padding-bottom: 10px; border-bottom: 2px solid var(--on-dark); margin-bottom: 4px; }
.cats { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px; }
.cats li { padding: 12px 0; border-bottom: 1px solid var(--basalt-2); display: flex; gap: 10px; align-items: baseline; }
.cats .icon { color: var(--marking); }
.support { margin-top: clamp(40px, 6vw, 72px); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--basalt-2); }
.support > div { padding: 22px 22px 0 0; }
html[dir='rtl'] .support > div { padding: 22px 0 0 22px; }
.support .icon { width: 28px; height: 28px; color: var(--marking); }
.support h4 { font-size: 1.05rem; font-weight: 600; margin: 12px 0 6px; }
.support p { color: var(--on-dark-2); font-size: 0.95rem; }
@media (max-width: 960px) { .fleet { grid-template-columns: 1fr; } .support { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 24px; } }
@media (max-width: 520px) { .cats, .support { grid-template-columns: 1fr; } }

/* Quote (chairman) */
.quote { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(24px, 4vw, 56px); align-items: start; }
.quote .rule { width: 4px; align-self: stretch; background: var(--marking); }
.quote blockquote { margin: 0; font-family: var(--display); font-size: clamp(1.4rem, 2.6vw, 2.2rem); line-height: 1.45; font-weight: 400; max-width: 34em; }
html[lang='ar'] .quote blockquote { line-height: 1.75; }
.quote figcaption { margin-top: 22px; color: var(--on-dark-2); }
.quote figcaption strong { color: var(--on-dark); font-weight: 600; display: block; }

/* Close */
.close-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 80px); align-items: end; }
.close-grid h2 { font-size: clamp(2rem, 4vw, 3.2rem); font-weight: 650; line-height: 1.15; }
html[lang='ar'] .close-grid h2 { line-height: 1.35; }
.close-grid > div > p { margin-top: 14px; color: var(--ink-2); font-size: 1.12rem; max-width: 52ch; }
.channels { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
.channels li { display: grid; grid-template-columns: 22px 6.5em 1fr; gap: 12px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.channels .k { color: var(--ink-3); font-size: 0.9rem; }
.channels a { text-decoration: none; font-weight: 500; }
.channels a:hover { text-decoration: underline; text-decoration-color: var(--marking); text-decoration-thickness: 2px; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
@media (max-width: 860px) { .close-grid { grid-template-columns: 1fr; } }

/* ---------- Inner page head ---------- */

.pagehead { background: var(--asphalt); color: var(--on-dark); padding-block: clamp(44px, 6vw, 84px) clamp(30px, 4vw, 48px); }
.pagehead h1 { font-size: clamp(2.2rem, 4.6vw, 3.8rem); line-height: 1.12; font-weight: 650; letter-spacing: -0.025em; max-width: 18ch; }
html[lang='ar'] .pagehead h1 { line-height: 1.35; letter-spacing: 0; }
.pagehead p { margin-top: 18px; color: var(--on-dark-2); font-size: 1.15rem; max-width: 60ch; }
.pagehead .actions { margin-top: 28px; }
.strata { display: grid; grid-template-rows: 10px 8px 14px 18px; }
.strata i { display: block; }
.strata i:nth-child(1) { background: var(--asphalt-3); }
.strata i:nth-child(2) { background: #6b675f; }
.strata i:nth-child(3) { background: var(--aggregate) radial-gradient(circle at 30% 40%, rgba(0,0,0,0.18) 1px, transparent 1.6px) 0 0 / 9px 7px; }
.strata i:nth-child(4) { background: var(--sand); }

/* ---------- Services list ---------- */

.svc-list { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
.svc {
  display: grid;
  grid-template-columns: 56px minmax(0, 1.1fr) minmax(0, 1.4fr) auto;
  gap: 24px;
  padding: 26px 0;
  border-bottom: 1px solid var(--rule);
  align-items: start;
}
.svc .icon { width: 44px; height: 44px; padding: 10px; background: var(--asphalt); color: var(--c); border-radius: 2px; }
.svc h3 { font-size: 1.3rem; font-weight: 600; line-height: 1.3; }
.svc p { color: var(--ink-2); margin-top: 8px; }
.svc ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 18px; }
.svc li { display: flex; gap: 8px; align-items: baseline; font-size: 0.95rem; }
.svc li .seg { width: 12px; height: 3px; flex: none; transform: translateY(-0.25em); }
@media (max-width: 960px) {
  .svc { grid-template-columns: 52px minmax(0, 1fr); }
  .svc ul, .svc .btn { grid-column: 2; }
}
@media (max-width: 520px) { .svc ul { grid-template-columns: 1fr; } }

/* ---------- Journey (oldest layer deepest) ---------- */

.column { list-style: none; margin: 0; padding: 0; }
.column li {
  display: grid;
  grid-template-columns: 22px 7rem minmax(0, 1fr);
  gap: 22px;
  align-items: stretch;
}
.column .layer { background: var(--l); }
.column .yr { font-family: var(--display); font-size: 1.6rem; font-weight: 700; padding-block: 22px; font-variant-numeric: tabular-nums lining-nums; }
.column .txt { padding-block: 22px; border-bottom: 1px solid var(--rule); }
.column h3 { font-size: 1.2rem; font-weight: 600; }
.column p { color: var(--ink-2); margin-top: 4px; max-width: 60ch; }
.values { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px; border-top: 2px solid var(--on-dark); }
.values li { padding: 16px 0; border-bottom: 1px solid var(--basalt-2); }
.values strong { font-family: var(--display); font-weight: 600; font-size: 1.1rem; display: block; }
.values span { color: var(--on-dark-2); }
@media (max-width: 640px) { .values { grid-template-columns: 1fr; } .column li { grid-template-columns: 14px 4.6rem minmax(0, 1fr); gap: 14px; } .column .yr { font-size: 1.25rem; } }

/* ---------- Leadership ---------- */

.leaders { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(28px, 4vw, 56px); }
.leader { display: grid; grid-template-columns: 148px minmax(0, 1fr); gap: 24px; align-items: start; border-top: 2px solid var(--ink); padding-top: 24px; }
.portrait { width: 148px; aspect-ratio: 4 / 5; background: var(--asphalt-2); position: relative; overflow: hidden; border-radius: 2px; }
.portrait img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05); }
.portrait .initials { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 2.6rem; font-weight: 700; color: var(--marking); }
.leader h3 { font-size: 1.45rem; font-weight: 650; line-height: 1.3; }
.leader .role { color: var(--ink-3); font-size: 0.95rem; margin-top: 2px; }
.leader p.bio { margin-top: 14px; color: var(--ink-2); }
.tags { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.tags li { font-size: 0.85rem; padding: 4px 10px; box-shadow: inset 0 0 0 1px var(--rule-strong); border-radius: 2px; }
@media (max-width: 980px) { .leaders { grid-template-columns: 1fr; } }
@media (max-width: 520px) { .leader { grid-template-columns: 1fr; } .portrait { width: 120px; } }

/* ---------- Forms (field sheet) ---------- */

.sheet-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 72px); align-items: start; }
.sheet { background: var(--paper); padding: clamp(22px, 3vw, 40px); border-top: 4px solid var(--ink); box-shadow: 0 1px 0 var(--rule), 0 18px 40px -28px rgba(23, 24, 26, 0.45); }
.sheet h2 { font-size: 1.5rem; font-weight: 650; }
.sheet > p { color: var(--ink-2); margin-top: 6px; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 20px; margin-top: 24px; }
.field { display: grid; gap: 6px; align-content: start; }
.field.full { grid-column: 1 / -1; }
.field label, .field .label { font-size: 0.92rem; font-weight: 500; }
.field input, .field select, .field textarea {
  width: 100%;
  min-height: 48px;
  padding: 10px 14px;
  background: #fff;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  font-size: 1rem;
  transition: border-color 140ms var(--ease-out), box-shadow 140ms var(--ease-out);
}
.field textarea { min-height: 140px; resize: vertical; line-height: 1.6; }
.field input::placeholder, .field textarea::placeholder { color: #6e6a62; }
.field input:hover, .field select:hover, .field textarea:hover { border-color: var(--ink-3); }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(246, 184, 28, 0.7); }
.field [aria-invalid='true'] { border-color: #b3261e; }
.field .err { color: #a3221b; font-size: 0.86rem; display: flex; gap: 6px; align-items: center; }
.field .hint { color: var(--ink-3); font-size: 0.85rem; }
.file-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.file-row .btn { min-height: 42px; }
.file-row span { color: var(--ink-3); font-size: 0.9rem; }
.form-foot { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: center; }
.form-note { color: var(--ink-3); font-size: 0.86rem; }
.notice { margin-top: 20px; padding: 14px 16px; display: flex; gap: 10px; align-items: flex-start; border-radius: 2px; }
.notice.ok { background: #e3f1e7; color: #1d5233; }
.notice.bad { background: #f8e3e1; color: #7d1d17; }
.aside h3 { font-size: 1.05rem; font-weight: 600; padding-bottom: 10px; border-bottom: 2px solid var(--ink); }
.aside .block + .block { margin-top: 30px; }
.aside p, .aside li { color: var(--ink-2); }
.aside ul { list-style: none; margin: 10px 0 0; padding: 0; }
@media (max-width: 960px) { .sheet-grid { grid-template-columns: 1fr; } }
@media (max-width: 600px) { .fields { grid-template-columns: 1fr; } }

/* Careers roles */
.roles { width: 100%; border-collapse: collapse; border-top: 2px solid var(--ink); }
.roles th { text-align: start; font-weight: 500; font-size: 0.85rem; color: var(--ink-3); padding: 12px 12px 12px 0; border-bottom: 1px solid var(--rule-strong); }
html[dir='rtl'] .roles th, html[dir='rtl'] .roles td { padding: 12px 0 12px 12px; }
.roles td { padding: 16px 12px 16px 0; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.roles td.t { font-family: var(--display); font-weight: 600; font-size: 1.05rem; }
.roles .btn { min-height: 40px; font-size: 0.9rem; }
@media (max-width: 820px) {
  .roles thead { display: none; }
  .roles, .roles tbody, .roles tr, .roles td { display: block; }
  .roles tr { padding: 14px 0; border-bottom: 1px solid var(--rule); }
  .roles td { border: 0; padding: 2px 0 !important; }
  .roles td.k::before { content: attr(data-k) ' · '; color: var(--ink-3); font-size: 0.85rem; }
  .roles td:last-child { padding-top: 10px !important; }
}
.perks { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--basalt-2); }
.perks li { padding: 22px 22px 0 0; }
html[dir='rtl'] .perks li { padding: 22px 0 0 22px; }
.perks .icon { width: 28px; height: 28px; color: var(--marking); }
.perks h3 { font-size: 1.05rem; font-weight: 600; margin: 12px 0 6px; }
.perks p { color: var(--on-dark-2); font-size: 0.95rem; }
@media (max-width: 960px) { .perks { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 24px; } }
@media (max-width: 520px) { .perks { grid-template-columns: 1fr; } }

/* ---------- Footer ---------- */

.footer { background: var(--asphalt); color: var(--on-dark-2); }
.footer-grid {
  width: var(--wrap);
  margin-inline: auto;
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) repeat(3, minmax(0, 1fr));
  gap: 36px;
  padding-block: 52px 36px;
}
.footer img { height: 34px; width: auto; }
.footer p { margin-top: 16px; max-width: 38ch; font-size: 0.95rem; }
.footer h2 { font-size: 0.95rem; font-weight: 600; color: var(--on-dark); margin-bottom: 12px; }
.footer ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 0.93rem; }
.footer a { color: var(--on-dark-2); text-decoration: none; }
.footer a:hover { color: var(--on-dark); text-decoration: underline; text-decoration-color: var(--marking); }
.footer-base { width: var(--wrap); margin-inline: auto; padding-block: 18px 28px; border-top: 1px solid var(--asphalt-line); font-size: 0.85rem; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; }
@media (max-width: 900px) { .footer-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .footer-grid { grid-template-columns: 1fr; } }

/* ---------- Depth gauge ---------- */

.gauge {
  position: fixed;
  inset-inline-start: 14px;
  top: calc(var(--head-h) + 28px);
  bottom: 28px;
  width: 22px;
  z-index: 30;
  pointer-events: none;
  display: none;
}
.gauge { transition: opacity 200ms var(--ease-out); }
.gauge.aside { opacity: 0; }
.gauge .line { position: absolute; inset-inline-start: 10px; top: 0; bottom: 0; width: 1px; background: rgba(139, 133, 122, 0.55); }
.gauge .tick { position: absolute; inset-inline-start: 6px; width: 9px; height: 1px; background: var(--aggregate); }
.gauge .mark { position: absolute; inset-inline-start: 4px; width: 13px; height: 13px; margin-top: -6px; background: var(--marking); border: 2px solid var(--asphalt); border-radius: 50%; transition: top 120ms linear; }
@media (min-width: 1360px) { .gauge { display: block; } }

/* ---------- Prototype flag ---------- */

.proto-flag {
  display: flex;
  align-items: center;
  gap: 8px;
  position: fixed;
  inset-inline-end: 14px;
  bottom: 14px;
  z-index: 50;
  background: var(--asphalt);
  color: var(--on-dark-2);
  font-size: 0.78rem;
  padding: 6px 10px;
  border-radius: 2px;
  box-shadow: 0 6px 18px -8px rgba(0,0,0,0.6);
  max-width: min(320px, calc(100vw - 28px));
}

/* ---------- Motion: the section settles once ---------- */

@media (prefers-reduced-motion: no-preference) {
  .settle .stratum { animation: settle 900ms var(--ease-out) backwards; animation-delay: calc(var(--i) * 70ms); }
  .settle .net { animation: appear 700ms var(--ease-out) backwards; animation-delay: calc(420ms + var(--i) * 60ms); }
  @keyframes settle { from { transform: translateY(-14px); opacity: 0.45; } to { transform: none; opacity: 1; } }
  @keyframes appear { from { opacity: 0.35; } to { opacity: 1; } }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

.proto-flag[hidden] { display: none; }
.proto-flag button { flex: none; display: inline-grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 2px; background: transparent; color: var(--on-dark); }
.proto-flag button:hover { background: var(--asphalt-3); }

/* ---------- Hit areas: a network is clickable across its whole outline ---------- */
.net .hitarea { opacity: 0; }
.net .hitarea * { stroke: none; pointer-events: all; }

/* ---------- Links inside headings ---------- */
.log h3 a, .svc h3 a { text-decoration: none; }
.log h3 a:hover, .svc h3 a:hover { text-decoration: underline; text-decoration-color: var(--marking); text-decoration-thickness: 2px; }
.svc-more { margin-top: 10px; font-size: 0.9rem; }
.textlink.on-dark { color: var(--on-dark); }

/* ---------- Tabs: the active tab carries the lane marking ---------- */
.tablist {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 28px;
  border-bottom: 2px solid var(--ink);
  margin-bottom: 8px;
}
.tablist [role='tab'] {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-height: 52px;
  padding: 0;
  border: 0;
  background: transparent;
  font-family: var(--display);
  font-size: 1.08rem;
  font-weight: 500;
  color: var(--ink-3);
  transition: color 140ms var(--ease-out);
}
.tablist [role='tab']:hover { color: var(--ink); }
.tablist [role='tab'][aria-selected='true'] { color: var(--ink); font-weight: 650; }
.tablist [role='tab'][aria-selected='true']::after {
  content: '';
  position: absolute;
  inset-inline: 0;
  bottom: -2px;
  height: 3px;
  background: var(--marking);
}
.tablist .count {
  font-family: var(--text);
  font-size: 0.78rem;
  font-weight: 500;
  min-width: 26px;
  height: 22px;
  padding: 0 7px;
  display: inline-grid;
  place-items: center;
  border-radius: 2px;
  background: var(--ground);
  color: var(--ink-2);
}
.tabpanel { padding-top: 10px; }
.tabpanel:focus-visible { outline-offset: 6px; }
.tabs.dark .tablist { border-bottom-color: var(--on-dark); }
.tabs.dark [role='tab'] { color: var(--on-dark-2); }
.tabs.dark [role='tab']:hover, .tabs.dark [role='tab'][aria-selected='true'] { color: var(--on-dark); }
.tabs.dark .count { background: var(--basalt-2); color: var(--on-dark); }
.tabs.sand .tablist { border-bottom-color: var(--on-sand); }
.tabs.sand [role='tab'] { color: var(--on-sand-2); }
.tabs.sand [role='tab']:hover, .tabs.sand [role='tab'][aria-selected='true'] { color: var(--on-sand); }
.tabs.sand [role='tab'][aria-selected='true']::after { background: var(--asphalt); }
.tabs.sand .count { background: var(--sand-deep); color: var(--on-sand); }

/* ---------- Sub-pages ---------- */
.caps.big { border-top: 0; }
.caps.big li { font-size: 1.12rem; padding: 18px 0; }
.logs.compact { margin-top: 6px; border-top: 0; }
.logs.compact .log-row { grid-template-columns: 34px minmax(0, 1.6fr) minmax(0, 1.2fr) minmax(0, 0.6fr) auto; }
.project-sheet { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: clamp(28px, 5vw, 80px); }
.project-sheet h2 { font-size: 1.3rem; font-weight: 600; padding-bottom: 10px; border-bottom: 2px solid var(--ink); }
.facts { margin: 0; }
.facts > div { display: grid; grid-template-columns: 9em 1fr; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
.facts dt { color: var(--ink-3); font-size: 0.92rem; }
.facts dd { margin: 0; font-weight: 500; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.facts .seg { width: 22px; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding-block: 8px 72px; }
.pager a { display: grid; gap: 4px; padding: 20px 0 0; border-top: 2px solid var(--ink); text-decoration: none; }
.pager a[rel='next'] { text-align: end; }
.pager .k { font-size: 0.88rem; color: var(--ink-3); }
.pager .v { font-family: var(--display); font-weight: 600; font-size: 1.15rem; display: inline-flex; gap: 10px; align-items: center; }
.pager a[rel='next'] .v { justify-content: flex-end; }
.pager a:hover .v { text-decoration: underline; text-decoration-color: var(--marking); text-decoration-thickness: 2px; text-underline-offset: 0.35em; }
.note-dark { color: var(--on-dark-2); margin-bottom: 28px; max-width: 62ch; }
.fleet-intro { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(20px, 4vw, 56px); color: var(--on-dark-2); margin-bottom: clamp(32px, 4vw, 52px); max-width: 1100px; }
.fleet-intro p:first-child { color: var(--on-dark); font-size: 1.15rem; }
.cats.wide { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.iso.wide { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 32px; }
.commit { font-size: clamp(1.15rem, 1.6vw, 1.35rem); line-height: 1.7; max-width: 60ch; padding-top: 14px; }
.values.light { border-top: 0; }
.values.light li { border-bottom-color: var(--rule); }
.values.light span { color: var(--ink-2); }
@media (max-width: 900px) {
  .project-sheet, .fleet-intro { grid-template-columns: 1fr; }
  .cats.wide, .iso.wide { grid-template-columns: 1fr 1fr; }
  .logs.compact .log-row { grid-template-columns: 30px minmax(0, 1fr); }
  .logs.compact .log-row > * { grid-column: 2; }
  .logs.compact .log-row > .seg { grid-column: 1; grid-row: 1; }
}
@media (max-width: 560px) {
  .cats.wide, .iso.wide { grid-template-columns: 1fr; }
  .pager { grid-template-columns: 1fr; }
  .pager a[rel='next'] { text-align: start; }
  .pager a[rel='next'] .v { justify-content: flex-start; }
  .facts > div { grid-template-columns: 1fr; gap: 2px; }
  .tablist { gap: 0 20px; }
}
.field .err[hidden], .err[hidden] { display: none; }

/* ---------- Official bar: the registration and approval a procurement officer checks first ---------- */
.officialbar { background: #0e0f10; color: var(--on-dark-2); font-size: 0.82rem; }
.officialbar-in { width: var(--wrap); margin-inline: auto; min-height: 36px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
.officialbar ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px; }
.officialbar li { display: inline-flex; align-items: center; gap: 7px; }
.officialbar .icon { color: var(--marking); width: 1em; height: 1em; }
.officialbar a { color: var(--on-dark-2); text-decoration: none; }
.officialbar a:hover { color: var(--on-dark); }
@media (max-width: 900px) { .officialbar .creds li + li { display: none; } }
@media (max-width: 560px) { .officialbar .reach li + li { display: none; } }

.xsec-caption .swipe { display: none; }
.xsec-scroll:focus-visible { outline-offset: -3px; }

/* Sub-pages: a shorter section that names only the page's network */
.xsec.compact .xsec-grid { grid-template-columns: 1fr; }
.xsec.compact .xsec-figure { width: 100%; max-width: 780px; margin-inline: auto; }
.pagehead.compact { padding-block: clamp(28px, 3.4vw, 44px) clamp(22px, 2.6vw, 32px); }
.pagehead.compact h1 { font-size: clamp(2rem, 3.6vw, 3rem); max-width: 24ch; }
.pagehead.compact p { margin-top: 10px; }
.pagehead.compact .actions { margin-top: 18px; }

/* Buttons whose labels wrap keep an even leading */
.btn { line-height: 1.4; padding-block: 10px; text-wrap: balance; text-align: center; }

/* Quote: stands on scale; a drawing-leader tick above the attribution */
.quote { grid-template-columns: minmax(0, 1fr); }
.quote figcaption::before { content: ''; display: block; width: 44px; height: 2px; background: var(--marking); margin-bottom: 14px; }

/* Equipment categories: leader tick from the section's drawing vocabulary */
.cats .tick { flex: none; width: 14px; height: 2px; background: var(--marking); transform: translateY(-0.3em); }

/* Prototype note: a static strip at the very top, never over content */
.proto-flag { position: static; display: block; max-width: none; border-radius: 0; box-shadow: none; background: var(--marking); color: var(--ink); text-align: center; font-size: 0.82rem; padding: 6px var(--gutter); inset: auto; }

/* Projects on narrow screens: one stacked column, toggle underneath */
@media (max-width: 700px) {
  .log-row, .logs.compact .log-row { grid-template-columns: 1fr; row-gap: 6px; }
  .log-row > * , .logs.compact .log-row > * { grid-column: 1 !important; grid-row: auto !important; }
  .log-row .seg { width: 30px; }
  .log-row .toggle { justify-self: start; margin-top: 6px; }
  .log-detail { grid-template-columns: 1fr; }
  .log-detail p, .log-detail .scope { grid-column: 1; }
}

/* Home: strata seams where one ground meets the next */
.seam { display: grid; grid-template-rows: 6px 4px 8px; }
.seam i:nth-child(1) { background: var(--asphalt-3); }
.seam i:nth-child(2) { background: #6b675f; }
.seam i:nth-child(3) { background: var(--aggregate) radial-gradient(circle at 30% 40%, rgba(0,0,0,0.18) 1px, transparent 1.6px) 0 0 / 9px 7px; }
@media (max-width: 700px) { .xsec-caption .swipe { display: inline; } }
/* The schematic caption sits under the drawing, never over a label */
.xsec-caption { position: static; display: block; background: transparent; padding: 6px 16px 10px; text-align: end; border-radius: 0; }

/* Sub-pages: the content starts right under the compact section */
.xsec.compact + .band { padding-top: clamp(24px, 3vw, 36px); }
/* Prototype note: neutral strip, the marking yellow stays reserved for actions */
.proto-flag { background: var(--ground); color: var(--ink-2); border-bottom: 2px solid var(--marking); }
/* An invalid field stays red while focused */
.field [aria-invalid='true']:focus { border-color: #b3261e; box-shadow: 0 0 0 3px rgba(179, 38, 30, 0.22); }

  </style>

      },
    },

  // Each service (by its content icon) maps to a network in the section,
  // a colour from the logo's arcs, and the project categories it delivered.
  const NETWORK = {
    Droplets: { id: 'water', c: 'var(--water)', ink: 'var(--water-ink)', icon: 'droplets', projects: ['water'], type: 'water-sewerage' },
    CloudRain: { id: 'storm', c: 'var(--sewer)', ink: 'var(--sewer-ink)', icon: 'cloud-rain', projects: ['water'], type: 'water-sewerage' },
    Zap: { id: 'power', c: 'var(--power)', ink: 'var(--power-ink)', icon: 'zap', projects: ['electrical'], type: 'other' },
    Route: { id: 'road', c: 'var(--road)', ink: 'var(--road-ink)', icon: 'route', projects: ['roads'], type: 'roads-asphalt' },
    Construction: { id: 'structure', c: 'var(--concrete)', ink: 'var(--ink-2)', icon: 'construction', projects: [], type: 'bridges-tunnels' },
    Building2: { id: 'landscape', c: 'var(--sewer)', ink: 'var(--sewer-ink)', icon: 'trees', projects: ['urban'], type: 'urban-development' },
    ShieldCheck: { id: 'qc', c: 'var(--aggregate)', ink: 'var(--ink-2)', icon: 'flask-conical', projects: [], type: 'other' },
    Truck: { id: 'fleet', c: 'var(--marking)', ink: 'var(--road-ink)', icon: 'truck', projects: [], type: 'equipment-rental' },
    Settings: { id: 'om', c: 'var(--sewer)', ink: 'var(--sewer-ink)', icon: 'settings', projects: [], type: 'other' },
  };
  const SERVICE_SLUG = { water: 'water-sewerage', storm: 'stormwater', power: 'electrical-solar', road: 'roads-asphalt', structure: 'bridges-tunnels', landscape: 'landscaping', qc: 'quality-laboratory', fleet: 'equipment-rental', om: 'operation-maintenance' };
  const PROJECT_SERVICE = { water: 'Droplets', roads: 'Route', electrical: 'Zap', urban: 'Building2' };
  const slugify = (x) => String(x).toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const projectSlug = (id) => slugify(content.en.projects.items.find((p) => p.id === id)?.title || id);
  const PROJECT_COLOR = { water: 'var(--water)', roads: 'var(--road)', electrical: 'var(--power)', urban: 'var(--sewer)' };

  const state = { lang: 'ar', page: '', sub: '', svc: 0, picked: false, filter: 'all', open: new Set(), prefill: null, role: '', tabs: {} };

  // ---------- helpers ----------
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const icon = (name, cls = '') => `<span class="icon ${cls}" aria-hidden="true">${icons[name] || ''}</span>`;
  const t = () => content[state.lang];
  const ui = () => UI[state.lang];
  const rtl = () => state.lang === 'ar';
  const arrow = () => icon(rtl() ? 'arrow-left' : 'arrow-right');
  const href = (page, lang = state.lang) => `#/${lang === 'en' ? 'en/' : ''}${page}`;
  const $ = (sel, el = document) => el.querySelector(sel);
  const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
  const net = (svc) => NETWORK[svc.icon] || NETWORK.Settings;
  // Arabic counted nouns: 1 and 2 have their own forms, 3–10 take the plural,
  // 11 and above the singular accusative. English uses the content labels.
  const counted = (n, key, fallback) => {
    const f = ui().tally?.[key];
    if (!f) return `<strong class="num">${n}</strong> ${esc(fallback)}`;
    if (n === 1) return `<strong class="num">1</strong> ${esc(f[0])}`;
    if (n === 2) return esc(f[1]);
    return `<strong class="num">${n}</strong> ${esc(n <= 10 ? f[2] : f[3])}`;
  };
  const svcSlug = (svc) => SERVICE_SLUG[net(svc).id];
  const svcBySlug = (slug) => t().services.items.findIndex((x) => svcSlug(x) === slug);
  const projBySlug = (slug) => t().projects.items.find((p) => projectSlug(p.id) === slug);

  function parseHash() {
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    let lang = 'ar';
    if (parts[0] === 'en') { lang = 'en'; parts.shift(); }
    const page = PAGES.includes(parts[0] || '') ? (parts[0] || '') : '';
    let sub = parts[1] || '';
    if (page === 'services' && !Object.values(SERVICE_SLUG).includes(sub)) sub = '';
    if (page === 'projects' && !content.en.projects.items.some((p) => projectSlug(p.id) === sub)) sub = '';
    if (page !== 'services' && page !== 'projects') sub = '';
    return { lang, page, sub };
  }

  function go(page, opts = {}) {
    if (opts.prefill !== undefined) state.prefill = opts.prefill;
    if (opts.role !== undefined) state.role = opts.role;

  // ---------- the street section ----------
  const W = 1200, H = 470, TOP = 34, SURF = 70, M = 80;
  function sectionSVG(compact = false) {
    const U = ui(), short = U.short;
    const sc = compact ? 1.4 : 1; // label scale
    const R = rtl();
    const X = (x) => (R ? W - x : x);
    const rx = (x, w) => (R ? W - x - w : x); // rect x after mirroring
    const anchor = (a) => (a === 'middle' ? 'middle' : (R ? (a === 'start' ? 'end' : 'start') : a));
    const rect = (x, y, w, h, attrs = '') => `<rect x="${rx(x, w)}" y="${y}" width="${w}" height="${h}" ${attrs}/>`;
    const circ = (cx, cy, r, attrs = '') => `<circle cx="${X(cx)}" cy="${cy}" r="${r}" ${attrs}/>`;
    const line = (x1, y1, x2, y2, attrs = '') => `<line x1="${X(x1)}" y1="${y1}" x2="${X(x2)}" y2="${y2}" ${attrs}/>`;
    const svcIndex = Object.fromEntries(t().services.items.map((s, i) => [net(s).id, i]));
    const tag = (id, px, py, lx, ly, a = 'middle') => `
      <g class="tag${state.picked && t().services.items[state.svc] && net(t().services.items[state.svc]).id === id ? ' on' : ''}" data-net="${id}" data-anchor="${anchor(a)}">
        ${line(px, py, lx, ly + (ly < py ? 8 : -8), 'stroke="#f3f2ed" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.8"')}
        <circle cx="${X(px)}" cy="${py}" r="3" fill="#f3f2ed"/>
        <rect rx="2" fill="#f3f4f3" x="0" y="0" width="0" height="0"/>
        <text x="${X(lx)}" y="${ly}" text-anchor="${anchor(a)}" dominant-baseline="middle" font-size="${15 * sc}" font-family="Readex Pro, system-ui, sans-serif" font-weight="500" fill="#17181a">${esc(short[id])}</text>
      </g>`;
    const group = (id, i, body, glow) => `<g class="net${state.picked && t().services.items[state.svc] && net(t().services.items[state.svc]).id === id ? ' on' : ''}" data-net="${id}" data-svc="${svcIndex[id]}" style="--i:${i}" role="button" tabindex="-1" aria-label="${esc(t().services.items[svcIndex[id]].title)}">${glow ? `<g class="hitarea">${glow.replace(/fill="none"/g, 'fill="transparent"')}</g><g class="glow">${glow}</g>` : ''}${body}</g>`;

    // dotted aggregate + basalt textures
    const defs = `
      <defs>
        <pattern id="agg" width="11" height="9" patternUnits="userSpaceOnUse"><rect width="11" height="9" fill="#8b857a"/><circle cx="3" cy="3" r="1.3" fill="#6f6a61"/><circle cx="8.5" cy="6.5" r="1" fill="#a39d91"/></pattern>
        <pattern id="sub" width="13" height="11" patternUnits="userSpaceOnUse"><rect width="13" height="11" fill="#a59d8c"/><circle cx="4" cy="4" r="1.1" fill="#8d8676"/><circle cx="10" cy="8" r="0.9" fill="#bdb5a4"/></pattern>
        <pattern id="bas" width="23" height="19" patternUnits="userSpaceOnUse"><rect width="23" height="19" fill="#2e2a27"/><path d="M3 5l3-2 2 3-3 1z" fill="#3c3632"/><path d="M14 13l4-1 1 3-4 1z" fill="#37322e"/><circle cx="18" cy="4" r="1" fill="#46403a"/></pattern>
        <pattern id="sand" width="9" height="8" patternUnits="userSpaceOnUse"><rect width="9" height="8" fill="#c9a46a"/><circle cx="2" cy="2" r="0.7" fill="#b8925a"/><circle cx="6.5" cy="5.5" r="0.6" fill="#d8b97f"/></pattern>
      </defs>`;

    // strata (settle once)
    const strata = `
      <g class="stratum" style="--i:5">${rect(0, 250, W, H - TOP - 250, 'fill="url(#bas)"')}</g>
      <g class="stratum" style="--i:4">${rect(0, 96, W, 154, 'fill="url(#sand)"')}</g>
      <g class="stratum" style="--i:3">${rect(160, 130, 880, 40, 'fill="url(#sub)"')}</g>
      <g class="stratum" style="--i:2">${rect(160, 96, 880, 34, 'fill="url(#agg)"')}</g>
      <g class="stratum" style="--i:1">${rect(160, 82, 880, 14, 'fill="#3a3b3f"')}${rect(0, 74, 150, 22, 'fill="#d9cfbd"')}${rect(1050, 74, 150, 22, 'fill="#d9cfbd"')}</g>
      <g class="stratum" style="--i:0">${rect(160, SURF, 880, 12, 'fill="#0f1012"')}${rect(0, 62, 150, 12, 'fill="#b7b2a7"')}${rect(1050, 62, 150, 12, 'fill="#b7b2a7"')}${rect(150, 58, 12, 52, 'fill="#a7a298"')}${rect(1038, 58, 12, 52, 'fill="#a7a298"')}
        ${rect(590, 68, 20, 4, 'fill="#f6b81c"')}${rect(370, 68, 20, 4, 'fill="#e9e7df"')}${rect(810, 68, 20, 4, 'fill="#e9e7df"')}</g>`;

    // depth ruler at the inline-start edge
    let ruler = '';
    for (let k = 0; k <= 4; k += 1) {
      const y = SURF + k * M;
      ruler += line(0, y, 12, y, 'stroke="#f3f2ed" stroke-width="1.5" opacity="0.85"');
      ruler += `${rect(14, y + 4, 50 * sc, 20 * sc, 'rx="2" fill="rgba(23,24,26,0.78)"')}<text x="${X(14 + 25 * sc)}" y="${y + 4 + 10.5 * sc}" text-anchor="middle" dominant-baseline="middle" font-size="${12 * sc}" font-family="Readex Pro, system-ui, sans-serif" fill="#f3f2ed">${k === 0 ? '0.0' : `−${k}.0`} ${U.depthUnit}</text>`;
    }
    ruler = `<g aria-hidden="true">${line(4, SURF, 4, SURF + 4 * M, 'stroke="#f3f2ed" stroke-width="1" opacity="0.5"')}${ruler}</g>`;

    const nets = [
      group('road', 0,
        `${rect(160, SURF, 880, 100, 'class="hit"')}`,
        `${rect(158, SURF - 2, 884, 104, 'fill="none" stroke="#f6b81c" stroke-width="3"')}`),
      group('water', 1,
        `${circ(330, 215, 36, 'fill="#dcc79c"')}${circ(330, 215, 25, 'fill="#3fa29b"')}${circ(330, 215, 16, 'fill="#123c39"')}
         ${circ(640, 345, 46, 'fill="#4a433d"')}${circ(640, 345, 37, 'fill="#3fa29b"')}${circ(640, 345, 27, 'fill="#10302d"')}`,
        `${circ(330, 215, 41, 'fill="none" stroke="#3fa29b" stroke-width="3"')}${circ(640, 345, 51, 'fill="none" stroke="#3fa29b" stroke-width="3"')}`),
      group('om', 2,
        `${rect(612, 72, 56, 236, 'fill="rgba(15,16,18,0.55)" stroke="#a7a298" stroke-width="4"')}
         ${[100, 130, 160, 190, 220, 250, 280].map((y) => line(626, y, 654, y, 'stroke="#a7a298" stroke-width="2.5"')).join('')}
         ${rect(604, 64, 72, 8, 'fill="#55524c"')}`,
        `${rect(606, 60, 68, 254, 'fill="none" stroke="#6cbf88" stroke-width="3"')}`),
      group('storm', 3,
        `${rect(820, 268, 124, 76, 'fill="#a7a298"')}${rect(832, 280, 100, 52, 'fill="#173325"')}${rect(832, 318, 100, 14, 'fill="#2f6b4a" opacity="0.8"')}`,
        `${rect(814, 262, 136, 88, 'fill="none" stroke="#6cbf88" stroke-width="3"')}`),
      group('power', 4,
        `${rect(1062, 0, 76, 140, 'class="hit"')}${line(1120, 64, 1120, 6, 'stroke="#e5862b" stroke-width="5"')}${line(1120, 10, 1082, 10, 'stroke="#e5862b" stroke-width="4"')}${rect(1068, 8, 20, 7, 'fill="#f6b81c"')}
         ${line(1120, 74, 1120, 140, 'stroke="#e5862b" stroke-width="2" stroke-dasharray="5 4"')}
         ${rect(1066, 140, 100, 58, 'fill="#9a958c"')}
         ${[[1086, 157], [1116, 157], [1146, 157], [1086, 181], [1116, 181]].map(([x, y]) => circ(x, y, 9, 'fill="#2a1a0c" stroke="#e5862b" stroke-width="3.5"')).join('')}
         ${circ(1146, 181, 6, 'fill="#2a1a0c" stroke="#f6b81c" stroke-width="2.5"')}`,
        `${rect(1060, 134, 112, 70, 'fill="none" stroke="#e5862b" stroke-width="3"')}`),
      group('structure', 5,
        `${rect(1176, 24, 18, 268, 'fill="#a7a298"')}${rect(1138, 290, 62, 20, 'fill="#a7a298"')}${[60, 110, 160, 210, 260].map((y) => line(1176, y, 1194, y, 'stroke="#8a857b" stroke-width="1.5"')).join('')}`,
        `${rect(1132, 18, 68, 298, 'fill="none" stroke="#a7a298" stroke-width="3"')}`),
      group('landscape', 6,
        `${rect(66, 62, 64, 46, 'fill="#4e3c2b"')}${rect(94, 18, 8, 46, 'fill="#6b5338"')}${circ(98, 20, 24, 'fill="#6cbf88"')}${circ(84, 30, 14, 'fill="#5aa874"')}${circ(112, 32, 12, 'fill="#5aa874"')}
         ${line(40, 100, 140, 100, 'stroke="#6cbf88" stroke-width="3" stroke-dasharray="2 6"')}`,
        `${rect(60, -6, 76, 118, 'fill="none" stroke="#6cbf88" stroke-width="3"')}`),
      group('qc', 7,
        `${rect(470, 64, 22, 108, 'fill="rgba(233,231,223,0.18)" stroke="#e9e7df" stroke-width="2" stroke-dasharray="6 4"')}`,
        `${rect(464, 58, 34, 120, 'fill="none" stroke="#e9e7df" stroke-width="3"')}`),
    ].join('');

    const tags = [
      tag('landscape', 120, 22, 150, 30, 'start'),
      tag('road', 500, SURF + 6, 500, 30),
      tag('om', 640, 64, 680, 30, 'start'),
      tag('power', 1082, 10, 1046, 30, 'end'),
      tag('qc', 481, 172, 481, 208),
      tag('water', 330, 251, 330, 300),
      tag('storm', 882, 344, 882, 392),
      tag('structure', 1170, 310, 1172, 360, 'end'),
    ].join('');

    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" style="direction:ltr" role="group" aria-labelledby="xsec-h" xmlns="http://www.w3.org/2000/svg">${defs}<g transform="translate(0 ${TOP})">${strata}${nets}${ruler}${tags}</g></svg>`;
  }

  // Fit each tag's paper box to its rendered text.
  function fitTags(root) {
    $$('.tag', root).forEach((g) => {
      const text = $('text', g), box = $('rect', g);

        box.setAttribute('x', b.x - 8); box.setAttribute('y', b.y - 4);
        box.setAttribute('width', b.width + 16); box.setAttribute('height', b.height + 8);
      } catch { /* not rendered yet */ }
    });
  }

  function reader() {

  function logsBlock(limit) {
    const P = t().projects;

    const clients = new Set(P.items.map((p) => p.client)).size;
    const places = new Set(P.items.map((p) => p.location)).size;
    return `
      <div class="filters" role="group" aria-label="${esc(P.title)}">
        ${P.categories.map((c) => `<button type="button" data-filter="${c.key}" aria-pressed="${state.filter === c.key}">${c.key !== 'all' ? `<span class="seg" style="--c:${PROJECT_COLOR[c.key]}"></span>` : ''}${esc(c.label)}</button>`).join('')}
      </div>
      <p class="tally">${counted(P.items.length, 'projects', P.statLabels.projects)} · ${counted(clients, 'clients', P.statLabels.clients)} · ${counted(places, 'places', P.statLabels.regions)} · ${counted(done, 'completed', P.statLabels.completed)}</p>
      ${shown.length ? `<ol class="logs">${shown.map((p) => {
        const open = state.open.has(p.id);

        return `
          <li class="log" id="project-${p.id}">

              <span class="status ${live ? 'live' : 'done'}">${esc(p.status)}</span>
              <button class="toggle" type="button" aria-expanded="${open}" aria-controls="pd-${p.id}" data-toggle="${p.id}">${esc(open ? P.collapse : P.expand)}${icon('chevron-down')}</button>

              <p>${esc(p.desc)}</p>
              <div class="scope"><h4>${esc(P.labels.scope)}</h4><ul>${(p.scope || []).map((s) => `<li>${esc(s)}</li>`).join('')}</ul>

      }).join('')}</ol>` : `<p class="empty">${esc(P.empty)}</p>`}`;

    const cur = items.some((i) => i.key === state.tabs[id]) ? state.tabs[id] : items[0].key;
    return `
      <div class="tabs ${tone}" data-tabs="${id}">
        <div class="tablist" role="tablist" aria-label="${esc(label)}">${items.map((it) => `<button type="button" role="tab" id="tab-${id}-${it.key}" aria-controls="panel-${id}-${it.key}" aria-selected="${cur === it.key}" tabindex="${cur === it.key ? 0 : -1}" data-tab="${id}" data-key="${it.key}">${esc(it.label)}${it.count !== undefined ? `<span class="count num">${it.count}</span>` : ''}</button>`).join('')}</div>
        ${items.map((it) => `<div class="tabpanel" role="tabpanel" id="panel-${id}-${it.key}" aria-labelledby="tab-${id}-${it.key}" tabindex="0"${cur === it.key ? '' : ' hidden'}>${it.html}</div>`).join('')}
      </div>`;
  }
  function selectTab(btn, focus) {
    const id = btn.dataset.tab, key = btn.dataset.key;
    state.tabs[id] = key;
    const box = btn.closest('.tabs');
    $$('[role=tab]', box).forEach((b) => { const on = b === btn; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; });
    $$('[role=tabpanel]', box).forEach((p) => { p.hidden = p.id !== `panel-${id}-${key}`; });
    if (focus) btn.focus();
  }

  function relatedLogs(items) {
    const P = t().projects;
    return `<ol class="logs compact">${items.map((p) => `
      <li class="log"><div class="log-row">
        <span class="seg" style="--c:${PROJECT_COLOR[p.key]}" aria-hidden="true"></span>
        <h3><a href="${href(`projects/${projectSlug(p.id)}`)}">${esc(p.title)}</a></h3>
        <p class="meta"><span>${esc(P.labels.client)}: ${esc(p.client)}</span><span>${esc(P.labels.location)}: ${esc(p.location)}</span></p>
        <span class="status ${/complete|منجز|مكتمل/i.test(p.status) ? 'done' : 'live'}">${esc(p.status)}</span>
        <a class="textlink" href="${href(`projects/${projectSlug(p.id)}`)}">${esc(ui().details)} ${arrow()}</a>
      </div></li>`).join('')}</ol>`;
  }

  function pageService() {
    const T = t(), S = T.services, U = ui();
    const i = svcBySlug(state.sub);
    const s = S.items[i], n = net(s);
    const rel = T.projects.items.filter((p) => n.projects.includes(p.key));
    const prev = S.items[(i + S.items.length - 1) % S.items.length];
    const next = S.items[(i + 1) % S.items.length];
    const scope = `<ul class="caps big" style="--c-ink:${n.ink}">${s.capabilities.map((c) => `<li>${icon('check')}<span>${esc(c)}</span></li>`).join('')}</ul>`;
    const projects = rel.length ? relatedLogs(rel) : `<p class="empty">${esc(U.noProjects)}</p>`;
    return `
      ${pagehead(s.title, s.desc, `<div class="actions"><a class="btn btn-mark" href="#svc-quote" data-jump="svc-quote">${esc(U.quickQuote)}</a><a class="textlink on-dark" href="${href('services')}">${esc(U.allDisciplines)} ${arrow()}</a></div>`, true)}
      ${n.id === 'fleet' ? `<section class="band band-basalt"><div class="wrap"><p class="note-dark">${esc(U.fleetNote)}</p>${fleetBlock(false)}</div></section>` : streetSection(true)}
      <section class="band band-paper"><div class="wrap svc-detail" style="--c:${n.c}">
        ${tabs('svc', s.title, [
          { key: 'scope', label: U.scopeTab, count: s.capabilities.length, html: scope },
          { key: 'projects', label: U.projectsTab, count: rel.length, html: projects },
        ])}
      </div></section>
      <section class="band" id="svc-quote"><div class="wrap sheet-grid">
        ${quoteForm('q', U.quickQuote, { type: n.type, message: `${S.inquireCta} ${s.title}: ` })}
        <aside class="aside"><div class="block"><h3>${esc(T.contact.officeHeading)}</h3>${channels()}</div></aside>
      </div></section>
      <nav class="pager wrap" aria-label="${esc(U.allDisciplines)}">
        <a href="${href(`services/${svcSlug(prev)}`)}" rel="prev"><span class="k">${esc(U.prevDiscipline)}</span><span class="v"><span class="seg" style="--c:${net(prev).c}"></span>${esc(prev.title)}</span></a>
        <a href="${href(`services/${svcSlug(next)}`)}" rel="next"><span class="k">${esc(U.nextDiscipline)}</span><span class="v"><span class="seg" style="--c:${net(next).c}"></span>${esc(next.title)}</span></a>
      </nav>`;
  }

  function pageProject() {
    const T = t(), P = T.projects, U = ui();
    const p = projBySlug(state.sub);
    const cat = P.categories.find((c) => c.key === p.key)?.label || p.category;
    const svcI = T.services.items.findIndex((x) => x.icon === PROJECT_SERVICE[p.key]);
    const svc = T.services.items[svcI];
    const more = P.items.filter((x) => x.key === p.key && x.id !== p.id);
    return `
      ${pagehead(p.title, p.desc, `<div class="actions"><button class="btn btn-mark" type="button" data-inquire-project="${p.id}">${esc(P.detailsCta)}</button><a class="textlink on-dark" href="${href('projects')}">${esc(U.allProjects)} ${arrow()}</a></div>`, true)}
      ${streetSection(true)}
      <section class="band band-paper"><div class="wrap project-sheet">
        <div><h2>${esc(U.projectSheet)}</h2>
          <dl class="facts">
            <div><dt>${esc(P.labels.client)}</dt><dd>${esc(p.client)}</dd></div>
            <div><dt>${esc(P.labels.location)}</dt><dd>${esc(p.location)}</dd></div>
            <div><dt>${esc(U.category)}</dt><dd><span class="seg" style="--c:${PROJECT_COLOR[p.key]}"></span>${esc(cat)}</dd></div>
            <div><dt>${esc(P.labels.status)}</dt><dd><span class="status ${/complete|منجز|مكتمل/i.test(p.status) ? 'done' : 'live'}">${esc(p.status)}</span></dd></div>
            ${svc ? `<div><dt>${esc(U.discipline)}</dt><dd><a class="textlink" href="${href(`services/${svcSlug(svc)}`)}">${esc(svc.title)}</a></dd></div>` : ''}
          </dl></div>
        <div><h2>${esc(P.labels.scope)}</h2><ul class="caps big" style="--c-ink:var(--ink)">${(p.scope || []).map((x) => `<li>${icon('check')}<span>${esc(x)}</span></li>`).join('')}</ul></div>
      </div></section>
      ${more.length ? `<section class="band"><div class="wrap"><div class="head"><h2>${esc(U.moreProjects)}</h2></div>${relatedLogs(more)}</div></section>` : ''}
      ${closeBlock()}`;
  }

  const PAGE_FN = { '': pageHome, about: pageAbout, services: pageServices, projects: pageProjects, equipment: pageEquipment, certifications: pageCerts, journey: pageJourney, leadership: pageLeadership, contact: pageContact, careers: pageCareers };

  function pageTitle() {
    const T = t();
    if (state.page === 'services' && state.sub) return `${T.services.items[svcBySlug(state.sub)].title} — ${T.brandLine}`;
    if (state.page === 'projects' && state.sub) return `${projBySlug(state.sub).title} — ${T.brandLine}`;
    if (!state.page) return `${T.brandLine} — ${T.hero.title}`;
    if (state.page === 'careers') return `${T.careers.title} — ${T.brandLine}`;
    const n = T.nav.find((x) => x.id === state.page);
    return `${n ? n.label : ''} — ${T.brandLine}`;
  }

  // ---------- render ----------
  let lastKey = '';
  function render(force = false) {
    const { lang, page, sub } = parseHash();
    const changedPage = page !== state.page || lang !== state.lang || sub !== state.sub;
    state.lang = lang; state.page = page; state.sub = sub;
    const key = `${lang}/${page}/${sub}`;
    if (changedPage) state.picked = false;
    if (page === 'services' && sub) { state.svc = svcBySlug(sub); state.picked = true; }
    if (page === 'projects' && sub) {
      const p = projBySlug(sub);
      const i = t().services.items.findIndex((x) => x.icon === PROJECT_SERVICE[p.key]);
      if (i >= 0) { state.svc = i; state.picked = true; }
    }
    if (!force && key === lastKey) return;
    if (page !== 'contact') state.prefill = null;
    lastKey = key;

    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.title = pageTitle();
    $('.skip').textContent = ui().skip;
    $('#officialbar').innerHTML = officialBar();
    $('#masthead').innerHTML = masthead();
    $('#main').innerHTML = (page === 'services' && sub) ? pageService() : (page === 'projects' && sub) ? pageProject() : PAGE_FN[page]();
    $('#footer').innerHTML = footer();
    const flag = $('#proto-flag');
    flag.innerHTML = `<span>${esc(ui().proto)}</span>`;
    fitTags(document);
    requestAnimationFrame(() => fitTags(document));
    buildGauge();
    if (changedPage || force) window.scrollTo({ top: 0, behavior: 'auto' });
    if (state.jump) { const el = document.getElementById(state.jump); state.jump = null; if (el) el.scrollIntoView(); }
  }

  function refreshReader() {
    const panel = $('#discipline');
    if (panel) panel.outerHTML = disciplinePanel();
    $$('.legend button').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.svc) === state.svc)));
    $$('#xsec').forEach((fig) => {
      fig.classList.toggle('picked', state.picked);
      fig.classList.remove('settle');
      const id = net(t().services.items[state.svc]).id;
      $$('.net, .tag', fig).forEach((g) => g.classList.toggle('on', state.picked && g.dataset.net === id));
    });
  }

  function refreshLogs() {
    const host = $('.logs')?.closest('.wrap') || $('.filters')?.closest('.wrap');
    if (!host) return;
    const head = $('.head', host);
    host.innerHTML = (head ? head.outerHTML : '') + logsBlock();
  }

  // ---------- depth gauge ----------
  function buildGauge() {
    const g = $('#gauge');
    const sections = $$('#main > section');
    g.innerHTML = `<span class="line"></span>${sections.map((_, i) => `<span class="tick" style="top:${(i / Math.max(1, sections.length - 1)) * 100}%"></span>`).join('')}<span class="mark"></span>`;
    moveGauge();
  }
  function moveGauge() {
    const mark = $('#gauge .mark');
    if (!mark) return;
    const max = document.documentElement.scrollHeight - innerHeight;
    mark.style.top = `${max > 0 ? (scrollY / max) * 100 : 0}%`;
    const fig = $('#xsec');
    const r = fig && fig.getBoundingClientRect();
    $('#gauge').classList.toggle('aside', !!r && r.bottom > 0 && r.top < innerHeight);
  }

  // ---------- forms ----------
  const validEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
  function setErr(id, bad, msg) {
    const input = document.getElementById(id);
    const err = document.getElementById(`${id}-err`);
    if (err && msg) err.lastChild.textContent = msg;
    input?.setAttribute('aria-invalid', String(bad));
    if (err) err.hidden = !bad;
    return bad;
  }
  function submitLike(form, statusId, okText) {
    const btn = $('button[type=submit]', form);
    btn.setAttribute('aria-busy', 'true'); btn.disabled = true;
    const label = btn.lastChild.textContent;
    btn.lastChild.textContent = form.id === 'apply-form' ? t().careers.submitting : t().contact.submitting;
    setTimeout(() => {
      btn.removeAttribute('aria-busy'); btn.disabled = false; btn.lastChild.textContent = label;
      document.getElementById(statusId).innerHTML = `<div class="notice ok" role="status">${icon('check')}<div><strong>${esc(okText)}</strong><br><span>${esc(ui().protoSent)}</span></div></div>`;
      form.reset();
    }, 900);
  }

  // ---------- events ----------
  document.addEventListener('click', (e) => {
    const el = e.target.closest('button, a, .net');
    if (!el) return;
    const T = t();

    if (el.matches('.menu-btn')) {
      const d = $('#drawer'); const open = !d.classList.contains('open');
      d.style.top = `${Math.max(0, $('#masthead').getBoundingClientRect().bottom)}px`;
      d.classList.toggle('open', open); el.setAttribute('aria-expanded', String(open));
      el.innerHTML = icon(open ? 'x' : 'menu'); el.setAttribute('aria-label', open ? ui().close : ui().menu);
      return;
    }
    if (el.matches('.drawer a')) { $('#drawer').classList.remove('open'); }

    if (el.matches('.net')) {
      state.svc = Number(el.dataset.svc); state.picked = true; refreshReader();
      const panel = $('#discipline'); const r = panel?.getBoundingClientRect();
      if (r && r.top > innerHeight - 120) panel.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' });
      return;
    }
    if (el.matches('[role=tab]')) { selectTab(el); return; }
    if (el.matches('.legend button')) { state.svc = Number(el.dataset.svc); state.picked = true; refreshReader(); return; }

    if (el.dataset.inquire !== undefined) {
      const s = T.services.items[Number(el.dataset.inquire)];
      go('contact', { prefill: { type: net(s).type, message: `${T.services.inquireCta} ${s.title}: ` } });
      return;
    }
    if (el.dataset.inquireProject) {
      const p = T.projects.items.find((x) => String(x.id) === el.dataset.inquireProject);
      const type = { water: 'water-sewerage', roads: 'roads-asphalt', urban: 'urban-development' }[p.key] || 'other';
      go('contact', { prefill: { type, message: `${T.projects.detailsCta}: ${p.title} — ` } });
      return;
    }
    if (el.dataset.request) {
      go('contact', { prefill: { type: el.dataset.type || '', message: `${el.dataset.request}: ` } });
      return;
    }
    if (el.dataset.filter) { state.filter = el.dataset.filter; refreshLogs(); $(`[data-filter="${state.filter}"]`)?.focus(); return; }
    if (el.dataset.toggle) {
      const id = Number(el.dataset.toggle);
      if (state.open.has(id)) state.open.delete(id); else state.open.add(id);
      const open = state.open.has(id);
      el.setAttribute('aria-expanded', String(open));
      el.firstChild.textContent = open ? T.projects.collapse : T.projects.expand;
      document.getElementById(`pd-${id}`).hidden = !open;
      return;
    }
    if (el.dataset.project) {
      e.preventDefault();
      state.filter = 'all'; state.open.add(Number(el.dataset.project)); state.jump = `project-${el.dataset.project}`;
      go('projects');
      return;
    }
    if (el.dataset.role) {
      state.role = el.dataset.role;
      const sel = $('#a-role'); if (sel) sel.value = state.role;
      $('#apply').scrollIntoView({ behavior: 'smooth' }); setTimeout(() => $('#a-name')?.focus({ preventScroll: true }), 450);
      return;
    }
    if (el.dataset.jump) { e.preventDefault(); document.getElementById(el.dataset.jump)?.scrollIntoView({ behavior: 'smooth' }); return; }
    if (el.hasAttribute('data-quote')) { state.prefill = null; }
  });

  document.addEventListener('keydown', (e) => {
    const tab = e.target.closest?.('[role=tab]');
    if (tab && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
      const list = $$('[role=tab]', tab.parentElement);
      const i = list.indexOf(tab);
      const fwd = rtl() ? 'ArrowLeft' : 'ArrowRight';
      const j = e.key === 'Home' ? 0 : e.key === 'End' ? list.length - 1 : (i + (e.key === fwd ? 1 : -1) + list.length) % list.length;
      e.preventDefault(); selectTab(list[j], true); return;
    }
    if (e.key === 'Escape' && $('#drawer')?.classList.contains('open')) { $('.menu-btn').click(); $('.menu-btn').focus(); }
  });

  document.addEventListener('change', (e) => {
    if (e.target.id === 'a-file') {
      const f = e.target.files[0];
      $('#a-file-name').textContent = f ? f.name : t().careers.cvNone;
      if (f) setErr('a-cv', false);
    }
  });

  document.addEventListener('submit', (e) => {
    e.preventDefault();
    const form = e.target;
    const v = (n) => (form.elements[n]?.value || '').trim();
    if (form.dataset.kind === 'quote') {
      const x = form.dataset.x;
      const bad = [
        setErr(`${x}-name`, !v('name')),
        setErr(`${x}-email`, !validEmail(v('email')), v('email') ? t().contact.errors.email : ui().emailRequired),
        setErr(`${x}-company`, !v('company')),
        setErr(`${x}-message`, v('message').length < 10),
      ];
      const first = [`${x}-name`, `${x}-email`, `${x}-company`, `${x}-message`][bad.indexOf(true)];
      if (first) { document.getElementById(first).focus(); return; }
      submitLike(form, `${x}-status`, t().contact.success);
    }
    if (form.id === 'apply-form') {
      const hasFile = !!$('#a-file').files.length;
      const bad = [
        setErr('a-name', !v('name')),
        setErr('a-email', !validEmail(v('email')), v('email') ? t().careers.errors.email : ui().emailRequired),
        setErr('a-phone', !v('phone')),
        setErr('a-exp', v('exp') === ''),
        setErr('a-role', !v('role')),
        setErr('a-cv', !v('cv') && !hasFile),
      ];
      const first = ['a-name', 'a-email', 'a-phone', 'a-exp', 'a-role', 'a-cv'][bad.indexOf(true)];
      if (first) { document.getElementById(first).focus(); return; }
      submitLike(form, 'apply-status', t().careers.success);
      $('#a-file-name').textContent = t().careers.cvNone;
    }
  });

  document.addEventListener('input', (e) => {
    const id = e.target.id;
    if (e.target.getAttribute('aria-invalid') === 'true') {
      const ok = id.endsWith('email') ? validEmail(e.target.value.trim()) : id.endsWith('-message') ? e.target.value.trim().length >= 10 : !!e.target.value.trim();
      if (ok) setErr(id, false);
    }
  });

  addEventListener('scroll', moveGauge, { passive: true });
  addEventListener('resize', moveGauge);
  addEventListener('hashchange', () => render());
  // SVG labels are measured again once their faces have actually loaded.
  if (document.fonts) {
    document.fonts.ready.then(() => fitTags(document));
    document.fonts.addEventListener?.('loadingdone', () => fitTags(document));
    document.fonts.load('500 15px "Readex Pro"', 'سنا SACC').then(() => fitTags(document)).catch(() => {});
  }
  render(true);
})();

  </script>
</body>
</html>
