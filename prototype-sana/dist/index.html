/* SACC proposal 5 — "The dark room".
 *
 * The idea: سنا means light. One dark field runs the whole site and in it
 * SACC's real works are the lit things. Light type, few sizes, square
 * corners, no rules, no shadows at rest, no gradients (one neutral scrim on
 * photographs). Sage marks the single primary action and active states.
 */
:root {
  --bg: #1c1d1c;
  --surface: #262726;
  --surface-2: #303130;
  --ink: #f1f1ef;
  --muted: #a3a49f;
  --accent: #8fa68e;
  --accent-hover: #a3b9a2;
  --accent-ink: #1c1d1c;
  --field: #c8c5ba;
  --field-ink: #1c1d1c;
  --field-muted: #4a4a45;
  --danger: #f0a49b;

  --font: 'Onest', 'IBM Plex Sans Arabic', system-ui, sans-serif;
  --display: 'Unbounded', 'Noto Kufi Arabic', system-ui, sans-serif;
  --step-small: clamp(0.8125rem, 0.79rem + 0.1vw, 0.875rem);
  --step-body: clamp(1.0625rem, 1rem + 0.25vw, 1.1875rem);
  --step-lead: clamp(1.25rem, 1.1rem + 0.7vw, 1.625rem);
  --step-head: clamp(2rem, 1.3rem + 3.2vw, 4rem);
  --step-display: clamp(4.5rem, 13vw, 12.5rem);

  --m: 32px;
  --wrap: calc(100% - 2 * var(--m));
  --bar-h: 72px;
  --gap-section: clamp(120px, 14vw, 200px);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);

  color-scheme: dark;
  scrollbar-color: var(--surface-2) var(--bg);
}
@media (max-width: 760px) { :root { --m: 16px; --bar-h: 64px; } }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--bar-h) + 16px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: var(--step-body);
  font-weight: 400;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
html[lang='ar'] body { line-height: 1.75; }
::selection { background: var(--accent); color: var(--accent-ink); }
img { display: block; max-width: 100%; }
a { color: inherit; text-underline-offset: 0.3em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { margin: 0; font-weight: 500; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.wrap { width: var(--wrap); margin-inline: auto; }
.num { font-variant-numeric: tabular-nums lining-nums; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.visually-hidden { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; border: 0 !important; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; inset-inline-start: 12px; top: -80px; z-index: 100; background: var(--accent); color: var(--accent-ink); padding: 10px 16px; text-decoration: none; }
.skip:focus { top: 12px; }
.icon { width: 1.1em; height: 1.1em; display: inline-block; vertical-align: -0.18em; flex: none; }
.icon svg { width: 100%; height: 100%; display: block; stroke-width: 1.5; }
html[dir='rtl'] .flip svg { transform: scaleX(-1); }

/* ---------- Actions ---------- */
.action {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5em;
  min-height: 48px; padding: 10px 22px; border: 0; border-radius: 0;
  background: var(--accent); color: var(--accent-ink);
  font-size: var(--step-body); font-weight: 500; line-height: 1.3; text-decoration: none;
  transition: background-color 180ms var(--ease), transform 180ms var(--ease);
}
.action:hover { background: var(--accent-hover); }
.action:active { transform: translateY(1px); }
.action[aria-busy='true'] { opacity: 0.7; cursor: progress; }
.link {
  display: inline-flex; align-items: center; gap: 0.45em;
  color: var(--ink); text-decoration: underline; text-decoration-thickness: 1px; text-decoration-color: var(--muted);
  transition: text-decoration-color 160ms var(--ease), color 160ms var(--ease);
}
.link:hover { text-decoration-color: var(--accent); color: var(--ink); }
.link .icon { transition: transform 200ms var(--ease); }
.link:hover .icon { transform: translateX(-3px); }
html[dir='ltr'] .link:hover .icon { transform: translateX(3px); }

/* ---------- Bar ---------- */
.bar { position: fixed; inset-inline: 0; top: 0; z-index: 40; height: var(--bar-h); transition: background-color 240ms var(--ease); }
.bar.solid, .bar.inner { background: var(--bg); }
.bar-in { width: var(--wrap); margin-inline: auto; height: 100%; display: flex; align-items: center; gap: 28px; }
.bar .brand img { height: 30px; width: auto; }
.bar nav { margin-inline-start: auto; }
.bar nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px 26px; }
.bar nav a { color: var(--muted); text-decoration: none; font-size: var(--step-body); padding: 8px 0; transition: color 160ms var(--ease); }
.bar nav a:hover, .bar nav a[aria-current='page'] { color: var(--ink); }
.bar nav a[aria-current='page'] { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 0.5em; text-decoration-thickness: 2px; }
.bar .tools { display: flex; align-items: center; gap: 14px; }
.bar .lang { color: var(--ink); text-decoration: none; font-size: var(--step-body); display: inline-flex; gap: 6px; align-items: center; padding: 8px 4px; }
.bar .lang:hover { color: var(--accent); }
.bar .action { min-height: 42px; padding: 8px 18px; }
.menu-btn { display: none; background: transparent; border: 0; color: var(--ink); padding: 8px; }
.menu-btn .icon { width: 26px; height: 26px; }
.drawer { display: none; position: fixed; inset: var(--bar-h) 0 0 0; z-index: 39; background: var(--bg); padding: 24px var(--m); overflow-y: auto; }
.drawer.open { display: block; }
.drawer ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.drawer a { display: block; padding: 10px 0; font-size: var(--step-head); font-weight: 300; color: var(--ink); text-decoration: none; }
.drawer a[aria-current='page'] { color: var(--accent); }
@media (max-width: 1080px) {
  .bar nav { display: none; }
  .menu-btn { display: inline-flex; }
  .bar .tools { margin-inline-start: auto; }
}
@media (max-width: 460px) {
  .bar .lang .long { display: none; }
  .bar .lang .short { display: inline; }
  .bar .action { padding: 8px 12px; }
  .bar .brand img { height: 26px; }
}

/* ---------- Hero: the name from the top edge to the bottom edge ---------- */
.hero { position: relative; height: 100svh; min-height: 620px; overflow: hidden; }
.hero .pic { position: absolute; inset: 0; margin: 0; background: var(--surface); }
.hero .pic img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.82) contrast(1.05); transform-origin: 50% 60%; }
/* one flat neutral scrim over the photograph keeps the type readable and the room dark */
.hero .pic::after { content: ''; position: absolute; inset: 0; background: rgba(20, 21, 20, 0.52); }
/* The name, whole and on one line, across the full width along the bottom edge;
   the sentence and the route to the work sit above it at the start. */
.hero-grid { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; gap: clamp(28px, 4vh, 48px); padding: calc(var(--bar-h) + 24px) var(--m) clamp(20px, 3vh, 36px); }
.hero h1 { font-size: 8.4vw; line-height: 1.2; font-weight: 400; white-space: nowrap; letter-spacing: 0; }
html[lang='en'] .hero h1 { font-size: 7.6vw; line-height: 1; letter-spacing: -0.03em; }
.hero .mid { display: grid; gap: 22px; justify-items: start; max-width: 46ch; }
.hero .mid p { font-size: var(--step-lead); line-height: 1.55; color: var(--ink); }
.mask { display: block; overflow: hidden; padding-bottom: 0.08em; }
.mask > span { display: block; }
@media (max-width: 760px) {
  .hero { min-height: 560px; }
  .hero h1 { font-size: 9.2vw; }
  html[lang='en'] .hero h1 { font-size: 8.2vw; }
  .hero .mid p { font-size: 1.125rem; max-width: 34ch; }
}

/* ---------- Section rhythm ---------- */
.sec { padding-block: var(--gap-section) 0; }
.sec:last-child { padding-bottom: var(--gap-section); }
.sec-h { font-size: var(--step-lead); font-weight: 400; line-height: 1.3; }
.grid12 { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; }

/* Disciplines: one-size name columns, a fixed description spot */
.disc .sec-h { margin-bottom: 96px; }
.disc .col { grid-column: span 3; }
.disc .col:nth-child(1) { grid-column: 1 / span 3; }
.disc .col:nth-child(2) { grid-column: 4 / span 3; }
.disc .col:nth-child(3) { grid-column: 7 / span 3; }
.disc .spot { grid-column: 10 / span 3; grid-row: 1; color: var(--ink); font-size: var(--step-body); line-height: 1.55; min-height: 9em; }
.disc .spot strong { display: block; font-weight: 500; margin-bottom: 6px; }
.disc .gname { font-size: var(--step-body); font-weight: 500; color: var(--ink); margin-bottom: 1.25em; }
.disc ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.35em; }
.disc li a { color: var(--muted); text-decoration: none; font-size: var(--step-body); line-height: 1.35; transition: color 160ms var(--ease); }
.disc li a:hover, .disc li a:focus-visible, .disc li a.on { color: var(--ink); }
.disc .sum { display: none; }
@media (max-width: 900px) {
  .disc .grid12 { display: block; }
  .disc .col { margin-bottom: 40px; }
  .disc .spot { display: none; }
  .disc li a { line-height: 1.5; }
  .disc .sum { display: block; color: var(--muted); margin-top: 12px; }
  .disc .sec-h { margin-bottom: 48px; }
}

/* Work: big names, fixed preview, with the discipline filter (the live thing) */
.work .sec-h { margin-bottom: 20px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-bottom: 40px; }
.filters button { background: none; border: 0; padding: 6px 0; color: var(--muted); font-size: var(--step-body); transition: color 160ms var(--ease); }
.filters button:hover { color: var(--ink); }
.filters button[aria-pressed='true'] { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 0.45em; }
.names { grid-column: 1 / span 8; list-style: none; margin: 0; padding: 0; }
.names li { display: block; }
.names a { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 20px; padding-block: 10px; text-decoration: none; color: var(--muted); transition: color 200ms var(--ease); }
.names a .n { font-size: var(--step-head); line-height: 1.1; font-weight: 300; letter-spacing: -0.02em; }
html[lang='ar'] .names a .n { letter-spacing: 0; line-height: 1.3; }
.names a .meta { font-size: var(--step-small); color: var(--muted); }
.names a.on, .names a:hover, .names a:focus-visible { color: var(--ink); }
.names li.out { display: none; }
.frame { grid-column: 9 / span 4; position: sticky; top: 15vh; align-self: start; aspect-ratio: 4 / 5; background: var(--surface); overflow: hidden; }
.frame figure { position: absolute; inset: 0; margin: 0; opacity: 0; visibility: hidden; transition: opacity 200ms linear, visibility 0s linear 200ms; }
.frame figure.on { opacity: 1; visibility: visible; transition: opacity 200ms linear; }
.frame img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.88) contrast(1.05); }
.frame .stand { position: absolute; inset: 0; display: grid; align-content: end; padding: 24px; background: var(--surface-2); }
.frame .stand span { font-size: var(--step-head); font-weight: 300; line-height: 1.1; color: var(--ink); }
.frame .stand small { color: var(--muted); font-size: var(--step-body); }
.frame figure.has-img .stand { display: none; }
.frame figure.broken .stand { display: grid; }
.frame figure.broken img { display: none; }
.work .phone-pic { display: none; }
@media (max-width: 900px) {
  .work .grid12 { display: block; }
  .frame { display: none; }
  .names a { color: var(--ink); display: block; padding-block: 0 8px; }
  .names a .n { font-size: 9.5vw; display: block; }
  .names a .meta { display: block; }
  .names li { margin-bottom: 40px; }
  .work .phone-pic { display: block; aspect-ratio: 16 / 10; margin: 0 0 14px; background: var(--surface); position: relative; overflow: hidden; }
  .work .phone-pic img { width: 100%; height: 100%; object-fit: cover; }
  .work .phone-pic .stand { position: absolute; inset: 0; display: grid; align-content: end; padding: 16px; background: var(--surface-2); color: var(--muted); }
  .work .phone-pic.has-img .stand { display: none; }
  .work .phone-pic.broken .stand { display: grid; }
  .work .phone-pic.broken img { display: none; }
}

/* Approvals: names as one statement, one lit at a time */
.proof p { font-size: var(--step-lead); line-height: 1.45; max-width: none; color: var(--muted); }
.proof p .open { color: var(--ink); }
.proof p .nm { transition: color 400ms var(--ease); }
.proof p .nm.lit { color: var(--ink); }
.proof .more { margin-top: 36px; }

/* Fleet: the figure on the photograph's edge */
.fig { position: relative; height: 88svh; min-height: 520px; margin-top: var(--gap-section); overflow: hidden; background: var(--surface); }
.fig .pic { position: absolute; inset: 0; margin: 0; }
.fig .pic img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.82) contrast(1.05); }
.fig::after { content: ''; position: absolute; inset: 65% 0 0 0; background: rgba(20, 21, 20, 0.62); }
.fig .top { position: absolute; z-index: 1; inset-inline-start: var(--m); top: 28px; font-size: var(--step-lead); font-weight: 400; }
.fig .big { position: absolute; z-index: 1; inset-inline-start: var(--m); bottom: 8px; font-size: var(--step-display); line-height: 0.8; font-weight: 300; letter-spacing: -0.04em; }
.fig .say { position: absolute; z-index: 1; inset-inline-end: var(--m); bottom: 32px; max-width: 26ch; text-align: end; font-size: var(--step-body); line-height: 1.45; }
.figs { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; margin-top: 40px; }
.figs div { grid-column: span 6; display: flex; align-items: baseline; gap: 16px; }
.figs strong { font-size: var(--step-head); font-weight: 300; line-height: 1; }
.figs span { color: var(--muted); }
.fig-foot { margin-top: 28px; }
@media (max-width: 760px) {
  .fig { height: 80svh; }
  .fig .big { font-size: 26vw; }
  .fig .say { inset-inline: var(--m) auto; bottom: auto; top: 30%; text-align: start; }
  .figs { display: grid; grid-template-columns: 1fr; row-gap: 18px; }
}

/* Chairman: the portrait as a drop capital */
.lead-q .grid12 { align-items: start; }
.lead-q .facts { grid-column: 1 / span 2; font-size: var(--step-small); color: var(--muted); display: grid; gap: 14px; padding-top: 6px; }
.lead-q .facts b { display: block; color: var(--ink); font-weight: 500; }
.lead-q .body { grid-column: 3 / span 10; }
.lead-q .sec-h { margin-bottom: 28px; }
.lead-q blockquote { margin: 0; font-size: var(--step-lead); line-height: 1.3; font-weight: 300; }
html[lang='ar'] .lead-q blockquote { line-height: 1.55; }
.lead-q .portrait { float: inline-start; width: 3.9em; height: 3.9em; margin-inline-end: 0.5em; margin-block: 0.2em 0; background: var(--surface); overflow: hidden; }
.lead-q .portrait img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05); }
.lead-q .who { margin-top: 28px; color: var(--muted); }
.lead-q .who b { color: var(--ink); font-weight: 500; }
@media (max-width: 900px) {
  .lead-q .grid12 { display: flex; flex-direction: column; }
  .lead-q .facts { order: 2; }
  .lead-q .portrait { width: 4.6em; height: 4.6em; }
  .lead-q .facts { display: flex; flex-wrap: wrap; gap: 14px 28px; margin-top: 32px; }
}

/* Visit card on a photograph */
.visit { position: relative; min-height: 100svh; margin-top: var(--gap-section); background: var(--surface); }
.visit .pic { position: absolute; inset: 0; margin: 0; }
.visit .pic img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.75) contrast(1.05); }
.visit .card { position: sticky; top: calc(var(--bar-h) + 40px); z-index: 1; width: 400px; max-width: calc(100% - 2 * var(--m)); margin-inline-start: auto; margin-inline-end: var(--m); background: var(--field); color: var(--field-ink); padding: 32px; }
.visit-in { position: relative; padding-block: 60px; }
.visit .card h2 { font-size: var(--step-lead); font-weight: 400; line-height: 1.25; margin-bottom: 18px; }
.visit .card p { color: var(--field-ink); }
.visit .card dl { margin: 20px 0; display: grid; gap: 6px; }
.visit .card dl div { display: flex; justify-content: space-between; gap: 16px; }
.visit .card dt { color: var(--field-ink); }
.visit .card dd { margin: 0; text-align: end; }
.visit .card .contacts { display: grid; gap: 4px; margin-bottom: 24px; }
.visit .card .contacts a { color: var(--field-ink); text-decoration-color: var(--field-muted); }
.visit .card .call { display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; margin: 0 -32px -32px; background: var(--field-ink); color: var(--field); text-decoration: none; font-weight: 500; transition: background-color 160ms var(--ease); }
.visit .card .call:hover { background: #2d2e2d; }
@media (max-width: 760px) {
  .visit { min-height: 0; background: var(--bg); }
  .visit .pic { position: relative; height: 70svh; }
  .visit-in { padding: 0; margin-top: -80px; }
  .visit .card { position: relative; top: 0; width: auto; margin-inline: var(--m); }
  .visit .card .call { height: 56px; }
}

/* ---------- Footer: a compact close ---------- */
.foot { background: var(--field); color: var(--field-ink); }
.foot-in { width: var(--wrap); margin-inline: auto; padding-block: 28px 20px; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 12px 32px; }
.foot .name { font-size: var(--step-lead); font-weight: 300; line-height: 1.1; letter-spacing: -0.02em; }
html[lang='ar'] .foot .name { letter-spacing: 0; line-height: 1.3; }
.foot .side { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: end; font-size: var(--step-small); }
.foot a { color: var(--field-ink); text-decoration-color: var(--field-muted); }
.foot small { font-size: var(--step-small); color: var(--field-ink); }
@media (max-width: 760px) { .foot-in { grid-template-columns: 1fr; } .foot .side { justify-content: start; } }

/* ---------- Inner pages ---------- */
.page-head { padding: calc(var(--bar-h) + clamp(64px, 9vw, 140px)) 0 0; }
.page-head h1 { font-size: var(--step-head); line-height: 1.1; letter-spacing: -0.03em; max-width: 18ch; }
html[lang='ar'] .page-head h1 { letter-spacing: 0; line-height: 1.35; }
.page-head p { margin-top: 28px; font-size: var(--step-lead); line-height: 1.5; max-width: 38ch; color: var(--ink); }
.page-head .back { margin-top: 24px; display: inline-flex; }

/* Services index: names with a sticky detail */
.idx .detail { grid-column: 9 / span 4; position: sticky; top: 18vh; align-self: start; }
.idx .detail h2 { font-size: var(--step-lead); font-weight: 400; line-height: 1.35; margin-bottom: 14px; }
.idx .detail p { color: var(--ink); }
.idx .detail ul { list-style: none; margin: 18px 0 22px; padding: 0; color: var(--muted); display: grid; gap: 4px; }
.idx .detail .pane { display: none; }
.idx .detail .pane.on { display: block; }
@media (max-width: 900px) { .idx .detail { display: none; } }

/* Lists set at one size */
.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.4em; }
.plain li { color: var(--ink); }
.cols { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; row-gap: 48px; }
.cols > * { grid-column: span 4; }
.cols h3 { font-size: var(--step-lead); font-weight: 300; line-height: 1.35; margin-bottom: 10px; }
.cols p { color: var(--muted); }
@media (max-width: 900px) { .cols > * { grid-column: span 6; } }
@media (max-width: 560px) { .cols > * { grid-column: 1 / -1; } }

/* Project entries */
.entries { display: grid; gap: clamp(80px, 9vw, 140px); }
.entry { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; align-items: end; }
.entry .pic { grid-column: 1 / span 7; aspect-ratio: 16 / 10; margin: 0; background: var(--surface); position: relative; overflow: hidden; }
.entry:nth-child(even) .pic { grid-column: 6 / span 7; grid-row: 1; }
.entry:nth-child(even) .txt { grid-column: 1 / span 4; grid-row: 1; }
.entry .txt { grid-column: 9 / span 4; }
.entry .pic img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.88) contrast(1.05); }
.entry h2 { font-size: var(--step-head); line-height: 1.2; margin-bottom: 14px; }
.entry .meta { color: var(--muted); margin-bottom: 14px; }
.stand-in { position: absolute; inset: 0; display: grid; align-content: end; padding: 24px; background: var(--surface-2); }
.stand-in span { font-size: var(--step-lead); color: var(--ink); }
.pic.has-img .stand-in { display: none; }
.pic.broken .stand-in { display: grid; }
.pic.broken img { display: none; }
@media (max-width: 900px) {
  .entry { display: block; }
  .entry .pic { margin-bottom: 18px; }
}

/* Project page */
.p-pic { margin: calc(var(--bar-h)) 0 0; height: 72svh; background: var(--surface); position: relative; overflow: hidden; }
.p-pic img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.85) contrast(1.05); }
.facts-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; margin-top: 48px; }
.facts-row dt { color: var(--muted); font-size: var(--step-small); }
.facts-row dd { margin: 4px 0 0; }
@media (max-width: 760px) { .facts-row { grid-template-columns: 1fr 1fr; } }

/* Tabs */
.tablist { display: flex; flex-wrap: wrap; gap: 8px 28px; margin-bottom: 56px; }
.tablist [role='tab'] { background: none; border: 0; padding: 8px 0; color: var(--muted); font-size: var(--step-lead); font-weight: 300; transition: color 160ms var(--ease); }
.tablist [role='tab']:hover { color: var(--ink); }
.tablist [role='tab'][aria-selected='true'] { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 0.45em; }
.tabpanel:focus-visible { outline-offset: 8px; }

/* Years */
.years { list-style: none; margin: 0; padding: 0; display: grid; gap: 40px; }
.years li { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; align-items: baseline; }
.years .y { grid-column: 1 / span 3; font-size: var(--step-head); font-weight: 300; line-height: 1; }
.years .t { grid-column: 4 / span 6; }
.years .t b { display: block; font-weight: 500; margin-bottom: 4px; }
.years .t span { color: var(--muted); }
@media (max-width: 760px) { .years li { display: block; } .years .y { display: block; margin-bottom: 8px; } }

/* People */
.people { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; row-gap: 72px; }
.person { grid-column: span 6; display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 24px; align-items: start; }
.person .face { width: 140px; aspect-ratio: 1; background: var(--surface); overflow: hidden; margin: 0; position: relative; }
.person .face img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05); }
.person h3 { font-size: var(--step-lead); font-weight: 400; }
.person .role { color: var(--accent); margin: 2px 0 12px; }
.person p { color: var(--ink); }
.person .tags { color: var(--muted); margin-top: 12px; font-size: var(--step-small); }
@media (max-width: 900px) { .person { grid-column: 1 / -1; } }
@media (max-width: 480px) { .person { grid-template-columns: 1fr; } }

/* Forms */
.form-wrap { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; }
.form-wrap form { grid-column: 1 / span 7; }
.form-wrap aside { grid-column: 9 / span 4; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 24px; }
.field { display: grid; gap: 8px; }
.field.full { grid-column: 1 / -1; }
.field label, .field .label { font-size: var(--step-body); color: var(--ink); }
.field input, .field select, .field textarea { width: 100%; min-height: 52px; padding: 12px 14px; background: var(--surface); color: var(--ink); border: 1px solid var(--surface-2); border-radius: 0; font-size: var(--step-body); transition: border-color 160ms var(--ease), background-color 160ms var(--ease); }
.field textarea { min-height: 150px; resize: vertical; line-height: 1.6; }
.field ::placeholder { color: #8b8c87; }
.field input:hover, .field select:hover, .field textarea:hover { background: var(--surface-2); }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
.field [aria-invalid='true'], .field [aria-invalid='true']:focus { border-color: var(--danger); }
.err { color: var(--danger); font-size: var(--step-small); display: flex; gap: 6px; align-items: center; }
.err[hidden] { display: none; }
.hint { color: var(--muted); font-size: var(--step-small); }
.form-foot { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
.form-foot small { color: var(--muted); }
.notice { margin-top: 24px; padding: 16px 18px; background: var(--surface-2); display: flex; gap: 10px; }
.notice .icon { color: var(--accent); }
.file-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.file-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 8px 16px; background: var(--surface-2); color: var(--ink); cursor: pointer; }
.file-btn:hover { background: #3a3b3a; }

    return `${pic(projImg(p), p.title, p.location, 'pic p-pic', true)}

        <dl class="facts-row"><div><dt>${esc(P.labels.client)}</dt><dd>${esc(p.client)}</dd></div><div><dt>${esc(P.labels.location)}</dt><dd>${esc(p.location)}</dd></div><div><dt>${esc(U.category)}</dt><dd>${esc(catLabel(p))}</dd></div><div><dt>${esc(P.labels.status)}</dt><dd>${esc(p.status)}</dd></div></dl>
      </header>
      <section class="sec wrap">
        <h2 class="sec-h" style="margin-bottom:28px">${esc(P.labels.scope)}</h2>
        <div class="cols">${(p.scope || []).map((x) => `<div><h3>${esc(x)}</h3></div>`).join('')}</div>
        ${svc ? `<p style="margin-top:40px"><a class="link" href="${href(`services/${svcOf(svc).slug}`)}">${esc(U.discipline)}: ${esc(svc.title)} ${arrow()}</a></p>` : ''}
      </section>
      ${more.length ? `<section class="sec wrap"><h2 class="sec-h" style="margin-bottom:40px">${esc(U.more)}</h2><div class="entries">${more.map(entry).join('')}</div></section>` : ''}
      <div class="wrap"><p style="margin-top:56px"><a class="link" href="${href('projects')}">${esc(U.allProj)} ${arrow()}</a></p></div>`;
  }

  function fleet() {
    const E = t().equipment;
    return `${pageHead(E.title, E.lead)}
      <section class="sec wrap"><div class="grid12"><p class="rise" style="grid-column:1 / span 7;font-size:var(--step-lead);line-height:1.55">${esc(E.p1)}</p><p class="rise" style="grid-column:9 / span 4;color:var(--ink)">${esc(E.p2)}</p></div></section>
      <section class="sec wrap"><h2 class="sec-h rise" style="margin-bottom:40px">${esc(E.categoriesHeading)}</h2><div class="cols rise">${E.categories.map((c) => `<div><h3>${esc(c)}</h3></div>`).join('')}</div></section>
      <section class="sec wrap"><h2 class="sec-h rise" style="margin-bottom:40px">${esc(E.supportHeading)}</h2><div class="cols rise">${E.features.map((f) => `<div><h3>${esc(f.title)}</h3><p>${esc(f.desc)}</p></div>`).join('')}</div></section>`;
  }

  function approvals() {
    const Cc = t().certifications;
    return `${pageHead(Cc.title, Cc.lead)}
      <section class="sec wrap"><h2 class="sec-h rise" style="margin-bottom:40px">${esc(Cc.isoHeading)}</h2><div class="cols rise">${Cc.iso.map((i) => `<div><h3 class="num" style="font-size:var(--step-lead);font-weight:300">${esc(i.title)}</h3><p>${esc(i.desc)}</p></div>`).join('')}</div></section>
      <section class="sec wrap"><h2 class="sec-h rise" style="margin-bottom:40px">${esc(Cc.approvalsHeading)}</h2><div class="cols rise">${Cc.approvals.map((a) => `<div><h3>${esc(a)}</h3></div>`).join('')}</div></section>
      <section class="sec wrap"><h2 class="sec-h rise" style="margin-bottom:24px">${esc(Cc.commitmentTitle)}</h2><p class="rise" style="font-size:var(--step-lead);line-height:1.55;max-width:46ch">${esc(Cc.commitmentBody)}</p></section>`;
  }

  function field(id, label, control, err, full = false) {
    return `<div class="field${full ? ' full' : ''}"><label for="${id}">${esc(label)}</label>${control}<span class="err" id="${id}-err" hidden>${icon('circle-alert')}<span>${esc(err || '')}</span></span></div>`;
  }

  function contactPage() {
    const T = t(), C = T.contact, U = ui(), pf = state.prefill || {};
    return `${pageHead(C.title, C.lead)}
      <section class="sec wrap form-wrap">
        <form id="quote-form" novalidate>
          <h2 class="visually-hidden">${esc(U.quote)}</h2>
          <div class="fields">
            ${field('f-name', C.fields.name, `<input id="f-name" name="name" autocomplete="name" placeholder="${esc(C.placeholders.name)}" aria-describedby="f-name-err">`, C.errors.name)}
            ${field('f-email', C.fields.email, `<input id="f-email" name="email" type="email" autocomplete="email" dir="ltr" placeholder="${esc(C.placeholders.email)}" aria-describedby="f-email-err">`, C.errors.email)}
            ${field('f-company', C.fields.company, `<input id="f-company" name="company" autocomplete="organization" placeholder="${esc(C.placeholders.company)}" aria-describedby="f-company-err">`, C.errors.company)}
            ${field('f-type', C.fields.type, `<select id="f-type" name="type"><option value="">${esc(C.placeholders.type)}</option>${C.typeOptions.map((o) => `<option value="${o.key}"${pf.type === o.key ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`, '')}
            ${field('f-message', C.fields.message, `<textarea id="f-message" name="message" placeholder="${esc(C.placeholders.message)}" aria-describedby="f-message-err">${esc(pf.message || '')}</textarea>`, C.errors.message, true)}
          </div>
          <div class="form-foot"><button class="action" type="submit"><span>${esc(C.submit)}</span></button><small>${esc(U.proto)}</small></div>
          <div id="quote-status" aria-live="polite"></div>
        </form>
        <aside aria-label="${esc(C.officeHeading)}"><dl class="aside-list">
          <div><dt>${esc(C.officeHeading)}</dt><dd>${esc(C.address)}</dd></div>
          <div><dt>${esc(C.hoursHeading)}</dt><dd>${C.hours.map(esc).join('<br>')}</dd></div>
          <div><dt>${esc(U.mobile)}</dt><dd><a class="link" href="tel:${C0.mobile.replace(/\s/g, '')}"><span class="ltr num">${esc(C0.mobile)}</span></a></dd></div>
          <div><dt>${esc(U.email)}</dt><dd><a class="link" href="mailto:${C0.email}">${esc(C0.email)}</a></dd></div>
        </dl></aside>
      </section>`;
  }

  function careers() {
    const K = t().careers, U = ui();
    return `${pageHead(K.title, K.lead)}
      <section class="sec wrap"><h2 class="sec-h rise" style="margin-bottom:40px">${esc(K.whyTitle)}</h2><div class="cols rise">${K.why.map((w) => `<div><h3>${esc(w.title)}</h3><p>${esc(w.desc)}</p></div>`).join('')}</div></section>
      <section class="sec wrap"><h2 class="sec-h rise" style="margin-bottom:12px">${esc(K.rolesTitle)}</h2><p class="rise" style="color:var(--muted);margin-bottom:40px">${esc(K.rolesLead)}</p>
        <ul class="roles-list">${K.roles.map((r) => `<li class="rise"><span class="t">${esc(r.title)}</span><span class="m">${esc(r.dept)} · ${esc(r.location)} · ${esc(r.type)} · ${esc(r.exp)}</span><button type="button" data-role="${r.slug}">${esc(U.apply)}</button></li>`).join('')}</ul></section>
      <section class="sec wrap form-wrap" id="apply">
        <form id="apply-form" novalidate>
          <h2 class="sec-h" style="margin-bottom:12px">${esc(K.applyTitle)}</h2><p style="color:var(--muted);margin-bottom:28px">${esc(K.applyLead)}</p>
          <div class="fields">
            ${field('a-name', K.fields.name, `<input id="a-name" name="name" autocomplete="name" placeholder="${esc(K.placeholders.name)}" aria-describedby="a-name-err">`, K.errors.name)}
            ${field('a-email', K.fields.email, `<input id="a-email" name="email" type="email" autocomplete="email" dir="ltr" placeholder="${esc(K.placeholders.email)}" aria-describedby="a-email-err">`, K.errors.email)}
            ${field('a-phone', K.fields.phone, `<input id="a-phone" name="phone" type="tel" autocomplete="tel" dir="ltr" placeholder="${esc(K.placeholders.phone)}" aria-describedby="a-phone-err">`, K.errors.phone)}
            ${field('a-exp', K.fields.exp, `<input id="a-exp" name="exp" type="number" min="0" max="60" inputmode="numeric" placeholder="${esc(K.placeholders.exp)}" aria-describedby="a-exp-err">`, K.errors.exp)}
            ${field('a-role', K.fields.role, `<select id="a-role" name="role" aria-describedby="a-role-err"><option value="">${esc(K.placeholders.role)}</option>${K.roles.map((r) => `<option value="${r.slug}"${state.role === r.slug ? ' selected' : ''}>${esc(r.title)}</option>`).join('')}<option value="other">${esc(K.otherRole)}</option></select>`, K.errors.role, true)}
            <div class="field full"><span class="label" id="a-cv-l">${esc(K.fields.cv)}</span>
              <label class="visually-hidden" for="a-cv">${esc(K.cvLink)}</label>
              <input id="a-cv" name="cv" type="url" dir="ltr" placeholder="${esc(K.placeholders.cv)}" aria-describedby="a-cv-l a-cv-hint a-cv-err">
              <div class="file-row"><label class="file-btn" for="a-file">${icon('upload')}${esc(K.cvUploadBtn)}</label><input id="a-file" type="file" accept=".pdf,.doc,.docx" class="visually-hidden"><span id="a-file-name" class="hint">${esc(K.cvNone)}</span></div>
              <span class="hint" id="a-cv-hint">${esc(K.cvHint)}</span>
              <span class="err" id="a-cv-err" hidden>${icon('circle-alert')}<span>${esc(K.errors.cv)}</span></span></div>
            ${field('a-note', K.fields.note, `<textarea id="a-note" name="note" placeholder="${esc(K.placeholders.note)}"></textarea>`, '', true)}
          </div>
          <div class="form-foot"><button class="action" type="submit"><span>${esc(K.submit)}</span></button><small>${esc(U.proto)}</small></div>
          <div id="apply-status" aria-live="polite"></div>
        </form>
      </section>`;
  }

  function tabs(id, label, items) {
    const cur = items.some((i) => i.key === state.tabs[id]) ? state.tabs[id] : items[0].key;
    return `<div class="tabs"><div class="tablist" role="tablist" aria-label="${esc(label)}">${items.map((it) => `<button type="button" role="tab" id="tab-${id}-${it.key}" aria-controls="panel-${id}-${it.key}" aria-selected="${cur === it.key}" tabindex="${cur === it.key ? 0 : -1}" data-tab="${id}" data-key="${it.key}">${esc(it.label)}</button>`).join('')}</div>
      ${items.map((it) => `<div class="tabpanel" role="tabpanel" id="panel-${id}-${it.key}" aria-labelledby="tab-${id}-${it.key}" tabindex="0"${cur === it.key ? '' : ' hidden'}>${it.html}</div>`).join('')}</div>`;
  }
  function selectTab(btn, focus) {
    const id = btn.dataset.tab, key = btn.dataset.key; state.tabs[id] = key;
    const box = btn.closest('.tabs');
    $$('[role=tab]', box).forEach((b) => { const on = b === btn; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; });
    $$('[role=tabpanel]', box).forEach((p) => { p.hidden = p.id !== `panel-${id}-${key}`; });
    if (focus) btn.focus();
  }

  const PAGE_FN = { '': home, company, services, projects, fleet, approvals, contact: contactPage, careers };
  function title() {
    const T = t(), U = ui();
    if (state.page === 'services' && state.sub) return `${T.services.items[svcIdx(state.sub)].title} | ${T.brandLine}`;
    if (state.page === 'projects' && state.sub) return `${projBy(state.sub).title} | ${T.brandLine}`;
    if (!state.page) return `${T.brandLine} | ${T.hero.title}`;
    const map = { company: T.intro.title, contact: T.contact.title, careers: T.careers.title };
    return `${map[state.page] || U.nav[state.page]} | ${T.brandLine}`;
  }

  // ---------- behaviour ----------
  let io, cycle;
  function observe() {
    document.documentElement.classList.add('js');
    io?.disconnect();
    io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
    $$('.rise').forEach((el) => io.observe(el));
  }
  function startCycle() {
    clearInterval(cycle);
    const names = $$('.proof .nm'); if (!names.length) return;
    let i = 0;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    cycle = setInterval(() => { names[i].classList.remove('lit'); i = (i + 1) % names.length; names[i].classList.add('lit'); }, 2000);
  }
  function setActive(listSel, frameSel, i) {
    $$(`${listSel} a`).forEach((a) => a.classList.toggle('on', a.dataset.i === String(i)));
    if (frameSel) $$(`${frameSel} > *`).forEach((f) => f.classList.toggle('on', f.dataset.i === String(i)));
  }
  function barMode() {
    const b = $('#bar');
    const onHero = !state.page && scrollY < innerHeight - 120;
    b.classList.toggle('inner', !!state.page);
    b.classList.toggle('solid', !state.page && !onHero);
  }

  // The name runs from margin to margin on one line: its size is fitted to the width.
  function fitName() {
    const h = $('.hero h1'); if (!h) return;
    const box = h.parentElement, span = $('.mask > span', h);
    // A long Latin name on a phone sets on two lines at a fixed size instead of shrinking to a caption.
    const twoLines = !rtl() && innerWidth < 760;
    h.classList.toggle('two', twoLines);
    if (twoLines) { h.style.fontSize = ''; return; }
    const avail = box.clientWidth - parseFloat(getComputedStyle(box).paddingInlineStart) - parseFloat(getComputedStyle(box).paddingInlineEnd);
    h.style.fontSize = '100px';
    const w = span.getBoundingClientRect().width;
    if (w > 0) h.style.fontSize = `${Math.floor((100 * avail / w) * 0.995 * 10) / 10}px`;
  }

  let lastKey = '';
  function render(force = false) {
    const { lang, page, sub } = parseHash();
    const changed = lang !== state.lang || page !== state.page || sub !== state.sub;
    Object.assign(state, { lang, page, sub });
    const key = `${lang}/${page}/${sub}`;
    if (!force && key === lastKey) return;
    lastKey = key;
    if (page !== 'contact') state.prefill = null;
    const D = document.documentElement;
    D.lang = lang; D.dir = lang === 'ar' ? 'rtl' : 'ltr';
    D.classList.remove('loaded');
    document.title = title();
    $('.skip').textContent = ui().skip;
    $('#bar').innerHTML = bar();
    $('#main').innerHTML = (page === 'services' && sub) ? service() : (page === 'projects' && sub) ? project() : PAGE_FN[page]();
    $('#foot').innerHTML = foot();
    if (changed || force) scrollTo({ top: 0, behavior: 'auto' });
    observe(); startCycle(); barMode(); fitName();
    requestAnimationFrame(() => requestAnimationFrame(() => D.classList.add('loaded')));
  }

  const validEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
  function setErr(id, bad, msg) {
    const el = document.getElementById(id), err = document.getElementById(`${id}-err`);
    if (err && msg) err.lastChild.textContent = msg;
    el?.setAttribute('aria-invalid', String(bad));
    if (err) err.hidden = !bad;
    return bad;
  }
  function submitLike(form, statusId, okText, busyText) {
    const btn = $('button[type=submit]', form), label = $('span', btn), before = label.textContent;
    btn.setAttribute('aria-busy', 'true'); btn.disabled = true; label.textContent = busyText;
    setTimeout(() => {
      btn.removeAttribute('aria-busy'); btn.disabled = false; label.textContent = before;
      document.getElementById(statusId).innerHTML = `<div class="notice" role="status">${icon('check')}<div><strong>${esc(okText)}</strong><br><span>${esc(ui().protoSent)}</span></div></div>`;
      form.reset();
    }, 900);
  }

  document.addEventListener('click', (e) => {
    const el = e.target.closest('a, button'); if (!el) return;
    const T = t();
    if (el.matches('.menu-btn')) {
      const d = $('#drawer'), open = !d.classList.contains('open');
      d.classList.toggle('open', open); el.setAttribute('aria-expanded', String(open));
      el.innerHTML = icon(open ? 'x' : 'menu'); el.setAttribute('aria-label', open ? ui().close : ui().menu);
      $('#bar').classList.toggle('solid', open || $('#bar').classList.contains('solid'));
      if (open) $('a', d)?.focus();
      return;
    }
    if (el.closest('.drawer')) $('#drawer').classList.remove('open');
    if (el.matches('[role=tab]')) { selectTab(el); return; }
    if (el.dataset.filter) {
      state.filter = el.dataset.filter;
      if (state.page === 'projects') { const y = scrollY; $('#main').innerHTML = projects(); scrollTo(0, y); observe(); $(`[data-filter="${state.filter}"]`)?.focus(); return; }
      $$('.work .filters button').forEach((b) => b.setAttribute('aria-pressed', String(b === el)));
      const lis = $$('#names li');
      lis.forEach((li) => li.classList.toggle('out', state.filter !== 'all' && li.dataset.key !== state.filter));
      const first = lis.find((li) => !li.classList.contains('out'));
      if (first) setActive('#names', '.frame', $('a', first).dataset.i);
      return;
    }
    if (el.dataset.role) { state.role = el.dataset.role; const s = $('#a-role'); if (s) s.value = state.role; $('#apply').scrollIntoView({ behavior: 'smooth' }); setTimeout(() => $('#a-name')?.focus({ preventScroll: true }), 450); return; }
    if (el.getAttribute('href') === '#work') { e.preventDefault(); $('#work')?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); return; }
    if (el.hasAttribute('data-quote')) {
      state.prefill = null;
      if (state.page === 'services' && state.sub) { const s = T.services.items[svcIdx(state.sub)]; state.prefill = { type: svcOf(s).type, message: `${T.services.inquireCta} ${s.title}: ` }; }
      else if (state.page === 'projects' && state.sub) { const p = projBy(state.sub); state.prefill = { type: CAT_TYPE[p.key] || 'other', message: `${T.projects.detailsCta}: ${p.title}: ` }; }
      else if (state.page === 'fleet') state.prefill = { type: 'equipment-rental', message: `${T.equipment.cta}: ` };
      else if (state.page === 'approvals') state.prefill = { type: '', message: `${T.certifications.cta}: ` };
    }
  });

  // pointing at a name lights it (work index, services index, disciplines)
  const lightFrom = (e) => {
    const a = e.target.closest?.('#names a, #svc-names a, .disc li a'); if (!a) return;
    if (a.closest('#names')) setActive('#names', '.frame', a.dataset.i);
    else if (a.closest('#svc-names')) setActive('#svc-names', '.idx .detail', a.dataset.i);
    else {
      $$('.disc li a').forEach((x) => x.classList.toggle('on', x === a));
      const spot = $('#spot'); if (spot) spot.innerHTML = `<strong>${esc(a.dataset.title)}</strong>${esc(a.dataset.desc)}`;
    }
  };
  document.addEventListener('pointerover', lightFrom);
  document.addEventListener('focusin', lightFrom);

  document.addEventListener('keydown', (e) => {
    const tab = e.target.closest?.('[role=tab]');
    if (tab && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
      const list = $$('[role=tab]', tab.parentElement), i = list.indexOf(tab), fwd = rtl() ? 'ArrowLeft' : 'ArrowRight';
      const j = e.key === 'Home' ? 0 : e.key === 'End' ? list.length - 1 : (i + (e.key === fwd ? 1 : -1) + list.length) % list.length;
      e.preventDefault(); selectTab(list[j], true); return;
    }
    if (e.key === 'Escape' && $('#drawer')?.classList.contains('open')) { $('.menu-btn').click(); $('.menu-btn').focus(); }
  });
  document.addEventListener('change', (e) => { if (e.target.id === 'a-file') { const f = e.target.files[0]; $('#a-file-name').textContent = f ? f.name : t().careers.cvNone; if (f) setErr('a-cv', false); } });
  document.addEventListener('submit', (e) => {
    e.preventDefault();
    const form = e.target, v = (n) => (form.elements[n]?.value || '').trim();
    if (form.id === 'quote-form') {
      const C = t().contact;
      const bad = [setErr('f-name', !v('name')), setErr('f-email', !validEmail(v('email')), v('email') ? C.errors.email : ui().emailRequired), setErr('f-company', !v('company')), setErr('f-message', v('message').length < 10)];
      const first = ['f-name', 'f-email', 'f-company', 'f-message'][bad.indexOf(true)];
      if (first) { document.getElementById(first).focus(); return; }
      submitLike(form, 'quote-status', C.success, C.submitting);
    }
    if (form.id === 'apply-form') {
      const K = t().careers, hasFile = !!$('#a-file').files.length;
      const bad = [setErr('a-name', !v('name')), setErr('a-email', !validEmail(v('email')), v('email') ? K.errors.email : ui().emailRequired), setErr('a-phone', !v('phone')), setErr('a-exp', v('exp') === ''), setErr('a-role', !v('role')), setErr('a-cv', !v('cv') && !hasFile)];
      const first = ['a-name', 'a-email', 'a-phone', 'a-exp', 'a-role', 'a-cv'][bad.indexOf(true)];
      if (first) { document.getElementById(first).focus(); return; }
      submitLike(form, 'apply-status', K.success, K.submitting);
    }
  });
  document.addEventListener('input', (e) => {
    const el = e.target; if (el.getAttribute('aria-invalid') !== 'true') return;
    const ok = el.type === 'email' ? validEmail(el.value.trim()) : el.id === 'f-message' ? el.value.trim().length >= 10 : !!el.value.trim();
    if (ok) setErr(el.id, false);
  });

  addEventListener('scroll', barMode, { passive: true });
  addEventListener('resize', fitName);
  // Refit once the display faces have really loaded (fonts.ready can settle before a lazily used face arrives).
  if (document.fonts) {
    document.fonts.ready.then(fitName);
    document.fonts.addEventListener?.('loadingdone', fitName);
    Promise.all([document.fonts.load('800 100px "Unbounded"', 'SANA'), document.fonts.load('800 100px "Noto Kufi Arabic"', 'سنا')]).then(fitName).catch(() => {});
  }
  addEventListener('hashchange', () => render());
  render(true);
})();

  </script>
</body>
</html>
