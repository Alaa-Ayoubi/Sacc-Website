/* SACC proposal 4 — modern institutional.
 *
 * White and cool mist grounds on an orderly 12-column grid; deep logo teal
 * for the masthead, footer and key bands; the logo's orange spent only on
 * the single quote action. The field is shown by the company's own
 * photographs and by one consistent system of 2px technical line drawings.
 */
:root {
  --teal-950: #0b2c2d;
  --teal-900: #0d3536;
  --teal-800: #134748;
  --teal-700: #1b5b5b;
  --teal-600: #24706f;
  --teal-300: #8cbcb8;
  --teal-100: #e1edec;
  --orange: #e38c2f;
  --orange-hover: #ef9c43;
  --ink: #142021;
  --ink-2: #405150;
  --ink-3: #586968;
  --on-teal: #f2f7f7;
  --on-teal-2: #b8cfcd;
  --white: #ffffff;
  --mist: #f0f3f3;
  --rule: #d9e0df;
  --rule-strong: #b3c0bf;
  --danger: #b0261c;
  --ok: #1d6b45;
  --live: #a0510f;

  --font: 'Almarai', system-ui, sans-serif;
  --gutter: clamp(20px, 4vw, 48px);
  --wrap: min(1240px, 100% - 2 * var(--gutter));
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --head-h: 76px;

  color-scheme: light;
  scrollbar-color: var(--rule-strong) var(--mist);
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--head-h) + 16px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--white);
  color: var(--ink);
  font-family: var(--font);
  font-size: 1.0625rem;
  font-weight: 400;
  line-height: 1.75;
  caret-color: var(--teal-600);
  -webkit-font-smoothing: antialiased;
}
html[lang='en'] body { line-height: 1.65; }
::selection { background: var(--teal-100); color: var(--ink); }
img { display: block; max-width: 100%; }
a { color: inherit; text-underline-offset: 0.3em; text-decoration-thickness: 1px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { margin: 0; font-weight: 800; line-height: 1.3; text-wrap: balance; }
html[lang='en'] h1, html[lang='en'] h2, html[lang='en'] h3 { letter-spacing: -0.015em; line-height: 1.18; }
p { margin: 0; text-wrap: pretty; }
:focus-visible { outline: 3px solid var(--teal-600); outline-offset: 3px; }
.on-dark :focus-visible, .masthead :focus-visible, .footer :focus-visible, .hero :focus-visible { outline-color: var(--orange); }

.wrap { width: var(--wrap); margin-inline: auto; }
.num { font-variant-numeric: tabular-nums lining-nums; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.visually-hidden { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; border: 0 !important; min-height: 0 !important; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; inset-inline-start: 12px; top: -60px; z-index: 100; background: var(--orange); color: var(--ink); padding: 10px 16px; font-weight: 700; text-decoration: none; }
.skip:focus { top: 12px; }

.icon { width: 1.1em; height: 1.1em; display: inline-block; flex: none; vertical-align: -0.18em; }
.icon svg { width: 100%; height: 100%; display: block; stroke-width: 1.75; }
html[dir='rtl'] .flip svg { transform: scaleX(-1); }

/* ---------- Actions ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.55em;
  min-height: 48px; padding: 10px 22px;
  border: 0; border-radius: 2px;
  font-weight: 700; font-size: 1rem; line-height: 1.35; text-decoration: none; text-align: center;
  transition: background-color 160ms var(--ease), color 160ms var(--ease), box-shadow 160ms var(--ease);
}
.btn-quote { background: var(--orange); color: var(--ink); }
.btn-quote:hover { background: var(--orange-hover); }
.btn-outline-light { color: var(--on-teal); box-shadow: inset 0 0 0 1.5px rgba(242, 247, 247, 0.7); background: transparent; }
.btn-outline-light:hover { background: rgba(242, 247, 247, 0.1); box-shadow: inset 0 0 0 1.5px var(--on-teal); }
.btn-outline { color: var(--teal-800); box-shadow: inset 0 0 0 1.5px var(--teal-700); background: transparent; }
.btn-outline:hover { background: var(--teal-100); }
.btn-teal { background: var(--teal-800); color: var(--on-teal); }
.btn-teal:hover { background: var(--teal-700); }
.btn[aria-busy='true'] { opacity: 0.65; cursor: progress; }
.more {
  display: inline-flex; align-items: center; gap: 0.45em;
  color: var(--teal-700); font-weight: 700; font-size: 0.97rem;
  text-decoration: none; border-bottom: 1.5px solid currentColor; padding-bottom: 1px;
}
.more:hover { color: var(--teal-900); }
.on-dark .more { color: var(--on-teal); }

/* ---------- Prototype note + top bar ---------- */
.proto-note { background: var(--mist); color: var(--ink-3); text-align: center; font-size: 0.8rem; padding: 6px var(--gutter); border-bottom: 1px solid var(--rule); }
.topbar { background: var(--teal-950); color: var(--on-teal-2); font-size: 0.82rem; }
.topbar-in { width: var(--wrap); margin-inline: auto; min-height: 38px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 20px; }
.topbar ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 22px; }
.topbar li { display: inline-flex; align-items: center; gap: 7px; }
.topbar .icon { color: var(--teal-300); width: 1em; height: 1em; }
.topbar a { color: var(--on-teal-2); text-decoration: none; }
.topbar a:hover { color: var(--on-teal); }
@media (max-width: 860px) { .topbar .creds li + li { display: none; } }
@media (max-width: 560px) { .topbar .reach li + li { display: none; } }

/* ---------- Masthead ---------- */
.masthead { position: sticky; top: 0; z-index: 40; background: var(--teal-900); color: var(--on-teal); box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06), 0 8px 24px -18px rgba(0, 0, 0, 0.6); }
.masthead-in { width: var(--wrap); margin-inline: auto; height: var(--head-h); display: flex; align-items: center; gap: 26px; }
.brand img { height: 36px; width: auto; }
.nav { display: flex; gap: 2px; margin-inline-start: auto; }
.nav a { position: relative; padding: 10px 11px; color: var(--on-teal-2); text-decoration: none; font-size: 0.95rem; white-space: nowrap; transition: color 140ms var(--ease); }
.nav a:hover, .nav a[aria-current='page'] { color: var(--on-teal); }
.nav a[aria-current='page']::after { content: ''; position: absolute; inset-inline: 11px; bottom: 2px; height: 2px; background: var(--orange); }
.tools { display: flex; align-items: center; gap: 10px; flex: none; }
.lang { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; color: var(--on-teal); text-decoration: none; font-size: 0.9rem; box-shadow: inset 0 0 0 1px rgba(242, 247, 247, 0.28); border-radius: 2px; }
.lang .short { display: none; font-weight: 700; }
.lang:hover { box-shadow: inset 0 0 0 1px var(--on-teal-2); }
.tools .btn { min-height: 42px; padding: 8px 18px; font-size: 0.95rem; }
.menu-btn { display: none; width: 44px; height: 44px; align-items: center; justify-content: center; border: 0; border-radius: 2px; background: transparent; color: var(--on-teal); box-shadow: inset 0 0 0 1px rgba(242, 247, 247, 0.28); }
.drawer { display: none; position: fixed; inset-inline: 0; bottom: 0; top: var(--head-h); background: var(--teal-900); padding: 12px var(--gutter) 40px; overflow-y: auto; z-index: 39; }
.drawer.open { display: block; }
.drawer a { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; color: var(--on-teal); text-decoration: none; font-size: 1.15rem; font-weight: 700; border-bottom: 1px solid rgba(242, 247, 247, 0.12); }
.drawer a[aria-current='page'] { color: var(--orange); }
@media (max-width: 1180px) {
  .nav { display: none; }
  .menu-btn { display: inline-flex; }
  .tools { margin-inline-start: auto; }
}
@media (max-width: 520px) {
  .tools .btn { padding: 8px 12px; font-size: 0.88rem; }
  .lang .long { display: none; }
  .lang .short { display: inline; }
}

/* ---------- Hero (home) ---------- */
.hero { position: relative; color: var(--on-teal); background: var(--teal-900); overflow: hidden; }
.hero .photo { position: absolute; inset: 0; margin: 0; }
.hero .photo img { width: 100%; height: 100%; object-fit: cover; }
.hero::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(to left, rgba(11, 44, 45, 0.94) 0%, rgba(11, 44, 45, 0.82) 38%, rgba(11, 44, 45, 0.25) 78%, rgba(11, 44, 45, 0.1) 100%);
}
html[dir='ltr'] .hero::after { background: linear-gradient(to right, rgba(11, 44, 45, 0.94) 0%, rgba(11, 44, 45, 0.82) 38%, rgba(11, 44, 45, 0.25) 78%, rgba(11, 44, 45, 0.1) 100%); }
.hero-in { position: relative; z-index: 1; width: var(--wrap); margin-inline: auto; min-height: clamp(440px, 62vh, 620px); display: flex; flex-direction: column; justify-content: center; padding-block: 64px 0; }
.hero h1 { font-size: clamp(2.3rem, 4.6vw, 3.9rem); max-width: 15ch; line-height: 1.25; }
html[lang='en'] .hero h1 { line-height: 1.08; }
.hero p { margin-top: 18px; font-size: clamp(1.05rem, 1.4vw, 1.22rem); color: var(--on-teal-2); max-width: 46ch; line-height: 1.8; }
.hero .btn { margin-top: 30px; align-self: flex-start; }
/* when the photograph is unavailable, the drawing of the road section stands in */
.hero .photo .fallback { position: absolute; inset-block: 0; inset-inline-end: 0; width: 58%; color: var(--teal-300); opacity: 0.45; display: none; }
.hero .photo.nophoto img { display: none; }
.hero .photo.nophoto .fallback { display: block; }
@media (max-width: 760px) {
  .hero::after { background: rgba(11, 44, 45, 0.86); }
  .hero .photo .fallback { width: 100%; opacity: 0.18; }
}

/* ---------- Section rhythm ---------- */
.band { padding-block: clamp(64px, 8vw, 112px); }
.band.mist { background: var(--mist); }
.band.teal { background: var(--teal-900); color: var(--on-teal); }
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 40px; margin-bottom: clamp(28px, 4vw, 44px); }
.head h2 { font-size: clamp(1.75rem, 3vw, 2.5rem); }
.head p { margin-top: 10px; color: var(--ink-2); max-width: 60ch; font-size: 1.08rem; }
.teal .head p { color: var(--on-teal-2); }

/* ---------- Disciplines ---------- */
.disc-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--rule-strong); }
.disc-list li { border-bottom: 1px solid var(--rule); }
.disc-list a { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 4px; text-decoration: none; font-weight: 700; font-size: 1.05rem; transition: color 140ms var(--ease), background-color 140ms var(--ease); }
.disc-list li:nth-child(3n + 1) a, .disc-list li:nth-child(3n + 2) a { border-inline-end: 1px solid var(--rule); }
.disc-list a { padding-inline: 18px; }
.disc-list a:hover { background: var(--mist); color: var(--teal-800); }
.disc-list .icon { color: var(--teal-600); }
@media (max-width: 900px) {
  .disc-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .disc-list li a { border-inline-end: 0 !important; }
  .disc-list li:nth-child(odd) a { border-inline-end: 1px solid var(--rule) !important; }
}
@media (max-width: 560px) {
  .disc-list { grid-template-columns: 1fr; }
  .disc-list li a { border-inline-end: 0 !important; }
}

/* Services page: drawings grid */
.disc-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--rule-strong); border-inline-start: 1px solid var(--rule); }
.disc-grid li { border-inline-end: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.disc-grid a { display: grid; gap: 14px; padding: 28px; text-decoration: none; height: 100%; transition: background-color 160ms var(--ease); }
.disc-grid a:hover { background: var(--mist); }
.disc-grid .drawing { color: var(--teal-700); }
.disc-grid h2 { font-size: 1.2rem; line-height: 1.45; }
.disc-grid .meta { color: var(--ink-3); font-size: 0.9rem; }
.disc-grid .go { color: var(--teal-700); font-weight: 700; font-size: 0.93rem; display: inline-flex; gap: 6px; align-items: center; }
@media (max-width: 900px) { .disc-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .disc-grid { grid-template-columns: 1fr; } }

/* ---------- Drawings (one system: 2px strokes, technical sections) ---------- */
.drawing { display: block; width: 100%; height: auto; }
/* Draw-on entrance: dash = path length (pathLength=1) slides in once, then the
   dash pattern is removed so no browser can leave a gap in a finished drawing. */
.anim .drawing:not(.drawn) .ln { stroke-dasharray: 1 1; stroke-dashoffset: 1; }
.anim .drawing.drawn:not(.done) .ln { stroke-dasharray: 1 1; stroke-dashoffset: 0; transition: stroke-dashoffset 1100ms var(--ease); }
.drawing.done .ln { stroke-dasharray: none; }

/* ---------- Projects ---------- */
.proj-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; }
.proj-grid.featured { grid-template-columns: 1.5fr 1fr; grid-template-rows: auto auto; }
.proj-grid.featured li:first-child { grid-row: span 2; }
.proj a { display: grid; gap: 14px; text-decoration: none; }
.proj .photo { position: relative; margin: 0; aspect-ratio: 4 / 3; background: var(--teal-100); overflow: hidden; }
.proj-grid.featured li:first-child .photo { aspect-ratio: auto; height: 100%; min-height: 360px; }
.proj-grid.featured li:first-child a { grid-template-rows: 1fr auto; height: 100%; }
.proj .photo img { width: 100%; height: 100%; object-fit: cover; transition: transform 600ms var(--ease); }
.proj a:hover .photo img { transform: scale(1.03); }
.proj .photo .fallback { position: absolute; inset: 14% 12%; color: var(--teal-600); display: none; }
.proj .photo.nophoto img { display: none; }
.proj .photo.nophoto .fallback { display: block; }
.proj h3 { font-size: 1.15rem; line-height: 1.45; }
.proj a:hover h3 { color: var(--teal-700); }
.proj .meta { color: var(--ink-3); font-size: 0.9rem; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 0.86rem; font-weight: 700; }
.status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.status.done { color: var(--ok); }
.status.live { color: var(--live); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; }
.filters button { min-height: 42px; padding: 0 16px; border: 0; border-radius: 2px; background: transparent; box-shadow: inset 0 0 0 1px var(--rule-strong); color: var(--ink-2); font-size: 0.93rem; }
.filters button:hover { color: var(--ink); box-shadow: inset 0 0 0 1px var(--teal-700); }
.filters button[aria-pressed='true'] { background: var(--teal-800); color: var(--on-teal); box-shadow: none; }
.filters .count { opacity: 0.75; margin-inline-start: 6px; }
.empty { color: var(--ink-2); padding: 24px 0; }
@media (max-width: 960px) {
  .proj-grid, .proj-grid.featured { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .proj-grid.featured li:first-child { grid-row: auto; grid-column: 1 / -1; }
  .proj-grid.featured li:first-child .photo { min-height: 0; aspect-ratio: 16 / 9; height: auto; }
}
@media (max-width: 600px) { .proj-grid, .proj-grid.featured { grid-template-columns: 1fr; } }

/* ---------- Approvals strip (home) ---------- */
.approvals { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: clamp(24px, 4vw, 64px); align-items: start; }
.iso-row { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-top: 1px solid rgba(242, 247, 247, 0.25); }
.iso-row li { padding: 14px 0; border-bottom: 1px solid rgba(242, 247, 247, 0.16); }
.iso-row strong { display: block; font-size: 1.25rem; }
.iso-row span { color: var(--on-teal-2); font-size: 0.92rem; }
.bodies { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; border-top: 1px solid rgba(242, 247, 247, 0.25); }
.bodies li { padding: 14px 0; border-bottom: 1px solid rgba(242, 247, 247, 0.16); display: flex; gap: 10px; align-items: baseline; }
.bodies .icon { color: var(--orange); }
.approvals h3 { font-size: 1rem; color: var(--on-teal-2); font-weight: 700; margin-bottom: 10px; }
.approvals-foot { margin-top: 32px; }
@media (max-width: 860px) { .approvals { grid-template-columns: 1fr; } }
@media (max-width: 520px) { .bodies { grid-template-columns: 1fr; } }

/* ---------- Page head (inner pages) ---------- */
.pagehead { background: var(--teal-900); color: var(--on-teal); }
.pagehead-in { width: var(--wrap); margin-inline: auto; padding-block: clamp(40px, 5vw, 72px) clamp(32px, 4vw, 52px); display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 32px; align-items: end; }
.pagehead h1 { font-size: clamp(2rem, 4vw, 3.2rem); }
.pagehead p { margin-top: 14px; color: var(--on-teal-2); font-size: 1.1rem; max-width: 60ch; }
.pagehead .drawing { color: var(--teal-300); max-width: 360px; justify-self: end; }
.pagehead .crumb { display: inline-flex; align-items: center; gap: 6px; color: var(--on-teal-2); font-size: 0.9rem; text-decoration: none; margin-top: 20px; }
.pagehead .crumb:hover { color: var(--on-teal); }
.pagehead .btn { margin-top: 24px; }
@media (max-width: 860px) {
  .pagehead-in { grid-template-columns: 1fr; }
  .pagehead .drawing { justify-self: start; max-width: 260px; }
}

/* ---------- Body text blocks ---------- */
.prose { max-width: 70ch; display: grid; gap: 18px; color: var(--ink-2); font-size: 1.08rem; }
.prose .lead { color: var(--ink); font-size: clamp(1.15rem, 1.6vw, 1.32rem); }
.cols-2 { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 80px); align-items: start; }
@media (max-width: 860px) { .cols-2 { grid-template-columns: 1fr; } }
.checks { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px; border-top: 1px solid var(--rule-strong); }
.checks li { display: flex; gap: 10px; align-items: baseline; padding: 15px 0; border-bottom: 1px solid var(--rule); font-weight: 700; }
.checks .icon { color: var(--teal-600); }
@media (max-width: 560px) { .checks { grid-template-columns: 1fr; } }
.sub-h { font-size: 1.15rem; margin-bottom: 14px; }
.onward { display: flex; flex-wrap: wrap; gap: 14px 28px; margin-top: 36px; }

/* ---------- Discipline page ---------- */
.caps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px; border-top: 1px solid var(--rule-strong); }
.caps li { display: flex; gap: 10px; align-items: baseline; padding: 16px 0; border-bottom: 1px solid var(--rule); font-size: 1.05rem; font-weight: 700; }
.caps .icon { color: var(--teal-600); }
@media (max-width: 560px) { .caps { grid-template-columns: 1fr; } }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; border-top: 1px solid var(--rule-strong); padding-top: 22px; margin-top: 56px; }
.pager a { display: grid; gap: 4px; text-decoration: none; }
.pager a[rel='next'] { text-align: end; }
.pager .k { color: var(--ink-3); font-size: 0.88rem; }
.pager .v { font-weight: 800; font-size: 1.08rem; }
.pager a:hover .v { color: var(--teal-700); }
@media (max-width: 560px) { .pager { grid-template-columns: 1fr; } .pager a[rel='next'] { text-align: start; } }

/* ---------- Tabs ---------- */
.tablist { display: flex; flex-wrap: wrap; gap: 0 28px; border-bottom: 1px solid var(--rule-strong); margin-bottom: 28px; }
.tablist [role='tab'] { position: relative; min-height: 54px; padding: 0; border: 0; background: transparent; color: var(--ink-3); font-weight: 700; font-size: 1.02rem; display: inline-flex; align-items: center; gap: 8px; }
.tablist [role='tab']:hover { color: var(--ink); }
.tablist [role='tab'][aria-selected='true'] { color: var(--teal-800); }
.tablist [role='tab'][aria-selected='true']::after { content: ''; position: absolute; inset-inline: 0; bottom: -1px; height: 3px; background: var(--teal-700); }
.tablist .count { font-size: 0.78rem; min-width: 24px; height: 22px; padding: 0 7px; display: inline-grid; place-items: center; border-radius: 2px; background: var(--mist); color: var(--ink-2); }
.teal .tablist { border-bottom-color: rgba(242, 247, 247, 0.3); }
.teal .tablist [role='tab'] { color: var(--on-teal-2); }
.teal .tablist [role='tab']:hover, .teal .tablist [role='tab'][aria-selected='true'] { color: var(--on-teal); }
.teal .tablist [role='tab'][aria-selected='true']::after { background: var(--orange); }
.teal .tablist .count { background: var(--teal-800); color: var(--on-teal); }
.tabpanel:focus-visible { outline-offset: 6px; }

/* ---------- Project page ---------- */
.proj-hero { margin: 0; aspect-ratio: 21 / 9; max-height: 520px; width: 100%; background: var(--teal-100); position: relative; overflow: hidden; }
.proj-hero img { width: 100%; height: 100%; object-fit: cover; }
.proj-hero .fallback { position: absolute; inset: 12% 20%; color: var(--teal-600); display: none; }
.proj-hero.nophoto img { display: none; }
.proj-hero.nophoto .fallback { display: block; }
.facts { margin: 0; border-top: 1px solid var(--rule-strong); }
.facts > div { display: grid; grid-template-columns: 9em 1fr; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.facts dt { color: var(--ink-3); font-size: 0.92rem; }
.facts dd { margin: 0; font-weight: 700; }
@media (max-width: 560px) { .facts > div { grid-template-columns: 1fr; gap: 2px; } }

/* ---------- Equipment / journey / values / leadership ---------- */
.list-ruled { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 28px; border-top: 1px solid var(--rule-strong); }
.list-ruled li { padding: 15px 0; border-bottom: 1px solid var(--rule); font-weight: 700; display: flex; gap: 10px; align-items: baseline; }
.list-ruled .tick { width: 12px; height: 2px; background: var(--teal-600); flex: none; transform: translateY(-0.3em); }
.teal .list-ruled { border-top-color: rgba(242, 247, 247, 0.25); }
.teal .list-ruled li { border-bottom-color: rgba(242, 247, 247, 0.16); }
.teal .list-ruled .tick { background: var(--orange); }
@media (max-width: 860px) { .list-ruled { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .list-ruled { grid-template-columns: 1fr; } }
.features { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--rule-strong); }
.features li { padding: 22px 22px 22px 0; border-bottom: 1px solid var(--rule); }
html[dir='rtl'] .features li { padding: 22px 0 22px 22px; }
.features .icon { width: 28px; height: 28px; color: var(--teal-600); }
.features h3 { font-size: 1.05rem; margin: 12px 0 6px; }
.features p { color: var(--ink-2); font-size: 0.95rem; }
.teal .features { border-top-color: rgba(242, 247, 247, 0.25); }
.teal .features li { border-bottom-color: rgba(242, 247, 247, 0.16); }
.teal .features .icon { color: var(--orange); }
.teal .features p { color: var(--on-teal-2); }
@media (max-width: 960px) { .features { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .features { grid-template-columns: 1fr; } }
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline li { display: grid; grid-template-columns: 7rem minmax(0, 1fr); gap: 28px; padding: 22px 0; border-bottom: 1px solid var(--rule); }
.timeline .yr { font-size: 1.6rem; font-weight: 800; color: var(--teal-700); font-variant-numeric: tabular-nums; }
.timeline h3 { font-size: 1.15rem; }
.timeline p { color: var(--ink-2); margin-top: 4px; }
@media (max-width: 560px) { .timeline li { grid-template-columns: 4.6rem minmax(0, 1fr); gap: 16px; } .timeline .yr { font-size: 1.25rem; } }
.values { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px; border-top: 1px solid var(--rule-strong); }
.values li { padding: 16px 0; border-bottom: 1px solid var(--rule); }
.values strong { display: block; font-size: 1.08rem; }
.values span { color: var(--ink-2); }
@media (max-width: 640px) { .values { grid-template-columns: 1fr; } }
.leaders { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(28px, 4vw, 56px); }
.leader { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 24px; align-items: start; border-top: 1px solid var(--rule-strong); padding-top: 24px; }
.portrait { width: 160px; aspect-ratio: 4 / 5; background: var(--teal-100); overflow: hidden; position: relative; margin: 0; }
.portrait img { width: 100%; height: 100%; object-fit: cover; }
.portrait .fallback { position: absolute; inset: 0; display: none; place-items: center; color: var(--teal-600); }
.portrait .fallback .icon { width: 44px; height: 44px; }
.portrait.nophoto img { display: none; }
.portrait.nophoto .fallback { display: grid; }
.leader h2 { font-size: 1.35rem; }
.leader .role { color: var(--teal-700); font-weight: 700; margin-top: 2px; }
.leader .bio { color: var(--ink-2); margin-top: 12px; }
.tags { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.tags li { font-size: 0.85rem; padding: 4px 10px; background: var(--mist); border-radius: 2px; }
@media (max-width: 980px) { .leaders { grid-template-columns: 1fr; } }
@media (max-width: 520px) { .leader { grid-template-columns: 1fr; } .portrait { width: 130px; } }
.quote { margin: 0; max-width: 46em; }
.quote blockquote { margin: 0; font-size: clamp(1.3rem, 2.4vw, 1.9rem); line-height: 1.7; font-weight: 700; }
.quote figcaption { margin-top: 20px; color: var(--on-teal-2); }
.quote figcaption strong { color: var(--on-teal); display: block; }
.quote figcaption::before { content: ''; display: block; width: 44px; height: 2px; background: var(--orange); margin-bottom: 14px; }

/* ---------- Forms ---------- */
.sheet-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 72px); align-items: start; }
.sheet { background: var(--white); border: 1px solid var(--rule); border-top: 3px solid var(--teal-700); padding: clamp(22px, 3vw, 40px); box-shadow: 0 18px 40px -30px rgba(13, 53, 54, 0.45); }
.sheet h2 { font-size: 1.45rem; }
.sheet > p { color: var(--ink-2); margin-top: 6px; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 20px; margin-top: 22px; }
.field { display: grid; gap: 6px; align-content: start; }
.field.full { grid-column: 1 / -1; }
.field label, .field .label { font-size: 0.93rem; font-weight: 700; }
.field input, .field select, .field textarea { width: 100%; min-height: 48px; padding: 10px 14px; background: var(--white); border: 1px solid var(--rule-strong); border-radius: 2px; font-size: 1rem; transition: border-color 140ms var(--ease), box-shadow 140ms var(--ease); }
.field textarea { min-height: 140px; resize: vertical; line-height: 1.6; }
.field ::placeholder { color: #6a7776; }
.field input:hover, .field select:hover, .field textarea:hover { border-color: var(--ink-3); }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--teal-700); box-shadow: 0 0 0 3px rgba(36, 112, 111, 0.22); }
.field [aria-invalid='true'], .field [aria-invalid='true']:focus { border-color: var(--danger); }
.field [aria-invalid='true']:focus { box-shadow: 0 0 0 3px rgba(176, 38, 28, 0.2); }
.err { color: var(--danger); font-size: 0.86rem; display: flex; gap: 6px; align-items: center; }
.err[hidden] { display: none; }
.hint { color: var(--ink-3); font-size: 0.85rem; }
.file-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.file-row span { color: var(--ink-3); font-size: 0.9rem; }
.form-foot { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.notice { margin-top: 20px; padding: 14px 16px; display: flex; gap: 10px; align-items: flex-start; background: #e2f1e8; color: #174d31; }
.aside h2 { font-size: 1.1rem; padding-bottom: 10px; border-bottom: 1px solid var(--rule-strong); }
.office { list-style: none; margin: 0; padding: 0; }
.office li { display: grid; grid-template-columns: 22px 7em 1fr; gap: 10px; align-items: baseline; padding: 13px 0; border-bottom: 1px solid var(--rule); }
.office .k { color: var(--ink-3); font-size: 0.9rem; }
.office .icon { color: var(--teal-600); }
.sheet-solo { max-width: 860px; }
@media (max-width: 960px) { .sheet-grid { grid-template-columns: 1fr; } }
@media (max-width: 600px) { .fields { grid-template-columns: 1fr; } }
.roles { width: 100%; border-collapse: collapse; border-top: 1px solid var(--rule-strong); }
.roles th { text-align: start; font-size: 0.85rem; color: var(--ink-3); font-weight: 700; padding: 12px 12px 12px 0; border-bottom: 1px solid var(--rule-strong); }
.roles td { padding: 16px 12px 16px 0; border-bottom: 1px solid var(--rule); }
html[dir='rtl'] .roles th, html[dir='rtl'] .roles td { padding: 12px 0 12px 12px; }
.roles td.t { font-weight: 800; }
.roles .btn { min-height: 40px; font-size: 0.9rem; padding: 6px 14px; }
@media (max-width: 820px) {
  .roles thead { display: none; }
  .roles, .roles tbody, .roles tr, .roles td { display: block; }
  .roles tr { padding: 14px 0; border-bottom: 1px solid var(--rule); }
  .roles td { border: 0; padding: 2px 0 !important; }
  .roles td.k::before { content: attr(data-k) ' · '; color: var(--ink-3); font-size: 0.85rem; }
  .roles td:last-child { padding-top: 10px !important; }
}

/* ---------- Footer ---------- */
.footer { background: var(--teal-950); color: var(--on-teal-2); }
.footer-in { width: var(--wrap); margin-inline: auto; padding-block: 52px 32px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 40px; }
.footer img { height: 36px; width: auto; }
.footer h2 { font-size: 0.95rem; color: var(--on-teal); margin-bottom: 14px; }
.footer ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 24px; font-size: 0.93rem; }
.footer a { color: var(--on-teal-2); text-decoration: none; }
.footer a:hover { color: var(--on-teal); }
.footer-base { width: var(--wrap); margin-inline: auto; border-top: 1px solid rgba(242, 247, 247, 0.12); padding-block: 18px 26px; font-size: 0.85rem; }
@media (max-width: 760px) { .footer-in { grid-template-columns: 1fr; } }
@media (max-width: 420px) { .footer ul { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ---------- Motion ---------- */
.fade-in { animation: fade 420ms var(--ease) both; }
@keyframes fade { from { opacity: 0.4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- Review fixes ---------- */
/* hero text stays on a solid scrim until the layout is wide enough to hold it at the inline-start */
@media (max-width: 1180px) { .hero::after, html[dir='ltr'] .hero::after { background: rgba(11, 44, 45, 0.86); } }
.hero-in { padding-block: 64px 72px; }
/* home disciplines: each row carries its discipline's drawing as a small marker */
.disc-list a { justify-content: flex-start; }
.disc-list .mark { width: 46px; flex: none; color: var(--teal-600); }
.disc-list .name { flex: 1; }
/* home approvals: one ruled row of names */
.names { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; border-top: 1px solid rgba(242, 247, 247, 0.25); border-bottom: 1px solid rgba(242, 247, 247, 0.25); }
.names li { padding: 16px 22px; font-weight: 700; border-inline-end: 1px solid rgba(242, 247, 247, 0.16); }
.names li:first-child { padding-inline-start: 0; }
.names li:last-child { border-inline-end: 0; }
/* equipment support: ruled list */
.ruled-desc { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule-strong); }
.ruled-desc li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; padding: 18px 0; border-bottom: 1px solid var(--rule); }
.ruled-desc .icon { color: var(--teal-600); margin-top: 4px; }
.ruled-desc h3 { font-size: 1.08rem; }
.ruled-desc p { color: var(--ink-2); margin-top: 4px; max-width: 70ch; }

/* approvals on a fixed grid: ISO codes in one row of three, bodies in a ruled grid */
.names { display: grid; flex-wrap: nowrap; border-bottom: 0; }
.names li { padding: 16px 0; border-inline-end: 0; border-bottom: 1px solid rgba(242, 247, 247, 0.16); }
.names li:first-child { padding-inline-start: 0; }
.names.iso { grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 24px; font-size: 1.15rem; }
.names.bodies-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 24px; border-top: 0; }
@media (max-width: 1020px) { .names.bodies-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .names.bodies-grid { grid-template-columns: 1fr; } .names.iso { grid-template-columns: 1fr; } }
/* services cards: fixed rows so titles and links align across each row */
.disc-grid a { grid-template-rows: auto auto minmax(1.6em, auto) 1fr; }
.disc-grid .go { align-self: end; }

/* One on-screen line weight (~2px) wherever a drawing appears; the stroke
   scales with the drawing, so each context sets its own value. */
.disc-grid .drawing { stroke-width: 1.5; }
.disc-list .mark .drawing { stroke-width: 9; }
.pagehead .drawing { stroke-width: 1.4; }
.proj .photo .fallback .drawing { stroke-width: 1.3; }
.proj-hero .fallback .drawing { stroke-width: 0.7; }
.hero .photo .fallback .drawing { stroke-width: 0.7; }

  </style>

  function parseHash() {
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);

    const page = PAGES.includes(parts[0] || '') ? (parts[0] || '') : '';
    let sub = parts[1] || '';
    if (page === 'services' && !Object.values(SVC).some((v) => v.slug === sub)) sub = '';
    if (page === 'projects' && !content.en.projects.items.some((p) => projSlug(p.id) === sub)) sub = '';
    if (page !== 'services' && page !== 'projects') sub = '';
    return { lang, page, sub };

  function selectTab(btn, focus) {
    const id = btn.dataset.tab, key = btn.dataset.key;

          <li>${icon('map-pin')}<span class="k">${esc(U.office)}</span><span>${esc(C.address)}</span></li>
          <li>${icon('phone')}<span class="k">${esc(U.mobile)}</span><a href="tel:${C0.mobile.replace(/\s/g, '')}"><span class="ltr num">${esc(C0.mobile)}</span></a></li>
          <li>${icon('clock')}<span class="k">${esc(C.hoursHeading)}</span><span>${C.hours.map(esc).join('<br>')}</span></li>
        </ul></aside>
      </div></section>`;
  }

  function pageCareers() {
    const T = t(), K = T.careers, U = ui();
    const ic = { Layers: 'layers', GraduationCap: 'graduation-cap', HardHat: 'hard-hat', ShieldCheck: 'shield-check', Briefcase: 'briefcase' };
    return `${pagehead(K.title, K.lead, `<a class="btn btn-outline-light" href="#apply" data-jump="apply">${esc(K.cta)}</a>`)}
      <section class="band mist"><div class="wrap"><div class="head"><h2>${esc(K.whyTitle)}</h2></div>
        <ul class="features">${K.why.map((w) => `<li>${icon(ic[w.icon] || 'layers')}<h3>${esc(w.title)}</h3><p>${esc(w.desc)}</p></li>`).join('')}</ul></div></section>
      <section class="band"><div class="wrap"><div class="head"><div><h2>${esc(K.rolesTitle)}</h2><p>${esc(K.rolesLead)}</p></div></div>
        <table class="roles"><thead><tr><th scope="col">${esc(U.role)}</th><th scope="col">${esc(U.dept)}</th><th scope="col">${esc(U.loc)}</th><th scope="col">${esc(U.type)}</th><th scope="col">${esc(U.exp)}</th><th scope="col"><span class="visually-hidden">${esc(U.apply)}</span></th></tr></thead>
        <tbody>${K.roles.map((r) => `<tr><td class="t">${esc(r.title)}</td><td class="k" data-k="${esc(U.dept)}">${esc(r.dept)}</td><td class="k" data-k="${esc(U.loc)}">${esc(r.location)}</td><td class="k" data-k="${esc(U.type)}">${esc(r.type)}</td><td class="k" data-k="${esc(U.exp)}">${esc(r.exp)}</td><td><button class="btn btn-outline" type="button" data-role="${r.slug}">${esc(U.apply)}</button></td></tr>`).join('')}</tbody></table>
      </div></section>
      <section class="band mist" id="apply"><div class="wrap sheet-solo">
        <form class="sheet" id="apply-form" novalidate>
          <h2>${esc(K.applyTitle)}</h2><p>${esc(K.applyLead)}</p>
          <div class="fields">
            ${field('a-name', K.fields.name, `<input id="a-name" name="name" autocomplete="name" placeholder="${esc(K.placeholders.name)}" aria-describedby="a-name-err">`, K.errors.name)}
            ${field('a-email', K.fields.email, `<input id="a-email" name="email" type="email" autocomplete="email" dir="ltr" placeholder="${esc(K.placeholders.email)}" aria-describedby="a-email-err">`, K.errors.email)}
            ${field('a-phone', K.fields.phone, `<input id="a-phone" name="phone" type="tel" autocomplete="tel" dir="ltr" placeholder="${esc(K.placeholders.phone)}" aria-describedby="a-phone-err">`, K.errors.phone)}
            ${field('a-exp', K.fields.exp, `<input id="a-exp" name="exp" type="number" min="0" max="60" inputmode="numeric" placeholder="${esc(K.placeholders.exp)}" aria-describedby="a-exp-err">`, K.errors.exp)}
            ${field('a-role', K.fields.role, `<select id="a-role" name="role" aria-describedby="a-role-err"><option value="">${esc(K.placeholders.role)}</option>${K.roles.map((r) => `<option value="${r.slug}"${state.role === r.slug ? ' selected' : ''}>${esc(r.title)}</option>`).join('')}<option value="other">${esc(K.otherRole)}</option></select>`, K.errors.role, true)}
            <div class="field full"><span class="label" id="a-cv-l">${esc(K.fields.cv)}</span>
              <label class="visually-hidden" for="a-cv">${esc(K.cvLink)}</label>
              <input id="a-cv" name="cv" type="url" dir="ltr" placeholder="${esc(K.placeholders.cv)}" aria-describedby="a-cv-l a-cv-hint a-cv-err">
              <div class="file-row"><label class="btn btn-outline" for="a-file">${icon('upload')}${esc(K.cvUploadBtn)}</label><input id="a-file" type="file" accept=".pdf,.doc,.docx" class="visually-hidden"><span id="a-file-name">${esc(K.cvNone)}</span></div>
              <span class="hint" id="a-cv-hint">${esc(K.cvHint)}</span>
              <span class="err" id="a-cv-err" hidden>${icon('circle-alert')}<span>${esc(K.errors.cv)}</span></span></div>
            ${field('a-note', K.fields.note, `<textarea id="a-note" name="note" placeholder="${esc(K.placeholders.note)}"></textarea>`, '', true)}
          </div>
          <div class="form-foot"><button class="btn btn-teal" type="submit">${icon('send', 'flip')}<span>${esc(K.submit)}</span></button></div>
          <div id="apply-status" aria-live="polite"></div>
        </form>
      </div></section>`;
  }

  const PAGE_FN = { '': pageHome, about: pageAbout, services: pageServices, projects: pageProjects, equipment: pageEquipment, certifications: pageCerts, journey: pageJourney, leadership: pageLeadership, contact: pageContact, careers: pageCareers };

  function pageTitle() {
    const T = t();
    if (state.page === 'services' && state.sub) return `${T.services.items[svcIndexBySlug(state.sub)].title} — ${T.brandLine}`;
    if (state.page === 'projects' && state.sub) return `${projBySlug(state.sub).title} — ${T.brandLine}`;
    if (!state.page) return `${T.brandLine} — ${T.hero.title}`;
    if (state.page === 'careers') return `${T.careers.title} — ${T.brandLine}`;
    return `${T.nav.find((n) => n.id === state.page)?.label || ''} — ${T.brandLine}`;
  }

  // ---------- drawings draw once as they enter ----------
  let io = null;
  function observeDrawings() {
    if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    document.documentElement.classList.add('anim');
    io = io || new IntersectionObserver((entries) => entries.forEach((e) => {
      if (e.isIntersecting) {
        const d = e.target;
        d.classList.add('drawn'); io.unobserve(d);
        setTimeout(() => d.classList.add('done'), 1250);
      }
    }), { threshold: 0.25 });
    $$('.drawing:not(.drawn)').forEach((d) => io.observe(d));
  }

  // ---------- render ----------
  let lastKey = '';
  function render(force = false) {
    const { lang, page, sub } = parseHash();
    const changed = lang !== state.lang || page !== state.page || sub !== state.sub;
    Object.assign(state, { lang, page, sub });
    const key = `${lang}/${page}/${sub}`;
    if (!force && key === lastKey) return;
    lastKey = key;
    if (page !== 'contact') state.prefill = null;
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.title = pageTitle();
    $('.skip').textContent = ui().skip;
    $('#proto-note').textContent = ui().proto;
    $('#topbar').innerHTML = topbar();
    $('#masthead').innerHTML = masthead();
    $('#main').innerHTML = (page === 'services' && sub) ? pageService() : (page === 'projects' && sub) ? pageProject() : PAGE_FN[page]();
    $('#footer').innerHTML = footer();
    if (changed || force) scrollTo({ top: 0, behavior: 'auto' });
    if (state.jump) { const el = document.getElementById(state.jump); state.jump = null; el?.scrollIntoView(); }
    observeDrawings();
  }

  // ---------- forms ----------
  const validEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
  function setErr(id, bad, msg) {
    const input = document.getElementById(id), err = document.getElementById(`${id}-err`);
    if (err && msg) err.lastChild.textContent = msg;
    input?.setAttribute('aria-invalid', String(bad));
    if (err) err.hidden = !bad;
    return bad;
  }
  function submitLike(form, statusId, okText, busyText) {
    const btn = $('button[type=submit]', form), label = $('span:last-child', btn);
    const before = label.textContent;
    btn.setAttribute('aria-busy', 'true'); btn.disabled = true; label.textContent = busyText;
    setTimeout(() => {
      btn.removeAttribute('aria-busy'); btn.disabled = false; label.textContent = before;
      document.getElementById(statusId).innerHTML = `<div class="notice" role="status">${icon('check')}<div><strong>${esc(okText)}</strong><br><span>${esc(ui().protoSent)}</span></div></div>`;
      form.reset();
    }, 900);
  }

  // ---------- events ----------
  document.addEventListener('click', (e) => {
    const el = e.target.closest('button, a');
    if (!el) return;
    const T = t();
    if (el.matches('.menu-btn')) {
      const d = $('#drawer'), open = !d.classList.contains('open');
      d.style.top = `${Math.max(0, $('#masthead').getBoundingClientRect().bottom)}px`;
      d.classList.toggle('open', open); el.setAttribute('aria-expanded', String(open));
      el.innerHTML = icon(open ? 'x' : 'menu'); el.setAttribute('aria-label', open ? ui().close : ui().menu);
      if (open) $('a', d)?.focus();
      return;
    }
    if (el.closest('.drawer')) $('#drawer').classList.remove('open');
    if (el.matches('[role=tab]')) { selectTab(el); return; }
    if (el.dataset.filter) {
      state.filter = el.dataset.filter;
      const scrollY0 = scrollY; $('#main').innerHTML = pageProjects(); scrollTo(0, scrollY0);
      $(`[data-filter="${state.filter}"]`)?.focus(); observeDrawings();
      return;
    }
    if (el.dataset.request) { go('contact', { type: el.dataset.type || '', message: `${el.dataset.request}: ` }); return; }
    if (el.dataset.role) {
      state.role = el.dataset.role;
      const sel = $('#a-role'); if (sel) sel.value = state.role;
      $('#apply').scrollIntoView({ behavior: 'smooth' }); setTimeout(() => $('#a-name')?.focus({ preventScroll: true }), 450);
      return;
    }
    if (el.dataset.jump) { e.preventDefault(); document.getElementById(el.dataset.jump)?.scrollIntoView({ behavior: 'smooth' }); return; }
    if (el.hasAttribute('data-quote')) {
      state.prefill = null;
      if (state.page === 'services' && state.sub) {
        const s = T.services.items[svcIndexBySlug(state.sub)];
        state.prefill = { type: svcOf(s).type, message: `${T.services.inquireCta} ${s.title}: ` };
      } else if (state.page === 'projects' && state.sub) {
        const p = projBySlug(state.sub);
        state.prefill = { type: CAT_TYPE[p.key] || 'other', message: `${T.projects.detailsCta}: ${p.title} — ` };
      } else if (state.page === 'equipment') {
        state.prefill = { type: 'equipment-rental', message: `${T.equipment.cta}: ` };
      } else if (state.page === 'certifications') {
        state.prefill = { type: '', message: `${T.certifications.cta}: ` };
      }
    }
  });

  document.addEventListener('keydown', (e) => {
    const tab = e.target.closest?.('[role=tab]');
    if (tab && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
      const list = $$('[role=tab]', tab.parentElement), i = list.indexOf(tab);
      const fwd = rtl() ? 'ArrowLeft' : 'ArrowRight';
      const j = e.key === 'Home' ? 0 : e.key === 'End' ? list.length - 1 : (i + (e.key === fwd ? 1 : -1) + list.length) % list.length;
      e.preventDefault(); selectTab(list[j], true); return;
    }
    if (e.key === 'Escape' && $('#drawer')?.classList.contains('open')) { $('.menu-btn').click(); $('.menu-btn').focus(); }
  });

  document.addEventListener('change', (e) => {
    if (e.target.id === 'a-file') { const f = e.target.files[0]; $('#a-file-name').textContent = f ? f.name : t().careers.cvNone; if (f) setErr('a-cv', false); }
  });

  document.addEventListener('submit', (e) => {
    e.preventDefault();
    const form = e.target, v = (n) => (form.elements[n]?.value || '').trim();
    if (form.id === 'quote-form') {
      const C = t().contact;
      const bad = [setErr('f-name', !v('name')), setErr('f-email', !validEmail(v('email')), v('email') ? C.errors.email : ui().emailRequired), setErr('f-company', !v('company')), setErr('f-message', v('message').length < 10)];
      const first = ['f-name', 'f-email', 'f-company', 'f-message'][bad.indexOf(true)];
      if (first) { document.getElementById(first).focus(); return; }
      submitLike(form, 'quote-status', C.success, C.submitting);
    }
    if (form.id === 'apply-form') {
      const K = t().careers, hasFile = !!$('#a-file').files.length;
      const bad = [setErr('a-name', !v('name')), setErr('a-email', !validEmail(v('email')), v('email') ? K.errors.email : ui().emailRequired), setErr('a-phone', !v('phone')), setErr('a-exp', v('exp') === ''), setErr('a-role', !v('role')), setErr('a-cv', !v('cv') && !hasFile)];
      const first = ['a-name', 'a-email', 'a-phone', 'a-exp', 'a-role', 'a-cv'][bad.indexOf(true)];
      if (first) { document.getElementById(first).focus(); return; }
      submitLike(form, 'apply-status', K.success, K.submitting);
      $('#a-file-name').textContent = K.cvNone;
    }
  });

  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.getAttribute('aria-invalid') !== 'true') return;
    const ok = el.type === 'email' ? validEmail(el.value.trim()) : el.id === 'f-message' ? el.value.trim().length >= 10 : !!el.value.trim();
    if (ok) setErr(el.id, false);
  });

  addEventListener('hashchange', () => render());
  render(true);
})();

  </script>
</body>
</html>
