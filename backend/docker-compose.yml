# Optional: a throwaway PostgreSQL for local development. Version 18 matches
# the Neon project, so pg_dump in this container can back up Neon too.
# Point DATABASE_URL at postgres://sacc:sacc@localhost:5433/sacc to use it.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sacc
      POSTGRES_USER: sacc
      POSTGRES_PASSWORD: sacc
    ports:
      - "5433:5432"
    volumes:
      - sacc_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sacc -d sacc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sacc_pgdata:
