# Render Blueprint — web service only.
#
# There is deliberately no `databases:` block. Render's free PostgreSQL is
# deleted 30 days after creation (plus a 14-day grace period), which would take
# the site's content and every stored enquiry with it. The database lives on
# Neon instead, whose free tier is permanent — set DATABASE_URL in the Render
# dashboard to the connection string Neon gives you.
#
# See README, "Running this for free", for the full setup.
#
# Deploy: push to GitHub, then in Render choose "New > Blueprint" and point it
# at the repo. rootDir is set because the Django project is not at the
# repository root.

services:
  - type: web
    name: sacc-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60
    healthCheckPath: /api/v1/health/
    envVars:
      # From Neon (or any external PostgreSQL). Set in the dashboard — it
      # contains a password, so it must never be committed here.
      - key: DATABASE_URL
        sync: false

      # Generated once by Render and kept across deploys, so the key never
      # exists in source control.
      - key: SECRET_KEY
        generateValue: true

      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DEBUG
        value: "False"

      # Neon closes idle connections, and the free web service sleeps, so
      # persistent connections are a liability rather than a saving.
      - key: DB_CONN_MAX_AGE
        value: "0"

      # ALLOWED_HOSTS picks up the .onrender.com hostname automatically;
      # these are the live domains.
      - key: ALLOWED_HOSTS
        value: saccgroup.net,www.saccgroup.net
      - key: CORS_ALLOWED_ORIGINS
        value: https://saccgroup.net,https://www.saccgroup.net
      - key: CSRF_TRUSTED_ORIGINS
        value: https://saccgroup.net,https://www.saccgroup.net

      # The admin account, created on first deploy by bootstrap_site. Render's
      # Shell is a paid feature, so createsuperuser cannot be run by hand on the
      # free plan — set these in the dashboard instead. Once the account exists
      # they are ignored, and the password can be changed from the admin.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

      # Set in the Render dashboard, not here — these are secrets.
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: DEFAULT_FROM_EMAIL
        value: SACC Website <no-reply@saccgroup.net>
      - key: LEAD_NOTIFICATION_RECIPIENTS
        sync: false

      # Uploaded CVs must not live on the container filesystem — it is wiped on
      # every deploy. Cloudflare R2 has a free tier that covers this comfortably.
      # See README, "Uploaded files".
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
